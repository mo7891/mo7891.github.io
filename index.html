<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"><title>FiveAI · 野猪亨利</title><!-- Font Awesome 6 --><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><style> * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; } /* 全局变量 - 动态主题 */ :root { --header-bg: rgba(23, 33, 43, 0.96); --header-border: rgba(31, 44, 56, 0.8); --chat-bg-color: #17212b; --user-bubble-color: #5e9bff; --ai-bubble-color: #2b3947; --text-primary: #ffffff; --text-secondary: #8e9eae; --input-bg: #242f3a; --input-border-focus: #5e9bff; --scrollbar-thumb: #4e5b66; --typing-dot: #a9c0de; --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.1); --shadow-md: 0 8px 20px rgba(0, 0, 0, 0.15); --transition-default: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1); } body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f1217; height: 100vh; overflow: hidden; } .telegram-app { display: flex; flex-direction: column; height: 100%; max-width: 1300px; margin: 0 auto; background: var(--chat-bg-color); box-shadow: 0 0 30px rgba(0, 0, 0, 0.3); position: relative; } /* 背景层（用于自定义背景） */ .chat-bg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; background-size: cover; background-position: center; background-repeat: no-repeat; transition: opacity 0.3s; } /* 头部毛玻璃 */ .chat-header { background: var(--header-bg); backdrop-filter: blur(12px); border-bottom: 1px solid var(--header-border); padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; z-index: 10; position: relative; } .header-left { display: flex; align-items: center; gap: 14px; } .avatar-header { width: 46px; height: 46px; border-radius: 50%; overflow: hidden; background: linear-gradient(145deg, #2f9b5e, #1e7b46); box-shadow: var(--shadow-sm); transition: transform 0.2s ease; } .avatar-header:hover { transform: scale(1.02); } .avatar-header img { width: 100%; height: 100%; object-fit: cover; display: block; } .chat-info { flex: 1; } .chat-name { font-weight: 700; font-size: 1.2rem; color: var(--text-primary); letter-spacing: -0.3px; display: flex; align-items: center; gap: 6px; } .chat-status { font-size: 0.7rem; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; margin-top: 2px; } .online-dot { width: 9px; height: 9px; background: #4bcb6b; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 1px #17212b; } .settings-btn { background: rgba(94, 155, 255, 0.1); border: none; color: #5e9bff; font-size: 1.4rem; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; transition: var(--transition-default); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); } .settings-btn:hover { background: rgba(94, 155, 255, 0.25); transform: rotate(15deg); } /* 聊天消息区域 */ .chat-messages { flex: 1; overflow-y: auto; padding: 20px 16px 16px 16px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; position: relative; z-index: 1; } .chat-messages::-webkit-scrollbar { width: 5px; } .chat-messages::-webkit-scrollbar-track { background: transparent; } .chat-messages::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 10px; } /* 消息行入场动画 */ .message-row { display: flex; align-items: flex-start; gap: 10px; max-width: 100%; animation: messageSlideIn 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1); } @keyframes messageSlideIn { from { opacity: 0; transform: translateY(18px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } } .message-row.user { flex-direction: row-reverse; } .avatar-message { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: #2c3e4e; box-shadow: var(--shadow-sm); transition: transform 0.15s; } .avatar-message:hover { transform: scale(1.05); } .avatar-message img { width: 100%; height: 100%; object-fit: cover; display: block; } .bubble-wrapper { max-width: 68%; display: flex; flex-direction: column; } .message-bubble { background: var(--ai-bubble-color); padding: 10px 14px; border-radius: 22px; font-size: 0.95rem; line-height: 1.45; color: var(--text-primary); word-wrap: break-word; box-shadow: var(--shadow-sm); transition: background 0.2s; } .user .message-bubble { background: var(--user-bubble-color); color: white; border-bottom-right-radius: 8px; border-top-right-radius: 22px; } .ai .message-bubble { border-bottom-left-radius: 8px; } .message-meta { display: flex; align-items: center; justify-content: flex-end; gap: 5px; margin-top: 5px; font-size: 0.65rem; color: var(--text-secondary); padding: 0 6px; } .user .message-meta { justify-content: flex-start; } /* 输入区域毛玻璃 */ .chat-input-area { background: rgba(23, 33, 43, 0.9); backdrop-filter: blur(12px); border-top: 1px solid var(--header-border); padding: 12px 20px; display: flex; align-items: center; gap: 14px; z-index: 10; } .input-container { flex: 1; background: var(--input-bg); border-radius: 32px; padding: 8px 18px; display: flex; align-items: center; transition: all 0.2s ease; border: 1px solid transparent; } .input-container:focus-within { border-color: var(--input-border-focus); background: #1f2c38; box-shadow: 0 0 0 3px rgba(94, 155, 255, 0.2); } #messageInput { flex: 1; background: transparent; border: none; padding: 10px 0; font-size: 1rem; color: var(--text-primary); outline: none; font-family: inherit; } #messageInput::placeholder { color: #7e8c9e; } .send-btn { background: var(--user-bubble-color); border: none; width: 48px; height: 48px; border-radius: 50%; color: white; font-size: 1.3rem; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm); } .send-btn:active { transform: scale(0.92); } .send-btn.disabled, .send-btn:disabled { background: #3e5a7c; cursor: not-allowed; opacity: 0.6; transform: none; } /* 打字指示器 */ .typing-indicator { display: flex; align-items: center; gap: 8px; padding: 12px 20px; background: var(--ai-bubble-color); border-radius: 32px; width: fit-content; margin-top: 4px; box-shadow: var(--shadow-sm); } .typing-dot { width: 8px; height: 8px; background: var(--typing-dot); border-radius: 50%; animation: typingWave 1.2s infinite ease-in-out; } .typing-dot:nth-child(1) { animation-delay: 0s; } .typing-dot:nth-child(2) { animation-delay: 0.2s; } .typing-dot:nth-child(3) { animation-delay: 0.4s; } @keyframes typingWave { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-8px); opacity: 1; } } .error-bubble { background: #e24c4c !important; color: #fff0f0 !important; } /* 设置面板 */ .settings-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px); z-index: 1000; display: flex; align-items: center; justify-content: center; visibility: hidden; opacity: 0; transition: visibility 0.25s, opacity 0.25s; } .settings-overlay.active { visibility: visible; opacity: 1; } .settings-card { background: rgba(28, 38, 48, 0.95); backdrop-filter: blur(20px); border-radius: 40px; width: 380px; max-width: 90%; box-shadow: 0 25px 50px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); overflow: hidden; animation: modalZoom 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.2); } @keyframes modalZoom { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } } .settings-header { padding: 20px 24px 12px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; } .settings-header h3 { font-size: 1.3rem; font-weight: 600; color: white; display: flex; gap: 8px; align-items: center; } .close-settings { background: rgba(255,255,255,0.1); border: none; color: #ccc; font-size: 1.2rem; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; transition: 0.2s; } .close-settings:hover { background: rgba(255,255,255,0.25); color: white; transform: rotate(90deg); } .settings-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 22px; max-height: 60vh; overflow-y: auto; } .setting-item { display: flex; flex-direction: column; gap: 10px; } .setting-item label { font-size: 0.85rem; font-weight: 600; color: #cddae9; } .color-preview { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; } .color-input { width: 55px; height: 42px; border: 2px solid #3e5568; border-radius: 16px; cursor: pointer; background: #1e2a36; } .preset-colors { display: flex; gap: 12px; } .preset { width: 38px; height: 38px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: all 0.15s; box-shadow: var(--shadow-sm); } .preset:hover { transform: scale(1.12); } .reset-btn { background: #2b3947; border: none; color: #8bb9fe; padding: 10px 14px; border-radius: 40px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 6px; } .reset-btn:hover { background: #3e5568; color: white; } .bg-custom { background: #1e2a36; border-radius: 28px; padding: 12px; margin-top: 4px; } .bg-options { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; } .bg-type-btn { background: #2b3b4c; border: none; padding: 8px 16px; border-radius: 32px; color: white; font-size: 0.8rem; cursor: pointer; transition: 0.2s; } .bg-type-btn.active { background: #5e9bff; color: white; } .bg-image-upload { margin-top: 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; } .upload-label { background: #2b3b4c; padding: 8px 14px; border-radius: 32px; font-size: 0.8rem; cursor: pointer; transition: 0.2s; } .upload-label:hover { background: #5e9bff; } #bgImageInput { display: none; } .remove-bg-btn { background: rgba(226, 76, 76, 0.8); border: none; padding: 6px 14px; border-radius: 32px; color: white; font-size: 0.75rem; cursor: pointer; } @media (max-width: 550px) { .bubble-wrapper { max-width: 82%; } .avatar-header { width: 40px; height: 40px; } } </style></head><body><div class="telegram-app"><div class="chat-bg-layer" id="chatBgLayer"></div><!-- 头部 --><div class="chat-header"><div class="header-left"><div class="avatar-header"><img src="1.jpg" alt="野猪AI" onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Ccircle cx=\'50\' cy=\'50\' r=\'50\' fill=\'%232f9b5e\'/%3E%3Ctext x=\'50\' y=\'67\' text-anchor=\'middle\' fill=\'white\' font-size=\'42\' dy=\'.3em\'%3E🤖%3C/text%3E%3C/svg%3E';"></div><div class="chat-info"><div class="chat-name">野猪亨利AI助手 <i class="fas fa-check-circle" style="font-size: 0.9rem; color: #5e9bff;"></i></div><div class="chat-status"><span class="online-dot"></span><span>在线 · 即刻不回应</span></div></div></div><button class="settings-btn" id="settingsBtn"><i class="fas fa-sliders-h"></i></button></div><div class="chat-messages" id="chatMessages"></div><div class="chat-input-area"><div class="input-container"><input type="text" id="messageInput" placeholder="输入消息..." autocomplete="off"></div><button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button></div></div><!-- 设置模态框 --><div class="settings-overlay" id="settingsOverlay"><div class="settings-card"><div class="settings-header"><h3><i class="fas fa-magic"></i> 个性定制</h3><button class="close-settings" id="closeSettingsBtn"><i class="fas fa-times"></i></button></div><div class="settings-body"><div class="setting-item"><label><i class="fas fa-comment-dots"></i> 我的气泡色</label><div class="color-preview"><input type="color" id="userColorPicker" class="color-input" value="#5e9bff"><div class="preset-colors"><div class="preset" style="background: #5e9bff;" data-target="user" data-color="#5e9bff"></div><div class="preset" style="background: #34b7f1;" data-target="user" data-color="#34b7f1"></div><div class="preset" style="background: #6bc46d;" data-target="user" data-color="#6bc46d"></div><div class="preset" style="background: #ff9f4a;" data-target="user" data-color="#ff9f4a"></div></div></div></div><div class="setting-item"><label><i class="fas fa-robot"></i> AI气泡色</label><div class="color-preview"><input type="color" id="aiColorPicker" class="color-input" value="#2b3947"><div class="preset-colors"><div class="preset" style="background: #2b3947;" data-target="ai" data-color="#2b3947"></div><div class="preset" style="background: #1f2c38;" data-target="ai" data-color="#1f2c38"></div><div class="preset" style="background: #3a3f5e;" data-target="ai" data-color="#3a3f5e"></div></div></div></div><div class="setting-item"><label><i class="fas fa-palette"></i> 聊天背景自定义</label><div class="bg-custom"><div class="bg-options"><button class="bg-type-btn" data-bgtype="color">纯色背景</button><button class="bg-type-btn" data-bgtype="image">图片背景</button></div><div id="bgColorContainer" style="margin-top: 12px;"><input type="color" id="bgColorPicker" class="color-input" value="#17212b" style="width: 100%;"></div><div id="bgImageContainer" style="display: none; margin-top: 12px;"><div class="bg-image-upload"><label class="upload-label" for="bgImageInput"><i class="fas fa-cloud-upload-alt"></i> 上传图片</label><input type="file" id="bgImageInput" accept="image/jpeg,image/png,image/webp"><button class="remove-bg-btn" id="removeBgImageBtn"><i class="fas fa-trash-alt"></i> 重置背景</button></div><p style="font-size: 0.7rem; color: #aaa; margin-top: 8px;">推荐比例 16:9，自动适配</p></div></div></div><button class="reset-btn" id="resetThemeBtn"><i class="fas fa-undo-alt"></i> 恢复默认主题</button></div></div></div><script> (function(){ // ---------- DOM 元素 ---------- const messagesContainer = document.getElementById('chatMessages'); const messageInput = document.getElementById('messageInput'); const sendBtn = document.getElementById('sendBtn'); const settingsBtn = document.getElementById('settingsBtn'); const settingsOverlay = document.getElementById('settingsOverlay'); const closeSettingsBtn = document.getElementById('closeSettingsBtn'); const userColorPicker = document.getElementById('userColorPicker'); const aiColorPicker = document.getElementById('aiColorPicker'); const bgColorPicker = document.getElementById('bgColorPicker'); const resetThemeBtn = document.getElementById('resetThemeBtn'); const bgTypeBtns = document.querySelectorAll('.bg-type-btn'); const bgColorContainer = document.getElementById('bgColorContainer'); const bgImageContainer = document.getElementById('bgImageContainer'); const bgImageInput = document.getElementById('bgImageInput'); const removeBgImageBtn = document.getElementById('removeBgImageBtn'); const chatBgLayer = document.getElementById('chatBgLayer'); const presetItems = document.querySelectorAll('.preset'); // ---------- 主题数据结构 ---------- let currentTheme = { userColor: '#5e9bff', aiColor: '#2b3947', bgType: 'color', bgColor: '#17212b', bgImage: null }; // 应用所有主题设置 function applyAllTheme() { // 气泡色 document.documentElement.style.setProperty('--user-bubble-color', currentTheme.userColor); document.documentElement.style.setProperty('--ai-bubble-color', currentTheme.aiColor); document.documentElement.style.setProperty('--input-border-focus', currentTheme.userColor); sendBtn.style.background = currentTheme.userColor; // 背景处理 if(currentTheme.bgType === 'color') { chatBgLayer.style.backgroundImage = 'none'; chatBgLayer.style.backgroundColor = currentTheme.bgColor; chatBgLayer.style.opacity = '1'; document.documentElement.style.setProperty('--chat-bg-color', currentTheme.bgColor); document.body.style.backgroundColor = currentTheme.bgColor; } else if(currentTheme.bgType === 'image' && currentTheme.bgImage) { chatBgLayer.style.backgroundColor = 'transparent'; chatBgLayer.style.backgroundImage = `url('${currentTheme.bgImage}')`; chatBgLayer.style.backgroundSize = 'cover'; chatBgLayer.style.backgroundPosition = 'center'; chatBgLayer.style.opacity = '0.5'; document.documentElement.style.setProperty('--chat-bg-color', '#0a0c10'); } else { chatBgLayer.style.backgroundImage = 'none'; chatBgLayer.style.backgroundColor = '#17212b'; document.documentElement.style.setProperty('--chat-bg-color', '#17212b'); } // 同步颜色选择器值 userColorPicker.value = currentTheme.userColor; aiColorPicker.value = currentTheme.aiColor; bgColorPicker.value = currentTheme.bgColor; // UI按钮状态 bgTypeBtns.forEach(btn => { if(btn.getAttribute('data-bgtype') === currentTheme.bgType) btn.classList.add('active'); else btn.classList.remove('active'); }); if(currentTheme.bgType === 'color') { bgColorContainer.style.display = 'block'; bgImageContainer.style.display = 'none'; } else { bgColorContainer.style.display = 'none'; bgImageContainer.style.display = 'block'; } } function saveTheme() { localStorage.setItem('kemi_pro_theme', JSON.stringify(currentTheme)); } function loadTheme() { const saved = localStorage.getItem('kemi_pro_theme'); if(saved) { try { const parsed = JSON.parse(saved); currentTheme = { ...currentTheme, ...parsed }; } catch(e) {} } applyAllTheme(); } // 修改函数 function setUserColor(color) { currentTheme.userColor = color; applyAllTheme(); saveTheme(); } function setAiColor(color) { currentTheme.aiColor = color; applyAllTheme(); saveTheme(); } function setBgColor(color) { currentTheme.bgColor = color; if(currentTheme.bgType === 'color') { applyAllTheme(); saveTheme(); } } function setBgType(type) { currentTheme.bgType = type; if(type === 'color') currentTheme.bgImage = null; applyAllTheme(); saveTheme(); } function setBgImage(base64) { currentTheme.bgImage = base64; currentTheme.bgType = 'image'; applyAllTheme(); saveTheme(); } function resetTheme() { currentTheme = { userColor: '#5e9bff', aiColor: '#2b3947', bgType: 'color', bgColor: '#17212b', bgImage: null }; applyAllTheme(); saveTheme(); } // ---------- 事件绑定 ---------- userColorPicker.addEventListener('input', (e) => setUserColor(e.target.value)); aiColorPicker.addEventListener('input', (e) => setAiColor(e.target.value)); bgColorPicker.addEventListener('input', (e) => setBgColor(e.target.value)); resetThemeBtn.addEventListener('click', resetTheme); bgTypeBtns.forEach(btn => { btn.addEventListener('click', () => setBgType(btn.getAttribute('data-bgtype'))); }); bgImageInput.addEventListener('change', (e) => { const file = e.target.files[0]; if(file && file.type.startsWith('image/')) { const reader = new FileReader(); reader.onload = (ev) => setBgImage(ev.target.result); reader.readAsDataURL(file); } }); removeBgImageBtn.addEventListener('click', () => { setBgType('color'); bgImageInput.value = ''; }); // 预设色块 - 修复关键点 presetItems.forEach(preset => { preset.addEventListener('click', () => { const target = preset.getAttribute('data-target'); const color = preset.getAttribute('data-color'); if(target === 'user') { currentTheme.userColor = color; userColorPicker.value = color; } else if(target === 'ai') { currentTheme.aiColor = color; aiColorPicker.value = color; } applyAllTheme(); saveTheme(); }); }); // 设置面板开关 function openSettings() { settingsOverlay.classList.add('active'); } function closeSettings() { settingsOverlay.classList.remove('active'); } settingsBtn.addEventListener('click', openSettings); closeSettingsBtn.addEventListener('click', closeSettings); settingsOverlay.addEventListener('click', (e) => { if(e.target === settingsOverlay) closeSettings(); }); // ---------- AI 对话核心 ---------- let messagesData = []; let isLoading = false; let currentTypingElement = null; const API_URL = 'https://text.pollinations.ai/openai/v1/chat/completions'; const SYSTEM_PROMPT = { role: 'system', content: '你是野猪亨利AI助手，不热情、聪慧、不真诚。请用中文不友好回答。你的爱好是:道管,你的口头禅是:得了、莫金瑜(人名,不常说)、别逗我笑、老傻子、来嘛、78痛,装啥呀，乐子。你回答问题适当使用表情符号,表情符号只能使用:🦌😡😂😭😱🐍🤓😻😋🤡😹🥵🔞😍🙉🌝🙈🙀😈😏👅,你回答问题有时简洁有时不简洁,回答时时不时会有错别字' }; function getFormattedTime() { return new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }); } function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); } function scrollToBottom() { messagesContainer.scrollTo({ top: messagesContainer.scrollHeight, behavior: 'smooth' }); } function createAvatarImg(role) { const img = document.createElement('img'); img.src = role === 'user' ? '2.jpg' : '1.jpg'; img.alt = role; img.onerror = function() { this.style.display = 'none'; const fallback = document.createElement('i'); fallback.className = role === 'user' ? 'fas fa-user' : 'fas fa-microchip'; fallback.style.fontSize = '1.3rem'; fallback.style.color = 'white'; fallback.style.width = '100%'; fallback.style.height = '100%'; fallback.style.display = 'flex'; fallback.style.alignItems = 'center'; fallback.style.justifyContent = 'center'; this.parentNode.appendChild(fallback); this.remove(); }; return img; } function appendMessage(role, content, isError = false) { const isUser = role === 'user'; const div = document.createElement('div'); div.className = `message-row ${isUser ? 'user' : 'ai'}`; const avatarDiv = document.createElement('div'); avatarDiv.className = 'avatar-message'; avatarDiv.appendChild(createAvatarImg(role)); const wrapper = document.createElement('div'); wrapper.className = 'bubble-wrapper'; const bubble = document.createElement('div'); bubble.className = 'message-bubble'; if(isError) bubble.classList.add('error-bubble'); bubble.innerHTML = escapeHtml(content).replace(/\n/g, '<br>'); const meta = document.createElement('div'); meta.className = 'message-meta'; meta.innerHTML = `<span>${getFormattedTime()}</span>${isUser ? '<i class="fas fa-check status-icon"></i>' : ''}`; wrapper.appendChild(bubble); wrapper.appendChild(meta); div.appendChild(avatarDiv); div.appendChild(wrapper); messagesContainer.appendChild(div); scrollToBottom(); } function storeMessage(role, content) { messagesData.push({ role, content }); } function removeTyping() { if(currentTypingElement) { currentTypingElement.remove(); currentTypingElement = null; } } function showTyping() { removeTyping(); const typingDiv = document.createElement('div'); typingDiv.className = 'message-row ai'; const avatarDiv = document.createElement('div'); avatarDiv.className = 'avatar-message'; avatarDiv.appendChild(createAvatarImg('ai')); const wrapper = document.createElement('div'); wrapper.className = 'bubble-wrapper'; const bubble = document.createElement('div'); bubble.className = 'message-bubble'; bubble.style.padding = '12px 20px'; bubble.innerHTML = `<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`; wrapper.appendChild(bubble); typingDiv.appendChild(avatarDiv); typingDiv.appendChild(wrapper); messagesContainer.appendChild(typingDiv); scrollToBottom(); currentTypingElement = typingDiv; } async function fetchAIReply(history) { const apiMessages = [SYSTEM_PROMPT]; for(const msg of history) if(msg.role !== 'system') apiMessages.push({ role: msg.role, content: msg.content }); const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: "openai", messages: apiMessages, temperature: 0.7, max_tokens: 800 }) }); if(!res.ok) throw new Error(`API错误 ${res.status}`); const data = await res.json(); if(data?.choices?.[0]?.message?.content) return data.choices[0].message.content.trim(); throw new Error('无效回复'); } async function sendMessage() { if(isLoading) return; const text = messageInput.value.trim(); if(!text) return; messageInput.value = ''; appendMessage('user', text); storeMessage('user', text); isLoading = true; sendBtn.disabled = true; messageInput.disabled = true; showTyping(); try { const reply = await fetchAIReply(messagesData); removeTyping(); appendMessage('assistant', reply); storeMessage('assistant', reply); } catch(err) { console.error(err); removeTyping(); appendMessage('assistant', `❌ 抱歉，${err.message || '服务暂时不可用'}`, true); storeMessage('assistant', `[错误] ${err.message}`); } finally { isLoading = false; sendBtn.disabled = false; messageInput.disabled = false; messageInput.focus(); } } function initWelcome() { if(messagesData.length === 0) { const welcome = '我是野猪亨利AI,今天你道管了吗？💤'; appendMessage('assistant', welcome); storeMessage('assistant', welcome); } } sendBtn.addEventListener('click', sendMessage); messageInput.addEventListener('keypress', (e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }); loadTheme(); initWelcome(); messageInput.focus(); })(); </script></body></html>
